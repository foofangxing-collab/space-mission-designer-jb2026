                {availableInstruments.map((inst) => {
                  const active = selectedInstId === inst.id;
                  return (
                    <button
                      key={inst.id}
                      onClick={() => setSelectedInstId(inst.id)}
                      className={`w-full text-left p-3.5 rounded-xl border transition-all ${
                        active
                          ? 'bg-cyan-500/15 border-[#00E5FF] shadow-[0_0_18px_rgba(0,229,255,0.22)]'
                          : 'bg-[#091020]/80 border-cyan-500/25 hover:border-cyan-400/60'
                      }`}
                    >
                      <div className="flex items-center justify-between">
                        <span className="font-display text-lg font-bold text-white">{inst.name}</span>
                        <span className="font-mono-tech text-xs text-cyan-300">{inst.statLabel}</span>
                      </div>
                      <div className="text-[11px] text-slate-400 mt-1">{inst.tooltip}</div>
                    </button>
                  );
                })}
              </div>
            </div>

            <button
              onClick={() => setOpsStep('MOVING')}
              className="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-400 to-sky-500 text-[#070B14] font-display text-lg font-extrabold tracking-wider shadow-[0_0_24px_rgba(0,229,255,0.4)] hover:brightness-110 transition-all"
            >
              [ CONFIRM SELECTION ]
            </button>
          </div>
        )}

        {/* STEP 2: Moving to sample location */}
        {opsStep === 'MOVING' && (
          <div className="absolute bottom-6 left-1/2 -translate-x-1/2 px-5 py-2.5 rounded-full bg-[#070B14]/85 border border-cyan-400/50 font-mono-tech text-xs text-cyan-300 flex items-center gap-2.5">
            <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping" />
            DEPLOYING TO TARGET SAMPLE ZONE...
          </div>
        )}

        {/* STEP 2B: Target location reached -> single CTA */}
        {opsStep === 'READY_COLLECT' && (
          <div className="absolute bottom-7 left-1/2 -translate-x-1/2 flex flex-col items-center gap-3 z-20">
            <div className="px-4 py-1.5 rounded-full bg-[#070B14]/90 border border-emerald-400/60 font-mono-tech text-xs text-emerald-300">
              TARGET LOCATION REACHED
            </div>
            <button
              onClick={() => setOpsStep('COLLECTING')}
              className="px-7 py-3.5 rounded-xl bg-gradient-to-r from-cyan-400 to-sky-500 text-[#070B14] font-display text-xl font-extrabold tracking-wider shadow-[0_0_28px_rgba(0,229,255,0.5)] hover:scale-[1.02] transition-all"
            >
              [ START DATA COLLECTION ]
            </button>
          </div>
        )}

        {/* STEP 3: Minimal bottom status bar during 3D robotic arm & drill/scan sequence */}
        {opsStep === 'COLLECTING' && (
          <div className="absolute bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-[#070B14]/85 backdrop-blur-md border border-cyan-400/40 rounded-xl px-5 py-3 z-20">
            <div className="flex justify-between font-mono-tech text-xs text-cyan-300 mb-1.5">
              <span>COLLECTING SAMPLE ({activeInstObj.name})...</span>
              <span className="font-bold">{collectPct}%</span>
            </div>
            <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
              <div
                className="h-full bg-gradient-to-r from-cyan-400 to-sky-400 transition-all duration-100"
                style={{ width: `${collectPct}%` }}
              />
            </div>
          </div>
        )}

        {/* STEP 4 & 5: Collection Successful Banner + Generate Report CTA */}
        {opsStep === 'COMPLETE' && (
          <div className="absolute inset-0 flex flex-col items-center justify-center bg-[#070B14]/55 backdrop-blur-[2px] p-4 z-20">
            <div className="glass-card-selected rounded-2xl p-6 max-w-lg w-full text-center">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/20 border border-emerald-400/60 font-mono-tech text-xs text-emerald-300 mb-3">
                <CheckCircle2 className="w-4 h-4" />
                MISSION OBJECTIVE ACHIEVED
              </div>
              <h3 className="font-display text-3xl sm:text-4xl font-extrabold text-white mb-4">
                DATA COLLECTION SUCCESSFUL!
              </h3>
              <div className="grid grid-cols-3 gap-2.5 text-left mb-5">
                <div className="p-2.5 rounded-lg bg-[#070B14]/80 border border-cyan-500/25">
                  <div className="text-[10px] font-mono-tech text-slate-400">SAMPLE</div>
                  <div className="text-xs font-mono-tech font-bold text-emerald-400 mt-0.5">COMPLETE</div>
                </div>
                <div className="p-2.5 rounded-lg bg-[#070B14]/80 border border-cyan-500/25">
                  <div className="text-[10px] font-mono-tech text-slate-400">INSTRUMENT</div>
                  <div className="text-xs font-mono-tech font-bold text-cyan-300 mt-0.5">OPERATIONAL</div>
                </div>
                <div className="p-2.5 rounded-lg bg-[#070B14]/80 border border-cyan-500/25">
                  <div className="text-[10px] font-mono-tech text-slate-400">TRANSMISSION</div>
                  <div className="text-xs font-mono-tech font-bold text-emerald-400 mt-0.5">100% LOCKED</div>
                </div>
              </div>
              <div className="p-3 rounded-xl bg-cyan-950/40 border border-cyan-500/30 text-xs font-mono-tech text-cyan-200 mb-5">
                {hasSpectrometerOrDrill
                  ? `H2O SIGNATURE DETECTED: 5.4 wt% BOUND WATER ICE VERIFIED AT ${landingSite.name.toUpperCase()}`
                  : `OPTICAL ALBEDO SPIKE DETECTED: HIGH SURFACE REFLECTANCE CAPTURED (SPECTRAL CONFIRMATION PENDING)`}
              </div>
              <button
                onClick={onGenerateReport}
                className="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-400 to-sky-500 text-[#070B14] font-display text-xl font-extrabold tracking-wider shadow-[0_0_26px_rgba(0,229,255,0.45)] hover:brightness-110 transition-all"
              >
                [ GENERATE MISSION DATA REPORT → ]
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

// ============================================================================
// MAIN APPLICATION COMPONENT
// ============================================================================
function App() {
  // Act Flow State:
  // 'act0' -> Hero Landing
  // 'act1' -> Mission Target Coverflow
  // 'act2' -> Launch Vehicle Selection
  // 'act3a' -> Platform Selection
  // 'act3b' -> 5 Subsystems Builder
  // 'act4' -> Lunar Orbit Selection
  // 'act5' -> Resource Allocation & Radar
  // 'act6a' -> Pre-Launch Gate
  // 'act6b' -> Translunar Transfer Cutscene
  // 'act6c' -> South Pole Landing Zone Selection
  // 'act6d' -> Terminal Descent
  // 'act7' -> Explore & Collect Data
  // 'act8' -> Mission Summary
  const [act, setAct] = useState('act0');
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [howToPlayOpen, setHowToPlayOpen] = useState(false);

  // Act 1 Carousel Index (2 = Lunar South Pole active mission centered in 5-card deck)
  const activeMissionIndex = MISSIONS.findIndex((m) => !m.locked);
  const [missionIdx, setMissionIdx] = useState(activeMissionIndex >= 0 ? activeMissionIndex : 2);
  const [lockedShake, setLockedShake] = useState(false);
  const [dragOffsetPx, setDragOffsetPx] = useState(0);
  const dragStartXRef = useRef(null);
  const wheelLockRef = useRef(0);

  // Engineering Selections (All defaulted to first option index 0)
  const [rocketIdx, setRocketIdx] = useState(0); // First rocket: Falcon 9
  const [platformId, setPlatformId] = useState(PLATFORMS[0].id); // First platform: Blue Ghost Lander
  const [builderTab, setBuilderTab] = useState(0); // 0..4
  const [structureId, setStructureId] = useState(SUBSYSTEMS.structure[0].id); // First structure: Rigid Frame
  const [solarId, setSolarId] = useState(SUBSYSTEMS.solar[0].id); // First solar: Fixed Solar Array
  const [batteryId, setBatteryId] = useState(SUBSYSTEMS.battery[0].id); // First battery: Lithium-Ion Battery
  const [antennaId, setAntennaId] = useState(SUBSYSTEMS.antenna[0].id); // First antenna: Low-Gain Antenna
  const [instrumentIds, setInstrumentIds] = useState([SUBSYSTEMS.instruments[0].id]); // First instrument: Lunar Drill

  // Act 4 Orbit Index (First orbit: NRHO)
  const [orbitIdx, setOrbitIdx] = useState(0);

  // Act 5 Resource Allocation State
  const [resourceNode, setResourceNode] = useState(0); // 0..3
  const [powerSliders, setPowerSliders] = useState({
    science: 65,
    thermal: 45,
    comms: 35,
    avionics: 45
  });
  const [commMode, setCommMode] = useState('high_res'); // First option: 'high_res' | 'failsafe'

  // Act 6C Landing State (First site & first descent profile)
  const [landingSiteId, setLandingSiteId] = useState(LANDING_SITES[0].id); // First site: Nobile Rim
  const [descentProfileId, setDescentProfileId] = useState(DESCENT_PROFILES[0].id); // First profile: Fuel-Saver Ballistic

  // Act 8 Detailed Report Expand Toggle
  const [showDetailedReport, setShowDetailedReport] = useState(false);

  // Derived Engineering Telemetry
  const selectedRocket = ROCKETS[rocketIdx];
  const selectedPlatform = PLATFORMS.find((p) => p.id === platformId) || PLATFORMS[0];
  const selectedStructure = SUBSYSTEMS.structure.find((s) => s.id === structureId) || SUBSYSTEMS.structure[0];
  const selectedSolar = SUBSYSTEMS.solar.find((s) => s.id === solarId) || SUBSYSTEMS.solar[0];
  const selectedBattery = SUBSYSTEMS.battery.find((b) => b.id === batteryId) || SUBSYSTEMS.battery[0];
  const selectedAntenna = SUBSYSTEMS.antenna.find((a) => a.id === antennaId) || SUBSYSTEMS.antenna[0];
  const selectedInstruments = SUBSYSTEMS.instruments.filter((i) => instrumentIds.includes(i.id));
  const selectedOrbit = ORBITS[orbitIdx];
  const selectedLandingSite = LANDING_SITES.find((s) => s.id === landingSiteId) || LANDING_SITES[1];
  const selectedDescentProfile =
    DESCENT_PROFILES.find((d) => d.id === descentProfileId) || DESCENT_PROFILES[2];

  // Cost Calculation ($M)
  const spacecraftCostM = useMemo(() => {
    const instCost = selectedInstruments.reduce((sum, i) => sum + i.costM, 0);
    return (
      selectedPlatform.costM +
      selectedStructure.costM +
      selectedSolar.costM +
      selectedBattery.costM +
      selectedAntenna.costM +
      instCost
    );
  }, [selectedPlatform, selectedStructure, selectedSolar, selectedBattery, selectedAntenna, selectedInstruments]);

  const totalSpentM = Number((selectedRocket.costM + spacecraftCostM).toFixed(1));
  const remainingBudgetM = Number((TOTAL_MISSION_BUDGET_M - totalSpentM).toFixed(1));
  const isOverBudget = remainingBudgetM < 0;

  // Mass Calculation (kg)
  const totalMassKg = useMemo(() => {
    const instMass = selectedInstruments.reduce((sum, i) => sum + i.massKg, 0);
    return (
      selectedPlatform.dryMassKg +
      selectedStructure.massKg +
      selectedSolar.massKg +
      selectedBattery.massKg +
      selectedAntenna.massKg +
      instMass
    );
  }, [selectedPlatform, selectedStructure, selectedSolar, selectedBattery, selectedAntenna, selectedInstruments]);

  const effectiveMassLimitKg = selectedRocket.maxPayloadKg;
  const isOverweight = totalMassKg > effectiveMassLimitKg;

  // Power Generation & Draw (W)
  const effectiveSolarW = Math.round(selectedSolar.powerW * selectedOrbit.powerMultiplier);
  const instrumentDrawW = selectedInstruments.reduce((sum, i) => sum + i.drawW, 0);
  const nominalDrawW = selectedPlatform.basePowerDrawW + instrumentDrawW;
  const netPowerW = effectiveSolarW - nominalDrawW;

  // Comms Rate (Mbps)
  const effectiveCommsMbps = Number((selectedAntenna.rateMbps * selectedOrbit.commMultiplier).toFixed(1));

  // Act 5 Power Allocation Totals
  const totalAllocatedW =
    powerSliders.science + powerSliders.thermal + powerSliders.comms + powerSliders.avionics;
  const isPowerOverAllocated = totalAllocatedW > effectiveSolarW;

  const autoBalancePower = () => {
    const cap = Math.max(120, effectiveSolarW - 10);
    setPowerSliders({
      science: Math.round(cap * 0.34),
      thermal: Math.round(cap * 0.26),
      comms: Math.round(cap * 0.18),
      avionics: Math.round(cap * 0.22)
    });
  };

  // Toggle Instrument in Act 3B Step 5
  const toggleInstrument = (id) => {
    setInstrumentIds((prev) => {
      if (prev.includes(id)) {
        return prev.filter((x) => x !== id);
      }
      return [...prev, id];
    });
  };

  // Determine 5 Core Drawer Stage Statuses
  const drawerStages = useMemo(() => {
    const orderMap = {
      act0: 0,
      act1: 0,
      act2: 1,
      act3a: 1,
      act3b: 1,
      act4: 2,
      act5: 2,
      act6a: 3,
      act6b: 3,
      act6c: 3,
      act6d: 3,
      act7: 4,
      act8: 5
    };
    const curr = orderMap[act] ?? 0;
    return [
      { id: 1, label: '1. Spacecraft Builder', targetAct: 'act3a', status: curr > 1 ? 'done' : curr === 1 ? 'active' : 'locked' },
      { id: 2, label: '2. Resource Allocation', targetAct: 'act5', status: curr > 2 ? 'done' : curr === 2 ? 'active' : 'locked' },
      { id: 3, label: '3. Launch & Land', targetAct: 'act6a', status: curr > 3 ? 'done' : curr === 3 ? 'active' : 'locked' },
      { id: 4, label: '4. Explore & Collect Data', targetAct: 'act7', status: curr > 4 ? 'done' : curr === 4 ? 'active' : 'locked' },
      { id: 5, label: '5. Mission Summary', targetAct: 'act8', status: curr >= 5 ? 'active' : 'locked' }
    ];
  }, [act]);

  // Hard landing condition check
  const isHardLanding =
    isOverweight || (selectedLandingSite.slopeNum > 6.0 && selectedDescentProfile.id === 'ballistic');

  // Final Evaluation Score Calculation (Act 8)
  const missionEvaluation = useMemo(() => {
    const hasSpec = instrumentIds.includes('spectrometer');
    const hasDrill = instrumentIds.includes('drill');
    const hasCamOnly = instrumentIds.includes('camera') && !hasSpec && !hasDrill;

    // 1. Structural & Power Design
    let structPowerScore = 76 + selectedStructure.strengthBonus * 0.5;
    if (selectedSolar.id === 'deployable') structPowerScore += 12;
    if (netPowerW < 0) structPowerScore -= 18;
    if (isPowerOverAllocated) structPowerScore -= 10;
    structPowerScore = Math.max(40, Math.min(100, Math.round(structPowerScore)));

    // 2. Launch & Orbital Insertion
    let launchScore = isOverweight ? 52 : 94;
    if (selectedOrbit.id === 'nrho') launchScore = Math.min(100, launchScore + 5);

    // 3. South Pole Touchdown Precision
    let landingScore = selectedDescentProfile.precisionScore;
    if (isOverweight) landingScore -= 24;
    if (selectedLandingSite.id === 'shackleton') landingScore += 2;
    landingScore = Math.max(38, Math.min(100, Math.round(landingScore)));

    // 4. Science Data Downlink Rate
    let commsScore = selectedAntenna.id === 'high_gain' ? 96 : selectedAntenna.id === 'med_gain' ? 84 : 68;
    if (commMode === 'high_res') commsScore = Math.min(100, commsScore + 4);

    // 5. H2O Ice Spectral Verification
    let iceVerifyScore = 45;
    if (hasSpec && hasDrill) iceVerifyScore = 100;
    else if (hasSpec) iceVerifyScore = 88;
    else if (hasDrill) iceVerifyScore = 78;
    else if (hasCamOnly) iceVerifyScore = 48;

    // 6. Thermal & Battery Survival (critical if landing in Cabeus PSR)
    let thermalScore = 82;
    if (selectedLandingSite.id === 'cabeus') {
      thermalScore = selectedBattery.id === 'high_cap' ? 92 : selectedBattery.id === 'redundant' ? 80 : 48;
    } else if (selectedBattery.id === 'high_cap' || selectedBattery.id === 'redundant') {
      thermalScore = 95;
    }

    // 7. Budget Efficiency
    const budgetScore = remainingBudgetM >= 80 ? 98 : remainingBudgetM >= 25 ? 90 : remainingBudgetM >= 0 ? 80 : 30;

    const total = Math.round(
      structPowerScore * 0.16 +
        launchScore * 0.14 +
        landingScore * 0.16 +
        commsScore * 0.12 +
        iceVerifyScore * 0.22 +
        thermalScore * 0.1 +
        budgetScore * 0.1
    );

    let grade = 'C';
    if (total >= 91) grade = 'S';
    else if (total >= 82) grade = 'A';
    else if (total >= 70) grade = 'B';

    let chiefQuote =
      'Outstanding systems engineering. Your vertical polar solar geometry and dual neutron/NIR spectroscopy definitively verified bound H2O ice crystals at the Lunar South Pole.';
    if (hasCamOnly) {
      chiefQuote =
        'Touchdown achieved, but optical imaging alone triggered an OH/glint false positive. Without a Spectrometer or Subsurface Drill, true bound H2O ice remains unconfirmed.';
    } else if (isOverweight) {
      chiefQuote =
        'Payload exceeded launch vehicle lift margin, forcing a stressed terminal descent. Re-optimizing composite structures and launch lift will elevate this to an S-rank Artemis mission.';
    } else if (selectedLandingSite.id === 'cabeus' && selectedBattery.id === 'li_ion') {
      chiefQuote =
        'Brave descent into Cabeus Crater PSR! However, 12% solar illumination rapidly depleted standard Li-ion reserves before full core extraction completed.';
    }

    return {
      grade,
      total,
      chiefQuote,
      hasCamOnly,
      hasSpec,
      hasDrill,
      breakdown: [
        { label: 'Spacecraft Structure & Solar', score: structPowerScore, detail: `${selectedStructure.name} + ${selectedSolar.name}` },
        { label: 'Launch & Orbital Insertion', score: launchScore, detail: `${selectedRocket.name} → ${selectedOrbit.id.toUpperCase()}` },
        { label: 'South Pole Touchdown Precision', score: landingScore, detail: `${selectedLandingSite.name} (${selectedDescentProfile.name})` },
        { label: 'Science Data Downlink Rate', score: commsScore, detail: `${effectiveCommsMbps} Mbps (${commMode.toUpperCase()})` },
        { label: 'H2O Ice Spectral Verification', score: iceVerifyScore, detail: hasSpec && hasDrill ? 'Subsurface H2O Confirmed' : hasCamOnly ? 'Optical Glint False Positive' : 'Partial Volatile Assay' },
        { label: 'Cryo Thermal & Battery Survival', score: thermalScore, detail: `${selectedBattery.statLabel} @ ${selectedLandingSite.solar} Solar` },
        { label: 'Mission Budget Stewardship', score: budgetScore, detail: `$${remainingBudgetM}M Remaining of $300M` }
      ]
    };
  }, [
    instrumentIds,
    selectedStructure,
    selectedSolar,
    netPowerW,
    isPowerOverAllocated,
    isOverweight,
    selectedOrbit,
    selectedDescentProfile,
    selectedLandingSite,
    selectedAntenna,
    commMode,
    selectedBattery,
    remainingBudgetM,
    effectiveCommsMbps
  ]);

  // Reset entire design for New Mission (All defaults set to first item)
  const handleNewDesign = () => {
    setRocketIdx(0);
    setPlatformId(PLATFORMS[0].id);
    setBuilderTab(0);
    setStructureId(SUBSYSTEMS.structure[0].id);
    setSolarId(SUBSYSTEMS.solar[0].id);
    setBatteryId(SUBSYSTEMS.battery[0].id);
    setAntennaId(SUBSYSTEMS.antenna[0].id);
    setInstrumentIds([SUBSYSTEMS.instruments[0].id]);
    setOrbitIdx(0);
    setResourceNode(0);
    setCommMode('high_res');
    setLandingSiteId(LANDING_SITES[0].id);
    setDescentProfileId(DESCENT_PROFILES[0].id);
    setShowDetailedReport(false);
    setAct('act1');
  };

  return (
    <div className="min-h-screen space-grid-bg text-slate-100 relative selection:bg-cyan-400 selection:text-slate-950">
      <FontAndStyleInjector />
      <StarfieldLayer />

      {/* ====================================================================
          GLOBAL TOP HUD BAR & COLLAPSIBLE STAGE DRAWER
      ==================================================================== */}
      <header className="sticky top-0 z-50 w-full px-4 sm:px-6 py-3 bg-[#070B14]/80 backdrop-blur-md border-b border-cyan-500/20">
        <div className="max-w-7xl mx-auto flex items-center justify-between gap-3">
          {/* Top-Left Hamburger + Title */}
          <div className="flex items-center gap-3">
            <button
              onClick={() => setDrawerOpen(true)}
              aria-label="Open Mission Stages Drawer"
              className="w-9 h-9 rounded-lg bg-[#0E1629] border border-cyan-500/30 hover:border-[#00E5FF] flex items-center justify-center text-cyan-300 transition-colors"
            >
              <Menu className="w-5 h-5" />
            </button>
            <button
              onClick={() => setAct('act0')}
              className="text-left flex items-center gap-2 group"
            >
              <span className="font-display text-xl sm:text-2xl font-extrabold tracking-wider text-white group-hover:text-cyan-300 transition-colors">
                SPACE MISSION DESIGNER
              </span>
            </button>
          </div>

          {/* Top-Right Compact Telemetry Capsule HUD */}
          {act !== 'act0' && act !== 'act8' && (
            <div className="flex items-center gap-2 sm:gap-4 px-3 sm:px-4 py-1.5 rounded-full bg-[#0E1629]/90 border border-cyan-500/30 font-mono-tech text-[11px] sm:text-xs shadow-[0_0_20px_rgba(0,0,0,0.5)]">
              <div className="flex items-center gap-1.5">
                <span className="text-slate-400 hidden md:inline">BUDGET</span>
                <span className={`font-bold ${isOverBudget ? 'text-red-400 animate-pulse' : 'text-emerald-400'}`}>
                  ${remainingBudgetM}M
                </span>
              </div>
              <span className="text-slate-700">|</span>
              <div className="flex items-center gap-1.5">
                <span className="text-slate-400 hidden md:inline">MASS</span>
                <span className={`font-bold ${isOverweight ? 'text-red-400 animate-pulse' : 'text-cyan-300'}`}>
                  {totalMassKg}/{effectiveMassLimitKg}kg
                </span>
              </div>
              <span className="text-slate-700 hidden sm:inline">|</span>
              <div className="hidden sm:flex items-center gap-1.5">
                <span className="text-slate-400 hidden md:inline">POWER</span>
                <span className={`font-bold ${netPowerW < 0 ? 'text-amber-400' : 'text-cyan-300'}`}>
                  {netPowerW >= 0 ? `+${netPowerW}W` : `${netPowerW}W`}
                </span>
              </div>
              <span className="text-slate-700 hidden lg:inline">|</span>
              <div className="hidden lg:flex items-center gap-1.5">
                <span className="text-slate-400">COMMS</span>
                <span className="font-bold text-sky-300">{effectiveCommsMbps} Mbps</span>
              </div>
            </div>
          )}
        </div>
      </header>

      {/* Collapsible Left Navigation Drawer */}
      {drawerOpen && (
        <div className="fixed inset-0 z-[100] flex">
          <div
            className="fixed inset-0 bg-[#070B14]/70 backdrop-blur-xs"
            onClick={() => setDrawerOpen(false)}
          />
          <aside className="relative z-10 w-80 max-w-[85vw] h-full bg-[#0B1222]/95 backdrop-blur-xl border-r border-cyan-500/30 p-6 flex flex-col justify-between shadow-2xl">
            <div>
              <div className="flex items-center justify-between pb-4 border-b border-cyan-500/20">
                <div>
                  <div className="text-[10px] font-mono-tech text-cyan-400">ARTEMIS // CLPS TELEMETRY</div>
                  <div className="font-display text-xl font-bold text-white">MISSION ARCHITECTURE</div>
                </div>
                <button
                  onClick={() => setDrawerOpen(false)}
                  className="w-8 h-8 rounded-lg border border-slate-700 hover:border-cyan-400 flex items-center justify-center text-slate-300 hover:text-cyan-300"
                >
                  <X className="w-4 h-4" />
                </button>
              </div>

              <nav className="mt-6 space-y-2.5">
                {drawerStages.map((st) => {
                  const isActive = st.status === 'active';
                  const isDone = st.status === 'done';
                  const isLocked = st.status === 'locked';
                  return (
                    <button
                      key={st.id}
                      disabled={isLocked}
                      onClick={() => {
                        if (!isLocked) {
                          setAct(st.targetAct);
                          setDrawerOpen(false);
                        }
                      }}
                      className={`w-full flex items-center justify-between px-4 py-3.5 rounded-xl border text-left transition-all ${
                        isActive
                          ? 'bg-cyan-500/15 border-[#38BDF8] shadow-[0_0_20px_rgba(56,189,248,0.25)] text-white'
                          : isDone
                          ? 'bg-[#0E1629]/80 border-emerald-500/35 text-slate-200 hover:border-emerald-400'
                          : 'bg-[#090E1A]/60 border-slate-800/80 text-slate-500 cursor-not-allowed'
                      }`}
                    >
                      <span className="font-display text-lg font-bold tracking-wide">{st.label}</span>
                      {isActive && (
                        <span className="w-3 h-3 rounded-full bg-[#38BDF8] shadow-[0_0_10px_#38BDF8] animate-pulse" />
                      )}
                      {isDone && (
                        <span className="w-5 h-5 rounded-full bg-emerald-500/20 border border-[#10B981] text-[#10B981] flex items-center justify-center">
                          <Check className="w-3.5 h-3.5" />
                        </span>
                      )}
                      {isLocked && <Lock className="w-4 h-4 text-slate-600" />}
                    </button>
                  );
                })}
              </nav>
            </div>

            <div className="p-3.5 rounded-xl bg-[#070B14] border border-cyan-500/20 font-mono-tech text-[11px] text-slate-400">
              <div>TARGET: LUNAR SOUTH POLE</div>
              <div className="text-cyan-400 mt-0.5">LAT 89.5° S // SHACKLETON SECTOR</div>
            </div>
          </aside>
        </div>
      )}

      {/* ====================================================================
          MAIN VIEWPORT ROUTER (ACT 0 — ACT 8)
      ==================================================================== */}
      <main className="relative z-10">
        {/* ==================================================================
            ACT 0: HERO LANDING SCREEN
        ================================================================== */}
        {act === 'act0' && (
          <section className="max-w-6xl mx-auto px-6 py-10 sm:py-16 min-h-[calc(100vh-68px)] flex items-center">
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-8 items-center w-full">
              {/* Left 6 Columns */}
              <div className="lg:col-span-6 space-y-6">
                <div className="inline-flex items-center gap-2.5 px-3.5 py-1.5 rounded-full bg-cyan-950/50 border border-cyan-400/40 font-mono-tech text-[11px] text-cyan-300 tracking-wider">
                  <span className="w-2 h-2 rounded-full bg-[#00E5FF]" />
                  <span>NASA-INSPIRED SIMULATION</span>
                  <span className="text-cyan-500">•</span>
                  <span>ARTEMIS &amp; CLPS ERA</span>
                </div>

                <h1 className="font-display text-6xl sm:text-7xl lg:text-[82px] font-extrabold leading-[0.94] tracking-tight">
                  <span className="block text-white">SPACE MISSION</span>
                  <span className="block bg-gradient-to-r from-[#00E5FF] via-[#38BDF8] to-blue-400 bg-clip-text text-transparent">
                    DESIGNER
                  </span>
                </h1>

                <p className="text-slate-300 text-base sm:text-lg leading-relaxed max-w-xl">
                  Engineer a lunar spacecraft, balance mass and polar solar power, land at the Lunar South Pole, and verify hidden water ice deposits.
                </p>

                <div className="pt-2">
                  <button
                    onClick={() => setAct('act1')}
                    className="group inline-flex items-center gap-3 px-8 py-4 rounded-xl bg-gradient-to-r from-[#00E5FF] to-[#0284C7] text-[#070B14] font-display text-2xl font-extrabold tracking-wider shadow-[0_0_32px_rgba(0,229,255,0.42)] hover:shadow-[0_0_42px_rgba(0,229,255,0.68)] hover:-translate-y-0.5 transition-all"
                  >
                    <span>START DESIGN</span>
                    <ArrowRight className="w-6 h-6 group-hover:translate-x-1 transition-transform" />
                  </button>
                </div>
              </div>

              {/* Right 6 Columns: Shaded Lunar Vector + South Pole PSR Beacon */}
              <div className="lg:col-span-6 flex justify-center">
                <svg viewBox="0 0 460 440" className="w-full max-w-[440px] select-none overflow-visible">
                  <defs>
                    <radialGradient id="heroMoonShade" cx="36%" cy="32%" r="68%">
                      <stop offset="0%" stopColor="#475569" />
                      <stop offset="48%" stopColor="#1E293B" />
                      <stop offset="85%" stopColor="#0F172A" />
                      <stop offset="100%" stopColor="#070B14" />
                    </radialGradient>
                    <radialGradient id="southPoleGlow" cx="50%" cy="50%" r="50%">
                      <stop offset="0%" stopColor="#00E5FF" stopOpacity="0.65" />
                      <stop offset="100%" stopColor="#00E5FF" stopOpacity="0" />
                    </radialGradient>
                  </defs>

                  {/* Concentric Dashed Orbital Rings */}
                  <circle
                    cx="245"
                    cy="205"
                    r="175"
                    fill="none"
                    stroke="rgba(56, 189, 248, 0.22)"
                    strokeWidth="1.2"
                    strokeDasharray="6 6"
                  />
                  <ellipse
                    cx="245"
                    cy="205"
                    rx="196"
                    ry="86"
                    transform="rotate(-22 245 205)"
                    fill="none"
                    stroke="rgba(0, 229, 255, 0.35)"
                    strokeWidth="1.4"
                    strokeDasharray="5 5"
                  />

                  {/* Dark Slate Shaded Moon Body */}
                  <circle
                    cx="245"
                    cy="205"
                    r="134"
                    fill="url(#heroMoonShade)"
                    stroke="rgba(148, 163, 184, 0.28)"
                    strokeWidth="1.5"
                  />

                  {/* Subtle Crater Silhouettes */}
                  <circle cx="205" cy="165" r="22" fill="rgba(15, 23, 42, 0.45)" stroke="rgba(148,163,184,0.12)" />
                  <circle cx="282" cy="185" r="30" fill="rgba(15, 23, 42, 0.4)" stroke="rgba(148,163,184,0.1)" />
                  <circle cx="222" cy="245" r="18" fill="rgba(15, 23, 42, 0.5)" stroke="rgba(148,163,184,0.14)" />
                  <circle cx="268" cy="285" r="14" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(56,189,248,0.2)" />

                  {/* South Pole Beacon Glow & Pulse */}
                  <circle cx="245" cy="337" r="28" fill="url(#southPoleGlow)" />
                  <circle cx="245" cy="337" r="9" fill="none" stroke="#00E5FF" strokeWidth="1.5" className="animate-beacon" />
                  <circle cx="245" cy="337" r="4.5" fill="#00E5FF" />

                  {/* Diagonal Dashed Cyan Callout Line to Bottom-Left Label */}
                  <polyline
                    points="245,337 185,392 155,392"
                    fill="none"
                    stroke="#00E5FF"
                    strokeWidth="1.5"
                    strokeDasharray="4 4"
                  />
                  <text
                    x="148"
                    y="396"
                    textAnchor="end"
                    fill="#00E5FF"
                    fontSize="11.5"
                    fontFamily="JetBrains Mono, monospace"
                    fontWeight="700"
                  >
                    LUNAR SOUTH POLE // PSR TARGET
                  </text>
                </svg>
              </div>
            </div>
          </section>
        )}

        {/* ==================================================================
            ACT 1: CHOOSE MISSION TARGET (3-CARD COVERFLOW CAROUSEL)
        ================================================================== */}
        {act === 'act1' && (
          <section className="relative max-w-6xl mx-auto px-4 sm:px-6 py-8 sm:py-12 overflow-hidden">
            {/* Subtle Geometric Lunar Ring Watermark on Right */}
            <svg
              viewBox="0 0 320 320"
              className="hidden md:block absolute -right-12 top-2 w-80 h-80 opacity-15 pointer-events-none"
            >
              <circle cx="160" cy="160" r="130" fill="none" stroke="#38BDF8" strokeWidth="1.5" />
              <circle cx="160" cy="160" r="95" fill="none" stroke="#00E5FF" strokeWidth="1" strokeDasharray="6 6" />
              <circle cx="160" cy="160" r="55" fill="none" stroke="#38BDF8" strokeWidth="1" />
            </svg>

            {/* Top Left Title */}
            <div className="mb-6 flex flex-wrap items-end justify-between gap-4">
              <div>
                <div className="font-mono-tech text-xs text-cyan-400 tracking-widest mb-1">
                  SELECT EXPEDITION PROFILE
                </div>
                <h2 className="font-display text-4xl sm:text-5xl font-extrabold text-white">
                  CHOOSE MISSION TARGET
                </h2>
              </div>
              <div className="font-mono-tech text-[11px] text-slate-400">
                DRAG, SCROLL OR CLICK CARDS TO BROWSE ({missionIdx + 1} / {MISSIONS.length})
              </div>
            </div>

            {/* Smooth Multi-Card Continuous Coverflow Deck (5 Cards with Pointer Drag + Wheel) */}
            <div
              className="relative h-[340px] sm:h-[360px] flex items-center justify-center select-none touch-pan-y cursor-grab active:cursor-grabbing"
              onPointerDown={(e) => {
                dragStartXRef.current = e.clientX;
              }}
              onPointerMove={(e) => {
                if (dragStartXRef.current === null) return;
                const delta = e.clientX - dragStartXRef.current;
                setDragOffsetPx(Math.max(-140, Math.min(140, delta)));
              }}
              onPointerUp={(e) => {
                if (dragStartXRef.current === null) return;
                const diff = e.clientX - dragStartXRef.current;
                const total = MISSIONS.length;
                if (diff > 40) setMissionIdx((i) => (i - 1 + total) % total);
                else if (diff < -40) setMissionIdx((i) => (i + 1) % total);
                dragStartXRef.current = null;
                setDragOffsetPx(0);
              }}
              onPointerCancel={() => {
                dragStartXRef.current = null;
                setDragOffsetPx(0);
              }}
              onWheel={(e) => {
                const now = performance.now();
                if (now - wheelLockRef.current < 240) return;
                if (Math.abs(e.deltaX) > 15 || Math.abs(e.deltaY) > 15) {
                  wheelLockRef.current = now;
                  const dir = (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) > 0 ? 1 : -1;
                  const total = MISSIONS.length;
                  setMissionIdx((i) => (i + dir + total) % total);
                }
              }}
            >
              {MISSIONS.map((card, idx) => {
                const total = MISSIONS.length;
                let offset = idx - missionIdx;
                if (offset > Math.floor(total / 2)) offset -= total;
                if (offset < -Math.floor(total / 2)) offset += total;

                const absOff = Math.abs(offset);
                if (absOff > 2) return null;

                const isCenter = offset === 0;
                const isLocked = card.locked;
                const baseTranslateX = offset * 270 + dragOffsetPx * 0.45;
                const scale = isCenter ? 1.0 : absOff === 1 ? 0.86 : 0.74;
                const opacity = isCenter ? 1 : absOff === 1 ? 0.58 : 0.25;
                const zIndex = 30 - absOff * 10;

                return (
                  <div
                    key={card.id}
                    onClick={() => {
                      if (Math.abs(dragOffsetPx) < 8) setMissionIdx(idx);
                    }}
                    style={{
                      transform: `translate3d(${baseTranslateX}px, 0, 0) scale(${scale})`,
                      opacity,
                      zIndex,
                      transition:
                        dragStartXRef.current !== null
                          ? 'none'
                          : 'transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease'
                    }}
                    className={`absolute w-[88vw] max-w-md cursor-pointer rounded-2xl p-6 ${
                      isCenter
                        ? isLocked
                          ? 'bg-[#0E1629]/95 border border-slate-600 shadow-2xl'
                          : 'glass-card-selected'
                        : 'bg-[#0A101E]/85 border border-slate-800/90 hover:opacity-80'
                    } ${isCenter && lockedShake ? 'animate-shake' : ''}`}
                  >
                    <div>
                      <div className="flex items-center justify-between gap-2 mb-4">
                        <span
                          className={`px-2.5 py-1 rounded-full font-mono-tech text-[10px] font-bold ${
                            isLocked
                              ? 'bg-slate-800 text-slate-400 border border-slate-700'
                              : 'bg-cyan-500/15 text-cyan-300 border border-cyan-400/50'
                          }`}
                        >
                          {card.badge}
                        </span>
                        <span
                          className={`font-mono-tech text-xs font-bold ${
                            isLocked ? 'text-slate-500' : 'text-emerald-400'
                          }`}
                        >
                          BUDGET: {card.budget}
                        </span>
                      </div>

                      <h3
                        className={`font-display text-2xl sm:text-3xl font-extrabold mb-3 ${
                          isLocked ? 'text-slate-400' : 'text-white'
                        }`}
                      >
                        {card.title}
                      </h3>

                      <p className={`text-sm leading-relaxed mb-6 ${isLocked ? 'text-slate-500' : 'text-slate-300'}`}>
                        {card.description}
                      </p>
                    </div>

                    {isLocked ? (
                      <div className="pt-3 border-t border-slate-800 flex items-center gap-2 font-mono-tech text-xs text-slate-500">
                        <Lock className="w-4 h-4" />
                        <span>{card.clearance}</span>
                      </div>
                    ) : (
                      <div className="pt-4 border-t border-cyan-500/25 grid grid-cols-3 gap-2">
                        {card.footer.map((f) => (
                          <div key={f.label}>
                            <div className="text-[10px] font-mono-tech text-slate-400">{f.label}</div>
                            <div className="text-xs font-mono-tech font-bold text-cyan-300 mt-0.5">{f.value}</div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Pagination Dots Indicator */}
            <div className="flex items-center justify-center gap-2 mt-2">
              {MISSIONS.map((m, idx) => (
                <button
                  key={m.id}
                  onClick={() => setMissionIdx(idx)}
                  aria-label={`Select ${m.title}`}
                  className={`h-2 rounded-full transition-all ${
                    idx === missionIdx
                      ? m.locked
                        ? 'w-7 bg-slate-400'
                        : 'w-7 bg-[#00E5FF] shadow-[0_0_10px_#00E5FF]'
                      : 'w-2 bg-slate-700 hover:bg-slate-500'
                  }`}
                />
              ))}
            </div>

            {/* Bottom Actions */}
            <div className="mt-6 flex flex-wrap items-center justify-center gap-4">
              {MISSIONS[missionIdx].locked ? (
                <>
                  <button
                    onClick={() => {
                      setLockedShake(true);
                      setTimeout(() => setLockedShake(false), 450);
                    }}
                    className="px-6 py-3.5 rounded-xl bg-slate-800/90 border border-slate-700 text-slate-400 font-display text-xl font-bold tracking-wider cursor-not-allowed"
                  >
                    🔒 LOCKED // COMING SOON
                  </button>
                  <button
                    onClick={() => setMissionIdx(activeMissionIndex)}
                    className="px-6 py-3.5 rounded-xl border border-cyan-400 text-cyan-300 hover:bg-cyan-500/15 font-display text-xl font-bold tracking-wider transition-all"
                  >
                    RETURN TO ACTIVE MISSION
                  </button>
                </>
              ) : (
                <>
                  <button
                    onClick={() => setHowToPlayOpen(true)}
                    className="px-6 py-3.5 rounded-xl border border-cyan-500/40 hover:border-cyan-300 text-cyan-200 hover:bg-cyan-500/10 font-display text-xl font-bold tracking-wider transition-all"
                  >
                    HOW TO PLAY
                  </button>
                  <button
                    onClick={() => setAct('act2')}
                    className="px-8 py-3.5 rounded-xl bg-gradient-to-r from-[#00E5FF] to-[#0284C7] text-[#070B14] font-display text-xl font-extrabold tracking-wider shadow-[0_0_26px_rgba(0,229,255,0.4)] hover:brightness-110 transition-all"
                  >
                    START MISSION &gt;
                  </button>
                </>
              )}
            </div>

            {/* How To Play Modal */}
            {howToPlayOpen && (
              <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-[#070B14]/80 backdrop-blur-sm">
                <div className="glass-card-selected rounded-2xl max-w-lg w-full p-6">
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="font-display text-2xl font-extrabold text-white">
                      MISSION ENGINEERING BRIEFING
                    </h3>
                    <button
                      onClick={() => setHowToPlayOpen(false)}
                      className="w-8 h-8 rounded-lg border border-slate-700 flex items-center justify-center text-slate-300 hover:border-cyan-400"
                    >
                      <X className="w-4 h-4" />
                    </button>
                  </div>
                  <div className="space-y-3 text-xs sm:text-sm text-slate-300 leading-relaxed">
                    <p>
                      <strong className="text-cyan-300 font-mono-tech">1. LAUNCH &amp; MASS BUDGET:</strong> Select a launch vehicle within your $300M budget and keep total spacecraft mass below the rocket&apos;s payload limit.
                    </p>
                    <p>
                      <strong className="text-cyan-300 font-mono-tech">2. POLAR SOLAR GEOMETRY:</strong> At 89.5° S, sunlight skims the horizon. Vertical deployable solar arrays generate peak grazing power.
                    </p>
                    <p>
                      <strong className="text-cyan-300 font-mono-tech">3. H2O ICE VERIFICATION:</strong> Surface glint can mimic ice (OH false positives). Equip a <span className="text-white font-semibold">Spectrometer</span> and <span className="text-white font-semibold">Lunar Drill</span> for definitive proof!
                    </p>
                  </div>
                  <button
                    onClick={() => setHowToPlayOpen(false)}
                    className="mt-6 w-full py-3 rounded-xl bg-cyan-400 text-slate-950 font-display text-lg font-extrabold"
                  >
                    UNDERSTOOD
                  </button>
                </div>
              </div>
            )}
          </section>
        )}

        {/* ==================================================================
            ACT 2: HOLOGRAPHIC FRAMELESS LAUNCH VEHICLE SELECTION
        ================================================================== */}
        {act === 'act2' && (
          <section className="relative max-w-6xl mx-auto px-4 sm:px-6 py-6">
            {/* Top-Left Stage Header */}
            <div className="flex flex-wrap items-end justify-between gap-4 mb-2">
              <div>
                <div className="font-mono-tech text-xs text-cyan-400 tracking-widest">
                  STAGE 02 // LAUNCH VEHICLE SELECTION
                </div>
                <h2 className="font-display text-4xl sm:text-5xl font-extrabold text-white">
                  SELECT LAUNCH VEHICLE
                </h2>
              </div>

              {isOverweight && (
                <div className="px-3.5 py-1.5 rounded-lg bg-red-500/20 border border-red-400 text-red-300 font-mono-tech text-xs font-bold flex items-center gap-2 animate-pulse">
                  <AlertTriangle className="w-4 h-4" />
                  <span>OVERWEIGHT ({totalMassKg} kg &gt; {selectedRocket.maxPayloadKg} kg LIMIT)</span>
                </div>
              )}
            </div>

            {/* Frameless 3D Coverflow Stage + Floating Edge « and » Buttons */}
            <div className="relative flex items-center justify-center">
              <button
                onClick={() => setRocketIdx((i) => (i + 2) % 3)}
                aria-label="Previous Launch Vehicle"
                className="absolute left-0 sm:left-2 z-20 w-12 h-12 rounded-xl bg-[#0E1629]/75 hover:bg-cyan-500/20 border border-cyan-400/40 hover:border-[#00E5FF] text-cyan-300 flex items-center justify-center shadow-[0_0_20px_rgba(0,229,255,0.2)] hover:-translate-x-0.5 transition-all"
              >
                <ChevronsLeft className="w-6 h-6" />
              </button>

              <Rocket3DViewport selectedRocketIdx={rocketIdx} onSelectRocket={setRocketIdx} />

              <button
                onClick={() => setRocketIdx((i) => (i + 1) % 3)}
                aria-label="Next Launch Vehicle"
                className="absolute right-0 sm:right-2 z-20 w-12 h-12 rounded-xl bg-[#0E1629]/75 hover:bg-cyan-500/20 border border-cyan-400/40 hover:border-[#00E5FF] text-cyan-300 flex items-center justify-center shadow-[0_0_20px_rgba(0,229,255,0.2)] hover:translate-x-0.5 transition-all"
              >
                <ChevronsRight className="w-6 h-6" />
              </button>
            </div>

            {/* Frameless Holographic Telemetry Specs Under Center Ring */}
            <div className="text-center max-w-2xl mx-auto mt-1">
              <div className="font-mono-tech text-xs text-cyan-400 tracking-widest">
                {selectedRocket.subtitle}
              </div>
              <h3 className="font-display text-3xl sm:text-4xl font-extrabold text-white mt-0.5 flex items-center justify-center">
                {selectedRocket.name}
                <InfoTooltip text={selectedRocket.tooltip} />
              </h3>

              <div className="mt-4 grid grid-cols-3 gap-3 sm:gap-6 py-3 px-4 border-y border-cyan-500/25 font-mono-tech">
                <div>
                  <div className="text-[10px] sm:text-[11px] text-slate-400">LAUNCH COST</div>
                  <div className="text-base sm:text-xl font-bold text-emerald-400 mt-0.5">
                    ${selectedRocket.costM}M
                  </div>
                </div>
                <div className="border-x border-cyan-500/20">
                  <div className="text-[10px] sm:text-[11px] text-slate-400">MAX PAYLOAD</div>
                  <div className="text-base sm:text-xl font-bold text-cyan-300 mt-0.5">
                    {selectedRocket.maxPayloadKg.toLocaleString()} kg
                  </div>
                </div>
                <div>
                  <div className="text-[10px] sm:text-[11px] text-slate-400">RELIABILITY</div>
                  <div className="text-base sm:text-xl font-bold text-white mt-0.5">
                    {selectedRocket.reliability}
                  </div>
                </div>
              </div>
            </div>

            {/* Bottom Navigation */}
            <div className="mt-7 flex items-center justify-between">
              <button
                onClick={() => setAct('act1')}
                className="px-5 py-3 rounded-xl border border-slate-600 hover:border-cyan-400 text-slate-300 hover:text-white font-display text-lg font-bold tracking-wider transition-colors"
              >
                &lt; BACK
              </button>
              <button
                onClick={() => setAct('act3a')}
                className="px-7 py-3 rounded-xl bg-gradient-to-r from-[#00E5FF] to-[#0284C7] text-[#070B14] font-display text-xl font-extrabold tracking-wider shadow-[0_0_24px_rgba(0,229,255,0.4)] hover:brightness-110 transition-all"
              >
                BUILD SPACECRAFT &gt;
              </button>
            </div>
          </section>
        )}

        {/* ==================================================================
            ACT 3 (3A & 3B): STAGE 01 SPACECRAFT BUILDER
        ================================================================== */}
        {(act === 'act3a' || act === 'act3b') && (
          <section className="max-w-7xl mx-auto px-4 sm:px-6 py-6">
            <div className="mb-4">
              <div className="font-mono-tech text-xs text-cyan-400 tracking-widest">
                STAGE 01 // SPACECRAFT ARCHITECTURE &amp; SUBSYSTEMS
              </div>
              <h2 className="font-display text-3xl sm:text-4xl font-extrabold text-white">
                {act === 'act3a' ? 'CHOOSE LANDER OR ROVER BUS' : 'CONFIGURE FLIGHT SUBSYSTEMS'}
              </h2>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              {/* LEFT COLUMN (~42% -> 5 cols): Persistent 3D Telemetry Model & Live Bars */}
              <div className="lg:col-span-5 glass-card rounded-2xl p-4 sm:p-5">
                <div className="flex items-center justify-between mb-2">
                  <span className="font-mono-tech text-xs font-bold text-cyan-300">
                    3D TELEMETRY MODEL
                  </span>
                  <span className="font-mono-tech text-[10px] text-slate-400">
                    DRAG TO ROTATE 360°
                  </span>
                </div>

                <div className="rounded-xl bg-[#070B14]/70 border border-cyan-500/20 overflow-hidden">
                  <SpacecraftBuilder3D
                    platform={selectedPlatform}
                    structure={selectedStructure}
                    solar={selectedSolar}
                    battery={selectedBattery}
                    antenna={selectedAntenna}
                    instruments={instrumentIds}
                  />
                </div>

                {/* Mass vs Rocket Limit Bar */}
                <div className="mt-4">
                  <div className="flex justify-between font-mono-tech text-xs mb-1">
                    <span className="text-slate-400">MASS VS ROCKET LIMIT</span>
                    <span className={isOverweight ? 'text-red-400 font-bold' : 'text-cyan-300 font-bold'}>
                      {totalMassKg} / {effectiveMassLimitKg} kg
                    </span>
                  </div>
                  <div className="h-2.5 bg-slate-800 rounded-full overflow-hidden">
                    <div
                      className={`h-full transition-all duration-300 ${
                        isOverweight ? 'bg-red-500' : 'bg-gradient-to-r from-cyan-400 to-sky-500'
                      }`}
                      style={{ width: `${Math.min(100, (totalMassKg / effectiveMassLimitKg) * 100)}%` }}
                    />
                  </div>
                </div>

                {/* 3 Mini Telemetry Cards */}
                <div className="mt-3.5 grid grid-cols-3 gap-2.5 font-mono-tech">
                  <div className="p-2.5 rounded-xl bg-[#070B14]/75 border border-cyan-500/20">
                    <div className="text-[10px] text-slate-400">GEN POWER</div>
                    <div className="text-sm font-bold text-cyan-300 mt-0.5">{selectedSolar.powerW} W</div>
                  </div>
                  <div className="p-2.5 rounded-xl bg-[#070B14]/75 border border-cyan-500/20">
                    <div className="text-[10px] text-slate-400">BATTERY</div>
                    <div className="text-sm font-bold text-emerald-400 mt-0.5">{selectedBattery.capacityWh} Wh</div>
                  </div>
                  <div className="p-2.5 rounded-xl bg-[#070B14]/75 border border-cyan-500/20">
                    <div className="text-[10px] text-slate-400">COMMS</div>
                    <div className="text-sm font-bold text-sky-300 mt-0.5">{selectedAntenna.rateMbps} Mbps</div>
                  </div>
                </div>
              </div>

              {/* RIGHT COLUMN (~55% -> 7 cols): Step 3A Platform OR Step 3B 5 Subsystems */}
              <div className="lg:col-span-7">
                {act === 'act3a' ? (
                  <div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      {PLATFORMS.map((plat) => {
                        const isSelected = platformId === plat.id;
                        return (
                          <div
                            key={plat.id}
                            onClick={() => setPlatformId(plat.id)}
                            className={`cursor-pointer rounded-2xl p-5 flex flex-col justify-between ${
                              isSelected ? 'glass-card-selected' : 'glass-card hover:border-cyan-400/50'
                            }`}
                          >
                            <div>
                              <div className="flex items-center justify-between text-xs font-mono-tech mb-2">
                                <span className="text-cyan-400">{plat.vendor}</span>
                                <span className="text-emerald-400 font-bold">${plat.costM}M</span>
                              </div>
                              <h3 className="font-display text-2xl font-extrabold text-white flex items-center">
                                {plat.name}
                                <InfoTooltip text={plat.tooltip} />
                              </h3>
                              <p className="text-xs text-slate-300 leading-relaxed mt-2 mb-4">
                                {plat.description}
                              </p>

                              <div className="space-y-2 pt-3 border-t border-cyan-500/20 font-mono-tech text-xs">
                                <div className="flex justify-between">
                                  <span className="text-slate-400">DRY MASS / LIMIT</span>
                                  <span className="text-white font-bold">
                                    {plat.dryMassKg} / {plat.structLimitKg} kg
                                  </span>
                                </div>
                                <div className="flex justify-between">
                                  <span className="text-slate-400">BASE POWER DRAW</span>
                                  <span className="text-amber-300 font-bold">{plat.basePowerDrawW} W</span>
                                </div>
                              </div>
                            </div>

                            <button
                              type="button"
                              onClick={() => setPlatformId(plat.id)}
                              className={`mt-5 w-full py-2.5 rounded-xl font-display text-lg font-bold tracking-wider transition-all ${
                                isSelected
                                  ? 'bg-[#00E5FF] text-[#070B14] shadow-[0_0_18px_rgba(0,229,255,0.45)]'
                                  : 'bg-slate-800/80 border border-cyan-500/30 text-cyan-200 hover:bg-cyan-500/20'
                              }`}
                            >
                              {isSelected ? 'SELECTED' : 'SELECT'}
                            </button>
                          </div>
                        );
                      })}
                    </div>

                    <div className="mt-6 flex items-center justify-between">
                      <button
                        onClick={() => setAct('act2')}
                        className="px-5 py-3 rounded-xl border border-slate-600 hover:border-cyan-400 text-slate-300 font-display text-lg font-bold"
                      >
                        BACK TO ROCKET
                      </button>
                      <button
                        disabled={!platformId}
                        onClick={() => {
                          setBuilderTab(0);
                          setAct('act3b');
                        }}
                        className="px-7 py-3 rounded-xl bg-gradient-to-r from-[#00E5FF] to-[#0284C7] text-[#070B14] font-display text-xl font-extrabold tracking-wider shadow-[0_0_24px_rgba(0,229,255,0.4)] disabled:opacity-40"
                      >
                        CONFIRM PLATFORM &gt;
                      </button>
                    </div>
                  </div>
                ) : (
                  <div>
                    {/* Change Platform Bar */}
                    <div className="flex items-center justify-between mb-3">
                      <span className="font-mono-tech text-xs text-slate-300">
                        ACTIVE BUS: <strong className="text-cyan-300">{selectedPlatform.name}</strong>
                      </span>
                      <button
                        onClick={() => setAct('act3a')}
                        className="px-3 py-1 rounded-lg border border-cyan-500/35 hover:border-cyan-300 font-mono-tech text-[11px] text-cyan-300"
                      >
                        CHANGE PLATFORM
                      </button>
                    </div>

                    {/* Horizontal 5-Step Subsystem Capsule Tabs */}
                    <div className="grid grid-cols-5 gap-1.5 mb-4">
                      {['1. STRUCTURE', '2. SOLAR', '3. BATTERY', '4. ANTENNA', '5. INSTRUMENT'].map((label, idx) => {
                        const active = builderTab === idx;
                        return (
                          <button
                            key={label}
                            onClick={() => setBuilderTab(idx)}
                            className={`py-2 px-1.5 rounded-lg font-mono-tech text-[10px] sm:text-xs font-bold truncate transition-all ${
                              active
                                ? 'bg-cyan-400 text-[#070B14] shadow-[0_0_16px_rgba(0,229,255,0.4)]'
                                : 'bg-[#0E1629] border border-cyan-500/25 text-slate-300 hover:border-cyan-400'
                            }`}
                          >
                            {label}
                          </button>
                        );
                      })}
                    </div>

                    {/* Subsystem Option Cards */}
                    <div className="space-y-3">
                      {builderTab === 0 &&
                        SUBSYSTEMS.structure.map((item) => {
                          const sel = structureId === item.id;
                          return (
                            <div
                              key={item.id}
                              onClick={() => setStructureId(item.id)}
                              className={`cursor-pointer rounded-xl p-4 flex items-center justify-between gap-4 ${
                                sel ? 'glass-card-selected' : 'glass-card hover:border-cyan-400/50'
                              }`}
                            >
                              <div>
                                <div className="font-display text-xl font-bold text-white flex items-center">
                                  {item.name}
                                  <InfoTooltip text={item.tooltip} />
                                </div>
                                <div className="font-mono-tech text-xs text-cyan-300 mt-0.5">{item.statLabel}</div>
                              </div>
                              <div className="text-right font-mono-tech text-xs">
                                <div className="text-emerald-400 font-bold">${item.costM}M</div>
                                <div className="text-slate-400">{item.massKg} kg</div>
                              </div>
                            </div>
                          );
                        })}

                      {builderTab === 1 &&
                        SUBSYSTEMS.solar.map((item) => {
                          const sel = solarId === item.id;
                          return (
                            <div
                              key={item.id}
                              onClick={() => setSolarId(item.id)}
                              className={`cursor-pointer rounded-xl p-4 flex items-center justify-between gap-4 ${
                                sel ? 'glass-card-selected' : 'glass-card hover:border-cyan-400/50'
                              }`}
                            >
                              <div>
                                <div className="font-display text-xl font-bold text-white flex items-center">
                                  {item.name}
                                  <InfoTooltip text={item.tooltip} />
                                </div>
                                <div className="font-mono-tech text-xs text-cyan-300 mt-0.5">{item.statLabel}</div>
                              </div>
                              <div className="text-right font-mono-tech text-xs">
                                <div className="text-emerald-400 font-bold">${item.costM}M</div>
                                <div className="text-slate-400">{item.massKg} kg</div>
                              </div>
                            </div>
                          );
                        })}

                      {builderTab === 2 &&
                        SUBSYSTEMS.battery.map((item) => {
                          const sel = batteryId === item.id;
                          return (
                            <div
                              key={item.id}
                              onClick={() => setBatteryId(item.id)}
                              className={`cursor-pointer rounded-xl p-4 flex items-center justify-between gap-4 ${
                                sel ? 'glass-card-selected' : 'glass-card hover:border-cyan-400/50'
                              }`}
                            >
                              <div>
                                <div className="font-display text-xl font-bold text-white flex items-center">
                                  {item.name}
                                  <InfoTooltip text={item.tooltip} />
                                </div>
                                <div className="font-mono-tech text-xs text-emerald-300 mt-0.5">{item.statLabel}</div>
                              </div>
                              <div className="text-right font-mono-tech text-xs">
                                <div className="text-emerald-400 font-bold">${item.costM}M</div>
                                <div className="text-slate-400">{item.massKg} kg</div>
                              </div>
                            </div>
                          );
                        })}

                      {builderTab === 3 &&
                        SUBSYSTEMS.antenna.map((item) => {
                          const sel = antennaId === item.id;
                          return (
                            <div
                              key={item.id}
                              onClick={() => setAntennaId(item.id)}
                              className={`cursor-pointer rounded-xl p-4 flex items-center justify-between gap-4 ${
                                sel ? 'glass-card-selected' : 'glass-card hover:border-cyan-400/50'
                              }`}
                            >
                              <div>
                                <div className="font-display text-xl font-bold text-white flex items-center">
                                  {item.name}
                                  <InfoTooltip text={item.tooltip} />
                                </div>
                                <div className="font-mono-tech text-xs text-sky-300 mt-0.5">{item.statLabel}</div>
                              </div>
                              <div className="text-right font-mono-tech text-xs">
                                <div className="text-emerald-400 font-bold">${item.costM}M</div>
                                <div className="text-slate-400">{item.massKg} kg</div>
                              </div>
                            </div>
                          );
                        })}

                      {builderTab === 4 &&
                        SUBSYSTEMS.instruments.map((item) => {
                          const added = instrumentIds.includes(item.id);
                          return (
                            <div
                              key={item.id}
                              onClick={() => toggleInstrument(item.id)}
                              className={`cursor-pointer rounded-xl p-4 flex items-center justify-between gap-4 ${
                                added ? 'glass-card-selected' : 'glass-card hover:border-cyan-400/50'
                              }`}
                            >
                              <div>
                                <div className="font-display text-xl font-bold text-white flex items-center">
                                  {item.name}
                                  <InfoTooltip text={item.tooltip} />
                                </div>
                                <div className="font-mono-tech text-xs text-amber-300 mt-0.5">
                                  {item.statLabel} • ${item.costM}M • {item.massKg} kg
                                </div>
                              </div>
                              <button
                                type="button"
                                className={`px-4 py-1.5 rounded-lg font-mono-tech text-xs font-bold transition-colors ${
                                  added
                                    ? 'bg-cyan-400 text-slate-950'
                                    : 'bg-slate-800 border border-cyan-500/40 text-cyan-300'
                                }`}
                              >
                                {added ? 'ADDED' : 'ADD'}
                              </button>
                            </div>
                          );
                        })}
                    </div>

                    {/* Step 3B Bottom Nav */}
                    <div className="mt-6 flex items-center justify-between">
                      <button
                        onClick={() => {
                          if (builderTab > 0) setBuilderTab((t) => t - 1);
                          else setAct('act3a');
                        }}
                        className="px-5 py-3 rounded-xl border border-slate-600 hover:border-cyan-400 text-slate-300 font-display text-lg font-bold"
                      >
                        &lt; BACK
                      </button>

                      {builderTab < 4 ? (
                        <button
                          onClick={() => setBuilderTab((t) => t + 1)}
                          className="px-7 py-3 rounded-xl bg-gradient-to-r from-[#00E5FF] to-[#0284C7] text-[#070B14] font-display text-xl font-extrabold tracking-wider shadow-[0_0_22px_rgba(0,229,255,0.35)]"
                        >
                          NEXT &gt;
                        </button>
                      ) : (
                        <button
                          disabled={instrumentIds.length === 0}
                          onClick={() => setAct('act4')}
                          className="px-7 py-3 rounded-xl bg-gradient-to-r from-[#00E5FF] to-[#0284C7] text-[#070B14] font-display text-xl font-extrabold tracking-wider shadow-[0_0_24px_rgba(0,229,255,0.45)] disabled:opacity-40 disabled:cursor-not-allowed"
                        >
                          CONFIRM SPACECRAFT &gt;
                        </button>
                      )}
                    </div>
                  </div>
                )}
              </div>
            </div>
          </section>
        )}

        {/* ==================================================================
            ACT 4: SELECT LUNAR ORBIT (HOLOGRAPHIC 3D COVERFLOW)
        ================================================================== */}
        {act === 'act4' && (
          <section className="relative max-w-6xl mx-auto px-4 sm:px-6 py-6">
            <div>
              <div className="font-mono-tech text-xs text-cyan-400 tracking-widest">
                STAGE 03 // CISLUNAR TRAJECTORY INSERTION
              </div>
              <h2 className="font-display text-4xl sm:text-5xl font-extrabold text-white">
                SELECT LUNAR ORBIT
              </h2>
            </div>

            <div className="relative flex items-center justify-center my-2">
              <button
                onClick={() => setOrbitIdx((i) => (i + 2) % 3)}
                className="absolute left-0 sm:left-2 z-20 w-12 h-12 rounded-xl bg-[#0E1629]/75 hover:bg-cyan-500/20 border border-cyan-400/40 hover:border-[#00E5FF] text-cyan-300 flex items-center justify-center transition-all"
              >
                <ChevronsLeft className="w-6 h-6" />
              </button>

              <LunarOrbit3DViewport selectedOrbitIdx={orbitIdx} onSelectOrbit={setOrbitIdx} />

              <button
                onClick={() => setOrbitIdx((i) => (i + 1) % 3)}
                className="absolute right-0 sm:right-2 z-20 w-12 h-12 rounded-xl bg-[#0E1629]/75 hover:bg-cyan-500/20 border border-cyan-400/40 hover:border-[#00E5FF] text-cyan-300 flex items-center justify-center transition-all"
              >
                <ChevronsRight className="w-6 h-6" />
              </button>
            </div>

            {/* Holographic Orbital Parameters */}
            <div className="text-center max-w-3xl mx-auto">
              <div className="font-mono-tech text-xs text-cyan-400 tracking-widest">
                {selectedOrbit.subtitle}
              </div>
              <h3 className="font-display text-3xl sm:text-4xl font-extrabold text-white mt-0.5 flex items-center justify-center">
                {selectedOrbit.name}
                <InfoTooltip text={selectedOrbit.tooltip} />
              </h3>

              <div className="mt-4 grid grid-cols-2 sm:grid-cols-4 gap-3 py-3.5 px-4 border-y border-cyan-500/25 font-mono-tech">
                <div>
                  <div className="text-[10px] text-slate-400">ORBITAL PERIOD</div>
                  <div className="text-sm sm:text-base font-bold text-white mt-0.5">{selectedOrbit.period}</div>
                </div>
                <div>
                  <div className="text-[10px] text-slate-400">SOLAR ILLUMINATION</div>
                  <div className="text-sm sm:text-base font-bold text-cyan-300 mt-0.5">
                    {selectedOrbit.illumination}
                  </div>
                </div>
                <div>
                  <div className="text-[10px] text-slate-400">EARTH COMM WINDOW</div>
                  <div className="text-sm sm:text-base font-bold text-sky-300 mt-0.5">
                    {selectedOrbit.commWindow}
                  </div>
                </div>
                <div>
                  <div className="text-[10px] text-slate-400">POWER MODIFIER</div>
                  <div
                    className={`text-sm sm:text-base font-bold mt-0.5 ${
                      selectedOrbit.powerMultiplier >= 1 ? 'text-emerald-400' : 'text-amber-400'
                    }`}
                  >
                    {selectedOrbit.powerModLabel}
                  </div>
                </div>
              </div>
            </div>

            <div className="mt-7 flex items-center justify-between">
              <button
                onClick={() => setAct('act3b')}
                className="px-5 py-3 rounded-xl border border-slate-600 hover:border-cyan-400 text-slate-300 font-display text-lg font-bold"
              >
                &lt; BACK TO BUILDER
              </button>
              <button
                onClick={() => {
                  setResourceNode(0);
                  setAct('act5');
                }}
                className="px-7 py-3 rounded-xl bg-gradient-to-r from-[#00E5FF] to-[#0284C7] text-[#070B14] font-display text-xl font-extrabold tracking-wider shadow-[0_0_24px_rgba(0,229,255,0.4)]"
              >
                ALLOCATE POWER &gt;
              </button>
            </div>
          </section>
        )}

        {/* ==================================================================
            ACT 5: STAGE 04 RESOURCE ALLOCATION & 5-AXIS PENTAGON RADAR
        ================================================================== */}
        {act === 'act5' && (
          <section className="max-w-4xl mx-auto px-4 sm:px-6 py-7">
            <div className="text-center mb-8">
              <div className="font-mono-tech text-xs text-cyan-400 tracking-widest">
                STAGE 04 // SYSTEMS BUDGET &amp; TELEMETRY VALIDATION
              </div>
              <h2 className="font-display text-4xl font-extrabold text-white">
                RESOURCE ALLOCATION
              </h2>
            </div>

            {/* Horizontal 4-Node Stepper with Floating Downward-Triangle Active Bubble */}
            <div className="relative max-w-2xl mx-auto mb-8 pt-7">
              <div className="absolute top-[45px] left-[12%] right-[12%] h-[2px] bg-cyan-500/35" />
              <div className="relative grid grid-cols-4 gap-2">
                {[
                  { num: 1, tag: 'NODE 01', label: 'View Available Resources' },
                  { num: 2, tag: 'NODE 02', label: 'Allocate Power' },
                  { num: 3, tag: 'NODE 03', label: 'Manage Communication' },
                  { num: 4, tag: 'NODE 04', label: 'Review Resource Status' }
                ].map((n, idx) => {
                  const active = resourceNode === idx;
                  return (
                    <div key={n.num} className="flex flex-col items-center text-center relative">
                      {active && (
                        <div className="absolute -top-7 px-2.5 py-0.5 rounded bg-[#00E5FF] text-[#070B14] font-mono-tech text-[10px] font-bold shadow-[0_0_12px_rgba(0,229,255,0.7)]">
                          {n.tag}
                          <div className="w-2 h-2 bg-[#00E5FF] rotate-45 mx-auto -mb-1.5" />
                        </div>
                      )}
                      <button
                        onClick={() => setResourceNode(idx)}
                        className={`w-9 h-9 rounded-full font-mono-tech text-sm font-bold flex items-center justify-center transition-all z-10 ${
                          active
                            ? 'bg-[#070B14] border-2 border-[#00E5FF] text-[#00E5FF] shadow-[0_0_18px_rgba(0,229,255,0.65)] scale-110'
                            : idx < resourceNode
                            ? 'bg-cyan-500/25 border border-cyan-400 text-cyan-200'
                            : 'bg-[#0E1629] border border-slate-700 text-slate-400'
                        }`}
                      >
                        {n.num}
                      </button>
                      <span
                        className={`mt-2 text-[11px] leading-tight max-w-[110px] ${
                          active ? 'text-cyan-300 font-semibold' : 'text-slate-400'
                        }`}
                      >
                        {n.label}
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Single Centered Frosted Card Switching by Node */}
            <div className="glass-card-selected rounded-2xl p-6 sm:p-7">
              {resourceNode === 0 && (
                <div>
                  <h3 className="font-display text-2xl font-extrabold text-white mb-4">
                    AVAILABLE SPACECRAFT RESOURCES
                  </h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 font-mono-tech">
                    <div className="p-4 rounded-xl bg-[#070B14]/80 border border-cyan-500/25">
                      <div className="text-xs text-slate-400">SOLAR POWER GENERATION (WITH ORBIT)</div>
                      <div className="text-2xl font-bold text-cyan-300 mt-1">{effectiveSolarW} W</div>
                      <div className="text-[11px] text-slate-400 mt-1">
