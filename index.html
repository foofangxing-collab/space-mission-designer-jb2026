                        Base {selectedSolar.powerW} W ({selectedOrbit.powerModLabel})
                      </div>
                    </div>

                    <div className="p-4 rounded-xl bg-[#070B14]/80 border border-cyan-500/25">
                      <div className="text-xs text-slate-400">BATTERY STORAGE CAPACITY</div>
                      <div className="text-2xl font-bold text-emerald-400 mt-1">
                        {selectedBattery.capacityWh} Wh
                      </div>
                      <div className="text-[11px] text-slate-400 mt-1">{selectedBattery.name}</div>
                    </div>

                    <div className="p-4 rounded-xl bg-[#070B14]/80 border border-cyan-500/25">
                      <div className="flex justify-between text-xs text-slate-400">
                        <span>TOTAL MASS VS ROCKET LIMIT</span>
                        <span className={isOverweight ? 'text-red-400 font-bold' : 'text-cyan-300'}>
                          {Math.round((totalMassKg / effectiveMassLimitKg) * 100)}%
                        </span>
                      </div>
                      <div className="text-xl font-bold text-white mt-1">
                        {totalMassKg} / {effectiveMassLimitKg} kg
                      </div>
                      <div className="h-2 bg-slate-800 rounded-full overflow-hidden mt-2">
                        <div
                          className={`h-full ${isOverweight ? 'bg-red-500' : 'bg-cyan-400'}`}
                          style={{ width: `${Math.min(100, (totalMassKg / effectiveMassLimitKg) * 100)}%` }}
                        />
                      </div>
                    </div>

                    <div className="p-4 rounded-xl bg-[#070B14]/80 border border-cyan-500/25">
                      <div className="text-xs text-slate-400">COMMUNICATION BANDWIDTH</div>
                      <div className="text-2xl font-bold text-sky-300 mt-1">{effectiveCommsMbps} Mbps</div>
                      <div className="text-[11px] text-slate-400 mt-1">{selectedAntenna.name}</div>
                    </div>
                  </div>
                </div>
              )}

              {resourceNode === 1 && (
                <div>
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
                    <h3 className="font-display text-2xl font-extrabold text-white">
                      SUBSYSTEM POWER ALLOCATION
                    </h3>
                    <div className="flex items-center gap-3">
                      <span
                        className={`font-mono-tech text-xs font-bold px-3 py-1 rounded-lg border ${
                          isPowerOverAllocated
                            ? 'bg-red-500/20 border-red-400 text-red-300'
                            : 'bg-cyan-500/15 border-cyan-400/40 text-cyan-300'
                        }`}
                      >
                        {totalAllocatedW} W / {effectiveSolarW} W AVAILABLE
                      </span>
                      {isPowerOverAllocated && (
                        <button
                          onClick={autoBalancePower}
                          className="px-3 py-1 rounded-lg bg-amber-400 text-slate-950 font-mono-tech text-xs font-bold hover:brightness-110"
                        >
                          AUTO-BALANCE
                        </button>
                      )}
                    </div>
                  </div>

                  {isPowerOverAllocated && (
                    <div className="mb-4 p-2.5 rounded-lg bg-red-950/50 border border-red-500/40 font-mono-tech text-xs text-red-300">
                      OVER-ALLOCATED: Continuous draw exceeds solar array output. Battery discharge will occur.
                    </div>
                  )}

                  <div className="space-y-4">
                    {[
                      { key: 'science', label: 'Science Instruments', min: 25, max: 160 },
                      { key: 'thermal', label: 'Cryogenic Thermal Heaters', min: 30, max: 140 },
                      { key: 'comms', label: 'Transponder & Earth Downlink', min: 20, max: 120 },
                      { key: 'avionics', label: 'Avionics & Surface Mobility Drive', min: 35, max: 140 }
                    ].map((s) => (
                      <div key={s.key} className="p-3 rounded-xl bg-[#070B14]/75 border border-cyan-500/20">
                        <div className="flex justify-between font-mono-tech text-xs mb-2">
                          <span className="text-slate-200">{s.label}</span>
                          <span className="text-cyan-300 font-bold">{powerSliders[s.key]} W</span>
                        </div>
                        <input
                          type="range"
                          min={s.min}
                          max={s.max}
                          value={powerSliders[s.key]}
                          onChange={(e) =>
                            setPowerSliders((prev) => ({ ...prev, [s.key]: Number(e.target.value) }))
                          }
                          className="cyber-slider"
                        />
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {resourceNode === 2 && (
                <div>
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="font-display text-2xl font-extrabold text-white">
                      COMMUNICATION PRIORITY MODE
                    </h3>
                    <span className="font-mono-tech text-xs text-cyan-300">
                      HARDWARE: {selectedAntenna.name}
                    </span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div
                      onClick={() => setCommMode('high_res')}
                      className={`cursor-pointer rounded-xl p-5 border transition-all ${
                        commMode === 'high_res'
                          ? 'bg-cyan-500/15 border-[#00E5FF] shadow-[0_0_20px_rgba(0,229,255,0.22)]'
                          : 'bg-[#070B14]/80 border-cyan-500/25 hover:border-cyan-400'
                      }`}
                    >
                      <div className="font-mono-tech text-[11px] text-cyan-400 mb-1">HIGH-RESOLUTION PRIORITY</div>
                      <h4 className="font-display text-xl font-bold text-white mb-2">
                        FULL-SPECTRUM SCIENCE STREAM
                      </h4>
                      <p className="text-xs text-slate-300 mb-4">
                        Transmits uncompressed multi-channel neutron and NIR spectra plus high-res stereo imagery.
                      </p>
                      <div className="font-mono-tech text-xs font-bold text-emerald-400">
                        SCIENCE YIELD: +15% BONUS
                      </div>
                    </div>

                    <div
                      onClick={() => setCommMode('failsafe')}
                      className={`cursor-pointer rounded-xl p-5 border transition-all ${
                        commMode === 'failsafe'
                          ? 'bg-cyan-500/15 border-[#00E5FF] shadow-[0_0_20px_rgba(0,229,255,0.22)]'
                          : 'bg-[#070B14]/80 border-cyan-500/25 hover:border-cyan-400'
                      }`}
                    >
                      <div className="font-mono-tech text-[11px] text-sky-400 mb-1">FAIL-SAFE PRIORITY</div>
                      <h4 className="font-display text-xl font-bold text-white mb-2">
                        COMPRESSED TELEMETRY GUARANTEED
                      </h4>
                      <p className="text-xs text-slate-300 mb-4">
                        Forward-error-corrected packet framing resilient against low-horizon lunar ridge multipath interference.
                      </p>
                      <div className="font-mono-tech text-xs font-bold text-cyan-300">
                        DELIVERY RATE: 100% LOCKED
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {resourceNode === 3 && (
                <div>
                  <h3 className="font-display text-2xl font-extrabold text-white mb-4">
                    5-AXIS RESOURCE READINESS RADAR
                  </h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                    <PentagonRadarChart
                      metrics={[
                        {
                          label: 'BUDGET',
                          value: Math.max(10, Math.min(100, (remainingBudgetM / TOTAL_MISSION_BUDGET_M) * 140))
                        },
                        {
                          label: 'MASS',
                          value: isOverweight
                            ? 28
                            : Math.max(45, 100 - Math.abs(totalMassKg / effectiveMassLimitKg - 0.72) * 80)
                        },
                        {
                          label: 'POWER',
                          value: Math.max(25, Math.min(100, (effectiveSolarW / 380) * 100))
                        },
                        {
                          label: 'BATTERY',
                          value: Math.max(35, Math.min(100, (selectedBattery.capacityWh / 1150) * 100))
                        },
                        {
                          label: 'COMMS',
                          value: Math.max(30, Math.min(100, (effectiveCommsMbps / 55) * 100))
                        }
                      ]}
                    />

                    <div className="p-4 rounded-xl bg-[#070B14]/85 border border-cyan-500/30 font-mono-tech text-xs space-y-2.5">
                      <div className="text-cyan-400 font-bold tracking-wider pb-1.5 border-b border-cyan-500/20">
                        TELEMETRY VERIFIED
                      </div>
                      <div className="flex justify-between">
                        <span className="text-slate-400">REMAINING BUDGET</span>
                        <span className={isOverBudget ? 'text-red-400 font-bold' : 'text-emerald-400 font-bold'}>
                          ${remainingBudgetM}M
                        </span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-slate-400">PAYLOAD MASS</span>
                        <span className={isOverweight ? 'text-red-400 font-bold' : 'text-cyan-300 font-bold'}>
                          {totalMassKg} / {effectiveMassLimitKg} kg
                        </span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-slate-400">ORBITAL SOLAR OUTPUT</span>
                        <span className="text-cyan-300 font-bold">{effectiveSolarW} W</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-slate-400">ENERGY RESERVE</span>
                        <span className="text-emerald-400 font-bold">{selectedBattery.capacityWh} Wh</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-slate-400">DOWNLINK BANDWIDTH</span>
                        <span className="text-sky-300 font-bold">{effectiveCommsMbps} Mbps</span>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>

            {/* Bottom Stepper Navigation */}
            <div className="mt-6 flex items-center justify-between">
              {resourceNode > 0 ? (
                <button
                  onClick={() => setResourceNode((n) => n - 1)}
                  className="px-5 py-3 rounded-xl border border-slate-600 hover:border-cyan-400 text-slate-300 font-display text-lg font-bold"
                >
                  &lt; PREV STEP
                </button>
              ) : (
                <button
                  onClick={() => setAct('act3b')}
                  className="px-5 py-3 rounded-xl border border-slate-600 hover:border-cyan-400 text-slate-300 font-display text-lg font-bold"
                >
                  MODIFY CONFIG
                </button>
              )}

              {resourceNode < 3 ? (
                <button
                  onClick={() => setResourceNode((n) => n + 1)}
                  className="px-7 py-3 rounded-xl bg-gradient-to-r from-[#00E5FF] to-[#0284C7] text-[#070B14] font-display text-xl font-extrabold tracking-wider shadow-[0_0_22px_rgba(0,229,255,0.35)]"
                >
                  NEXT STEP &gt;
                </button>
              ) : (
                <button
                  onClick={() => setAct('act6a')}
                  className="px-7 py-3 rounded-xl bg-gradient-to-r from-[#00E5FF] to-[#0284C7] text-[#070B14] font-display text-xl font-extrabold tracking-wider shadow-[0_0_26px_rgba(0,229,255,0.45)]"
                >
                  PROCEED TO LAUNCH &gt;
                </button>
              )}
            </div>
          </section>
        )}

        {/* ==================================================================
            ACT 6A: PRE-LAUNCH SUMMARY & HARD/SOFT GATE
        ================================================================== */}
        {act === 'act6a' && (
          <section className="max-w-5xl mx-auto px-4 sm:px-6 py-7">
            <div className="mb-5">
              <div className="font-mono-tech text-xs text-cyan-400 tracking-widest">
                STAGE 05 // FLIGHT READINESS REVIEW (FRR)
              </div>
              <h2 className="font-display text-4xl font-extrabold text-white">
                PRE-LAUNCH SUMMARY &amp; GATE
              </h2>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              {/* Left Integrated Spacecraft Blueprint */}
              <div className="lg:col-span-6 glass-card rounded-2xl p-5">
                <h3 className="font-display text-2xl font-bold text-cyan-300 mb-3">
                  INTEGRATED SPACECRAFT BLUEPRINT
                </h3>
                <div className="space-y-2.5 font-mono-tech text-xs">
                  <div className="p-2.5 rounded-lg bg-[#070B14]/80 flex justify-between">
                    <span className="text-slate-400">LAUNCH VEHICLE</span>
                    <span className="text-white font-bold">{selectedRocket.name}</span>
                  </div>
                  <div className="p-2.5 rounded-lg bg-[#070B14]/80 flex justify-between">
                    <span className="text-slate-400">SPACECRAFT BUS</span>
                    <span className="text-white font-bold">{selectedPlatform.name}</span>
                  </div>
                  <div className="p-2.5 rounded-lg bg-[#070B14]/80 flex justify-between">
                    <span className="text-slate-400">LUNAR ORBIT</span>
                    <span className="text-cyan-300 font-bold">{selectedOrbit.name}</span>
                  </div>
                  <div className="p-2.5 rounded-lg bg-[#070B14]/80 flex justify-between">
                    <span className="text-slate-400">STRUCTURE</span>
                    <span className="text-slate-200">{selectedStructure.name}</span>
                  </div>
                  <div className="p-2.5 rounded-lg bg-[#070B14]/80 flex justify-between">
                    <span className="text-slate-400">SOLAR &amp; BATTERY</span>
                    <span className="text-slate-200">
                      {selectedSolar.name} / {selectedBattery.statLabel}
                    </span>
                  </div>
                  <div className="p-2.5 rounded-lg bg-[#070B14]/80 flex justify-between">
                    <span className="text-slate-400">ANTENNA</span>
                    <span className="text-slate-200">{selectedAntenna.name}</span>
                  </div>
                  <div className="p-2.5 rounded-lg bg-[#070B14]/80">
                    <div className="text-slate-400 mb-1.5">PAYLOAD INSTRUMENTS</div>
                    <div className="flex flex-wrap gap-1.5">
                      {selectedInstruments.map((inst) => (
                        <span
                          key={inst.id}
                          className="px-2.5 py-1 rounded bg-cyan-500/20 border border-cyan-400/40 text-cyan-200 text-[11px]"
                        >
                          {inst.name}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              </div>

              {/* Right 2 Gate Verification Cards */}
              <div className="lg:col-span-6 space-y-4">
                {/* Gate 1: Hard Budget Gate */}
                <div
                  className={`rounded-2xl p-5 border ${
                    isOverBudget
                      ? 'bg-red-950/35 border-red-500'
                      : 'glass-card border-emerald-500/40'
                  }`}
                >
                  <div className="flex items-center justify-between font-mono-tech text-xs mb-2">
                    <span className="font-bold text-white">MISSION BUDGET GATE (HARD LIMIT: $300M)</span>
                    <span className={isOverBudget ? 'text-red-400 font-bold' : 'text-emerald-400 font-bold'}>
                      {isOverBudget ? 'FAILED' : 'CLEARED'}
                    </span>
                  </div>
                  <div className="flex justify-between font-mono-tech text-xs text-slate-300 mb-2">
                    <span>SPENT: ${totalSpentM}M</span>
                    <span>REMAINING: ${remainingBudgetM}M</span>
                  </div>
                  <div className="h-3 bg-slate-800 rounded-full overflow-hidden">
                    <div
                      className={`h-full ${isOverBudget ? 'bg-red-500' : 'bg-emerald-400'}`}
                      style={{ width: `${Math.min(100, (totalSpentM / TOTAL_MISSION_BUDGET_M) * 100)}%` }}
                    />
                  </div>
                  {isOverBudget && (
                    <p className="mt-2.5 font-mono-tech text-xs text-red-300">
                      HARD GATE LOCK: Mission cost exceeds $300M appropriation. Modify hardware or select a lower-cost rocket.
                    </p>
                  )}
                </div>

                {/* Gate 2: Soft Mass Gate */}
                <div
                  className={`rounded-2xl p-5 border ${
                    isOverweight
                      ? 'bg-amber-950/35 border-amber-500'
                      : 'glass-card border-cyan-500/35'
                  }`}
                >
                  <div className="flex items-center justify-between font-mono-tech text-xs mb-2">
                    <span className="font-bold text-white">SPACECRAFT MASS VS ROCKET LIMIT (SOFT GATE)</span>
                    <span className={isOverweight ? 'text-amber-400 font-bold' : 'text-cyan-300 font-bold'}>
                      {isOverweight ? 'OVERWEIGHT WARNING' : 'NOMINAL'}
                    </span>
                  </div>
                  <div className="flex justify-between font-mono-tech text-xs text-slate-300 mb-2">
                    <span>TOTAL MASS: {totalMassKg} kg</span>
                    <span>MAX PAYLOAD: {effectiveMassLimitKg} kg</span>
                  </div>
                  <div className="h-3 bg-slate-800 rounded-full overflow-hidden">
                    <div
                      className={`h-full ${isOverweight ? 'bg-amber-500' : 'bg-cyan-400'}`}
                      style={{ width: `${Math.min(100, (totalMassKg / effectiveMassLimitKg) * 100)}%` }}
                    />
                  </div>
                  {isOverweight && (
                    <p className="mt-2.5 font-mono-tech text-xs text-amber-300">
                      SOFT GATE ADVISORY: Excess mass will deplete terminal descent propellant margins. Launch override permitted.
                    </p>
                  )}
                </div>
              </div>
            </div>

            <div className="mt-7 flex items-center justify-between">
              <button
                onClick={() => setAct('act3b')}
                className="px-5 py-3 rounded-xl border border-slate-600 hover:border-cyan-400 text-slate-300 font-display text-lg font-bold"
              >
                MODIFY HARDWARE
              </button>
              <button
                disabled={isOverBudget}
                onClick={() => setAct('act6b')}
                className="px-8 py-3.5 rounded-xl bg-gradient-to-r from-[#00E5FF] to-[#0284C7] text-[#070B14] font-display text-2xl font-extrabold tracking-wider shadow-[0_0_28px_rgba(0,229,255,0.45)] hover:brightness-110 disabled:opacity-35 disabled:cursor-not-allowed transition-all"
              >
                IGNITE &amp; LAUNCH 🚀
              </button>
            </div>
          </section>
        )}

        {/* ==================================================================
            ACT 6B: LUNAR TRANSFER CUTSCENE
        ================================================================== */}
        {act === 'act6b' && (
          <LunarTransferCutscene
            rocket={selectedRocket}
            platform={selectedPlatform}
            solar={selectedSolar}
            antenna={selectedAntenna}
            instruments={instrumentIds}
            orbit={selectedOrbit}
            isOverweight={isOverweight}
            onComplete={() => setAct('act6c')}
          />
        )}

        {/* ==================================================================
            ACT 6C: SELECT LUNAR SOUTH POLE LANDING ZONE
        ================================================================== */}
        {act === 'act6c' && (
          <section className="max-w-7xl mx-auto px-4 sm:px-6 py-5">
            <div className="mb-4">
              <div className="font-mono-tech text-xs text-cyan-400 tracking-widest">
                STAGE 05 // TERMINAL TARGETING
              </div>
              <h2 className="font-display text-3xl sm:text-4xl font-extrabold text-white">
                SELECT LUNAR SOUTH POLE LANDING ZONE
              </h2>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              {/* Left 3D Half-Moon South Pole Viewport (~55% -> 7 cols) */}
              <div className="lg:col-span-7">
                <SouthPole3DLandingSelector
                  selectedSiteId={landingSiteId}
                  onSelectSite={setLandingSiteId}
                />
              </div>

              {/* Right Control Panel (5 cols) */}
              <div className="lg:col-span-5 space-y-4">
                <div className="glass-card rounded-2xl p-4">
                  <div className="font-mono-tech text-xs text-cyan-300 font-bold mb-2.5">
                    1. LANDING SITE SELECTION (4 CANDIDATES)
                  </div>
                  <div className="space-y-2">
                    {LANDING_SITES.map((site) => {
                      const active = landingSiteId === site.id;
                      return (
                        <div
                          key={site.id}
                          onClick={() => setLandingSiteId(site.id)}
                          className={`cursor-pointer rounded-xl p-3 border transition-all ${
                            active
                              ? 'bg-cyan-500/15 border-[#00E5FF] shadow-[0_0_16px_rgba(0,229,255,0.2)]'
                              : 'bg-[#070B14]/75 border-cyan-500/20 hover:border-cyan-400/50'
                          }`}
                        >
                          <div className="flex items-center justify-between">
                            <span className="font-display text-lg font-bold text-white">{site.name}</span>
                            <span className="font-mono-tech text-[10px] text-slate-400">{site.coords}</span>
                          </div>
                          <div className="mt-1 grid grid-cols-3 gap-2 font-mono-tech text-[11px]">
                            <div>
                              <span className="text-slate-400">SLOPE: </span>
                              <span className="text-white font-bold">{site.slope}</span>
                            </div>
                            <div>
                              <span className="text-slate-400">SOLAR: </span>
                              <span
                                className={`font-bold ${
                                  site.solarNum < 25 ? 'text-amber-400' : 'text-cyan-300'
                                }`}
                              >
                                {site.solar}
                              </span>
                            </div>
                            <div>
                              <span className="text-slate-400">ICE: </span>
                              <span className="text-emerald-400 font-bold">{site.iceProb}</span>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* 2. Descent Guidance Profile */}
                <div className="glass-card rounded-2xl p-4">
                  <div className="font-mono-tech text-xs text-cyan-300 font-bold mb-2.5">
                    2. DESCENT GUIDANCE PROFILE
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    {DESCENT_PROFILES.map((prof) => {
                      const active = descentProfileId === prof.id;
                      return (
                        <button
                          key={prof.id}
                          onClick={() => setDescentProfileId(prof.id)}
                          className={`p-2.5 rounded-xl border text-left transition-all ${
                            active
                              ? 'bg-cyan-500/20 border-[#00E5FF] text-white'
                              : 'bg-[#070B14]/75 border-cyan-500/20 text-slate-400 hover:border-cyan-400/50'
                          }`}
                        >
                          <div className="font-display text-xs font-bold leading-tight">{prof.name}</div>
                          <div className="font-mono-tech text-[10px] text-cyan-300 mt-1">{prof.fuelBonus}</div>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <button
                  onClick={() => setAct('act6d')}
                  className="w-full py-3.5 rounded-xl bg-gradient-to-r from-[#00E5FF] to-[#0284C7] text-[#070B14] font-display text-xl font-extrabold tracking-wider shadow-[0_0_24px_rgba(0,229,255,0.45)] hover:brightness-110 transition-all"
                >
                  CONFIRM DESCENT &amp; LAND
                </button>
              </div>
            </div>
          </section>
        )}

        {/* ==================================================================
            ACT 6D: TERMINAL DESCENT 3D CUTSCENE
        ================================================================== */}
        {act === 'act6d' && (
          <TerminalDescent3D
            platform={selectedPlatform}
            structure={selectedStructure}
            solar={selectedSolar}
            battery={selectedBattery}
            antenna={selectedAntenna}
            instruments={instrumentIds}
            landingSite={selectedLandingSite}
            isHardLanding={isHardLanding}
            onTouchdownComplete={() => setAct('act7')}
          />
        )}

        {/* ==================================================================
            ACT 7: SURFACE EXPLORATION & SCIENTIFIC DATA COLLECTION
        ================================================================== */}
        {act === 'act7' && (
          <SurfaceOps3D
            platform={selectedPlatform}
            structure={selectedStructure}
            solar={selectedSolar}
            battery={selectedBattery}
            antenna={selectedAntenna}
            equippedInstruments={instrumentIds}
            landingSite={selectedLandingSite}
            onGenerateReport={() => setAct('act8')}
          />
        )}

        {/* ==================================================================
            ACT 8: FINAL PAGE — MISSION EVALUATION SUMMARY REPORT
        ================================================================== */}
        {act === 'act8' && (
          <section className="max-w-5xl mx-auto px-4 sm:px-6 py-8">
            <div className="glass-card-selected rounded-3xl p-6 sm:p-9">
              {/* Top Official NASA Evaluation Header + Grade Badge */}
              <div className="flex flex-col md:flex-row items-center gap-6 pb-7 border-b border-cyan-500/25">
                <div className="w-28 h-28 rounded-2xl bg-gradient-to-br from-cyan-400/25 to-sky-600/20 border-2 border-[#00E5FF] shadow-[0_0_30px_rgba(0,229,255,0.35)] flex flex-col items-center justify-center shrink-0">
                  <div className="font-mono-tech text-[10px] text-cyan-300">GRADE</div>
                  <div className="font-display text-6xl font-extrabold text-white leading-none">
                    {missionEvaluation.grade}
                  </div>
                </div>

                <div className="text-center md:text-left flex-1">
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-500/15 border border-cyan-400/40 font-mono-tech text-[11px] text-cyan-300 mb-2">
                    NASA ARTEMIS / CLPS POST-MISSION EVALUATION
                  </div>
                  <div className="flex flex-wrap items-baseline justify-center md:justify-start gap-3">
                    <h2 className="font-display text-3xl sm:text-4xl font-extrabold text-white">
                      MISSION PERFORMANCE SCORE:
                    </h2>
                    <span className="font-mono-tech text-3xl sm:text-4xl font-bold text-[#00E5FF]">
                      {missionEvaluation.total} / 100
                    </span>
                  </div>
                  <p className="mt-2.5 text-sm text-slate-300 italic leading-relaxed">
                    &ldquo;{missionEvaluation.chiefQuote}&rdquo;
                  </p>
                </div>
              </div>

              {/* Scientific False Positive Educational Callout if Camera-only */}
              {missionEvaluation.hasCamOnly && (
                <div className="mt-6 p-4 rounded-2xl bg-amber-950/45 border border-amber-400/70 flex items-start gap-3.5">
                  <AlertTriangle className="w-6 h-6 text-amber-400 shrink-0 mt-0.5" />
                  <div>
                    <div className="font-display text-lg font-bold text-amber-300">
                      SCIENTIFIC TRUTH ALERT: SURFICIAL HYDROXYL (OH) / OPTICAL GLINT FALSE POSITIVE
                    </div>
                    <p className="text-xs text-slate-200 leading-relaxed mt-1">
                      Your Imaging Camera recorded bright surface reflections near the crater rim, but optical albedo alone cannot distinguish bound <strong className="text-cyan-300">H2O water ice</strong> from solar-wind-implanted <strong className="text-amber-300">OH (hydroxyl)</strong> molecules or specular regolith glint. Equipping a <strong>Spectrometer</strong> and <strong>Lunar Drill</strong> provides definitive hydrogen-neutron &amp; 3.0 μm infrared absorption proof.
                    </p>
                  </div>
                </div>
              )}

              {/* Middle 7-Metric Evaluation Grid */}
              <div className="mt-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
                {missionEvaluation.breakdown.map((item) => (
                  <div
                    key={item.label}
                    className="p-4 rounded-xl bg-[#070B14]/80 border border-cyan-500/25 flex flex-col justify-between"
                  >
                    <div className="flex items-center justify-between gap-2 mb-1.5">
                      <span className="text-xs font-semibold text-slate-200">{item.label}</span>
                      <span
                        className={`font-mono-tech text-sm font-bold ${
                          item.score >= 85
                            ? 'text-emerald-400'
                            : item.score >= 70
                            ? 'text-cyan-300'
                            : 'text-amber-400'
                        }`}
                      >
                        {item.score}%
                      </span>
                    </div>
                    <div className="h-1.5 bg-slate-800 rounded-full overflow-hidden mb-2">
                      <div
                        className={`h-full ${
                          item.score >= 85
                            ? 'bg-emerald-400'
                            : item.score >= 70
                            ? 'bg-cyan-400'
                            : 'bg-amber-400'
                        }`}
                        style={{ width: `${item.score}%` }}
                      />
                    </div>
                    <div className="font-mono-tech text-[11px] text-slate-400">{item.detail}</div>
                  </div>
                ))}
              </div>

              {/* Expandable Detailed Telemetry & Spectral Report */}
              {showDetailedReport && (
                <div className="mt-6 p-5 rounded-2xl bg-[#070B14]/90 border border-cyan-400/40 font-mono-tech text-xs space-y-2 text-slate-300">
                  <div className="text-cyan-300 font-bold mb-2">
                    DETAILED TELEMETRY &amp; SPECTRAL DOWNLINK LOG
                  </div>
                  <div>• LAUNCH VEHICLE: {selectedRocket.name} (${selectedRocket.costM}M | Cap {selectedRocket.maxPayloadKg} kg)</div>
                  <div>• LANDED SPACECRAFT: {selectedPlatform.name} ({totalMassKg} kg wet/dry integrated mass)</div>
                  <div>• ORBITAL RELAY: {selectedOrbit.name} ({selectedOrbit.illumination} | {selectedOrbit.commWindow})</div>
                  <div>• TARGET SITE: {selectedLandingSite.name} ({selectedLandingSite.coords} | Slope {selectedLandingSite.slope})</div>
                  <div>
                    • SPECTRAL ASSAY:{' '}
                    {missionEvaluation.hasSpec
                      ? '3.0 μm NIR H2O absorption band + epithermal neutron suppression confirmed (5.4 wt% H2O).'
                      : 'No NIR/Neutron Spectrometer manifested; volatile assay inferred from camera/drill telemetry.'}
                  </div>
                </div>
              )}

              {/* Bottom 3 Action Buttons */}
              <div className="mt-8 flex flex-wrap items-center justify-center gap-4">
                <button
                  onClick={() => setShowDetailedReport((v) => !v)}
                  className="px-6 py-3.5 rounded-xl border border-cyan-400/50 hover:border-cyan-300 bg-cyan-500/10 text-cyan-200 font-display text-lg font-bold tracking-wider transition-all"
                >
                  {showDetailedReport ? 'HIDE MISSION REPORT' : 'VIEW MISSION REPORT'}
                </button>
                <button
                  onClick={() => setAct('act6a')}
                  className="px-6 py-3.5 rounded-xl border border-slate-600 hover:border-cyan-400 text-slate-200 font-display text-lg font-bold tracking-wider transition-all"
                >
                  REPLAY MISSION
                </button>
                <button
                  onClick={handleNewDesign}
                  className="px-7 py-3.5 rounded-xl bg-gradient-to-r from-[#00E5FF] to-[#0284C7] text-[#070B14] font-display text-lg font-extrabold tracking-wider shadow-[0_0_24px_rgba(0,229,255,0.4)] hover:brightness-110 transition-all"
                >
                  NEW DESIGN
                </button>
              </div>
            </div>
          </section>
        )}
      </main>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
