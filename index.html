      // ============================================================================
      // WEB AUDIO API SOUND ENGINE
      // ============================================================================
      const SoundEngine = (() => {
        let ctx = null;
        let bgmInterval = null;
        let isBgmPlaying = false;

        const getCtx = () => {
          if (!ctx) {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (ctx.state === 'suspended') {
            ctx.resume();
          }
          return ctx;
        };

        return {
          toggleBGM: (enable) => {
            try {
              if (!enable) {
                if (bgmInterval) clearInterval(bgmInterval);
                isBgmPlaying = false;
                return;
              }
              if (isBgmPlaying) return;
              isBgmPlaying = true;
              const context = getCtx();
              let step = 0;

              const notes = [
                261.63, 329.63, 392.00, 523.25,
                349.23, 440.00, 523.25, 698.46,
                392.00, 493.88, 587.33, 783.99,
                349.23, 440.00, 523.25, 698.46
              ];

              bgmInterval = setInterval(() => {
                if (context.state === 'suspended') context.resume();
                const t = context.currentTime;
                const freq = notes[step % notes.length];

                const osc = context.createOscillator();
                const gain = context.createGain();

                const delay = context.createDelay();
                delay.delayTime.value = 0.25;
                const feedback = context.createGain();
                feedback.gain.value = 0.25;
                delay.connect(feedback);
                feedback.connect(delay);
                gain.connect(delay);
                delay.connect(context.destination);

                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(0.015, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);

                osc.connect(gain);
                gain.connect(context.destination);
                osc.start(t);
                osc.stop(t + 0.15);

                if (step % 4 === 0) {
                  const bassOsc = context.createOscillator();
                  const bassGain = context.createGain();
                  bassOsc.type = 'sawtooth';
                  bassOsc.frequency.setValueAtTime(freq / 4, t);
                  bassGain.gain.setValueAtTime(0.025, t);
                  bassGain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
                  bassOsc.connect(bassGain);
                  bassGain.connect(context.destination);
                  bassOsc.start(t);
                  bassOsc.stop(t + 0.35);
                }

                step++;
              }, 140);
            } catch (e) {
              console.warn("BGM initialization failed", e);
            }
          },
          playBeep: () => {
            try {
              const context = getCtx();
              const osc = context.createOscillator();
              const gain = context.createGain();
              osc.connect(gain);
              gain.connect(context.destination);
              osc.type = 'sine';
              osc.frequency.setValueAtTime(880, context.currentTime);
              gain.gain.setValueAtTime(0.08, context.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + 0.1);
              osc.start(context.currentTime);
              osc.stop(context.currentTime + 0.1);
            } catch (e) {}
          },
          playIgnition: () => {
            try {
              const context = getCtx();
              const osc = context.createOscillator();
              const gain = context.createGain();
              osc.connect(gain);
              gain.connect(context.destination);
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(45, context.currentTime);
              osc.frequency.exponentialRampToValueAtTime(15, context.currentTime + 4);
              gain.gain.setValueAtTime(0.25, context.currentTime);
              gain.gain.linearRampToValueAtTime(0.001, context.currentTime + 4);
              osc.start(context.currentTime);
              osc.stop(context.currentTime + 4);

              const bufferSize = context.sampleRate * 4;
              const buffer = context.createBuffer(1, bufferSize, context.sampleRate);
              const data = buffer.getChannelData(0);
              for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
              }
              const noise = context.createBufferSource();
              noise.buffer = buffer;
              const noiseFilter = context.createBiquadFilter();
              noiseFilter.type = 'lowpass';
              noiseFilter.frequency.value = 350;
              const noiseGain = context.createGain();
              noiseGain.gain.setValueAtTime(0.2, context.currentTime);
              noiseGain.gain.linearRampToValueAtTime(0, context.currentTime + 4);

              noise.connect(noiseFilter);
              noiseFilter.connect(noiseGain);
              noiseGain.connect(context.destination);
              noise.start(context.currentTime);
            } catch (e) {}
          },
          playClick: () => {
            try {
              const context = getCtx();
              const osc = context.createOscillator();
              const gain = context.createGain();
              osc.connect(gain);
              gain.connect(context.destination);
              osc.type = 'sine';
              osc.frequency.setValueAtTime(1200, context.currentTime);
              osc.frequency.exponentialRampToValueAtTime(300, context.currentTime + 0.05);
              gain.gain.setValueAtTime(0.03, context.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + 0.05);
              osc.start(context.currentTime);
              osc.stop(context.currentTime + 0.05);
            } catch (e) {}

              osc.frequency.setValueAtTime(783.99, context.currentTime + 0.2);

              gain.gain.setValueAtTime(0.1, context.currentTime);
              gain.gain.linearRampToValueAtTime(0, context.currentTime + 1);
              osc.start(context.currentTime);
              osc.stop(context.currentTime + 1);
            } catch (e) {}

      // ============================================================================
      // PROCEDURAL MOON CANVAS TEXTURE GENERATOR
      // ============================================================================
      function createLunarTextures() {
        const width = 512;
        const height = 256;
        const colorCanvas = document.createElement('canvas');
        colorCanvas.width = width;
        colorCanvas.height = height;
        const ctx = colorCanvas.getContext('2d');

        const bumpCanvas = document.createElement('canvas');
        bumpCanvas.width = width;
        bumpCanvas.height = height;
        const bCtx = bumpCanvas.getContext('2d');

        ctx.fillStyle = '#9CA3AF';
        ctx.fillRect(0, 0, width, height);
        bCtx.fillStyle = '#808080';
        bCtx.fillRect(0, 0, width, height);

        const maria = [
          { x: 160, y: 75, rx: 55, ry: 36 },
          { x: 230, y: 88, rx: 45, ry: 32 },
          { x: 120, y: 105, rx: 40, ry: 28 },
          { x: 310, y: 80, rx: 38, ry: 25 }
        ];
        maria.forEach((m) => {
          const grad = ctx.createRadialGradient(m.x, m.y, 4, m.x, m.y, m.rx);
          grad.addColorStop(0, 'rgba(71, 85, 105, 0.65)');
          grad.addColorStop(1, 'rgba(71, 85, 105, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.ellipse(m.x, m.y, m.rx, m.ry, 0.2, 0, Math.PI * 2);
          ctx.fill();
        });

        for (let i = 0; i < 240; i++) {
          const s1 = ((i * 9301 + 49297) % 233280) / 233280;
          const s2 = ((i * 4253 + 17389) % 233280) / 233280;
          const s3 = ((i * 7129 + 31121) % 233280) / 233280;
          const cx = s1 * width;
          const cy = s2 * height;
          const r = 2 + s3 * 16;

          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(55, 65, 81, 0.42)';
          ctx.fill();

          ctx.beginPath();
          ctx.arc(cx, cy, r * 1.08, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(226, 232, 240, 0.35)';
          ctx.lineWidth = 1.1;
          ctx.stroke();

          const bGrad = bCtx.createRadialGradient(cx, cy, r * 0.1, cx, cy, r * 1.2);
          bGrad.addColorStop(0, '#222222');
          bGrad.addColorStop(0.75, '#4A4A4A');
          bGrad.addColorStop(0.92, '#DCDCDC');
          bGrad.addColorStop(1, '#808080');
          bCtx.fillStyle = bGrad;
          bCtx.beginPath();
          bCtx.arc(cx, cy, r * 1.2, 0, Math.PI * 2);
          bCtx.fill();
        }

        const map = new THREE.CanvasTexture(colorCanvas);
        const bumpMap = new THREE.CanvasTexture(bumpCanvas);
        return { map, bumpMap };
      }

                const noz = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.13, 0.2, 20), steelNozzleMat);
                noz.position.set(nx, 0.08, 0);
                rocketBody.add(noz);
              });
            } else {
              const core = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.33, 3.65, 32), whiteBodyMat);
              core.position.y = 1.98;
              rocketBody.add(core);

              const accentBand = new THREE.Mesh(new THREE.CylinderGeometry(0.336, 0.336, 0.32, 32), orangeBandMat);
              accentBand.position.y = 3.05;
              rocketBody.add(accentBand);

              const intertank = new THREE.Mesh(new THREE.CylinderGeometry(0.335, 0.335, 0.22, 32), darkCarbonMat);
              intertank.position.y = 3.88;
              rocketBody.add(intertank);

              [-0.46, 0.46].forEach((xOff) => {
                const srb = new THREE.Mesh(new THREE.CylinderGeometry(0.145, 0.145, 2.85, 28), whiteBodyMat);
                srb.position.set(xOff, 1.56, 0);
                rocketBody.add(srb);

                [0.9, 1.6, 2.3].forEach((sy) => {
                  const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.149, 0.149, 0.05, 24), darkCarbonMat);
                  ring.position.set(xOff, sy, 0);
                  rocketBody.add(ring);
                });

                const srbNose = new THREE.Mesh(new THREE.ConeGeometry(0.145, 0.45, 24), whiteBodyMat);
                srbNose.position.set(xOff, 3.21, 0);
                rocketBody.add(srbNose);

                const srbNoz = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.14, 0.22, 20), steelNozzleMat);
                srbNoz.position.set(xOff, 0.08, 0);
                rocketBody.add(srbNoz);
              });

              const fairing = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.33, 1.15, 32), whiteBodyMat);
              fairing.position.y = 4.56;
              rocketBody.add(fairing);

              const cone = new THREE.Mesh(new THREE.ConeGeometry(0.36, 0.78, 32), whiteBodyMat);
              cone.position.y = 5.52;
              rocketBody.add(cone);

              const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.045, 0.48, 16), whiteBodyMat);
              tower.position.y = 6.12;
              rocketBody.add(tower);
            }

            const holoGroup = new THREE.Group();
            const outerRingGeo = new THREE.RingGeometry(0.88, 0.95, 64);
            const outerRingMat = new THREE.MeshBasicMaterial({
              color: 0x00e5ff,
              side: THREE.DoubleSide,
              transparent: true,
              opacity: 0.8
            });
            const outerRing = new THREE.Mesh(outerRingGeo, outerRingMat);
            outerRing.rotation.x = -Math.PI / 2;
            holoGroup.add(outerRing);

            const innerRingGeo = new THREE.RingGeometry(0.54, 0.58, 64);
            const innerRingMat = new THREE.MeshBasicMaterial({
              color: 0x38bdf8,
              side: THREE.DoubleSide,
              transparent: true,
              opacity: 0.6
            });
            const innerRing = new THREE.Mesh(innerRingGeo, innerRingMat);
            innerRing.rotation.x = -Math.PI / 2;
            holoGroup.add(innerRing);

            const discGeo = new THREE.CircleGeometry(0.87, 64);
            const discMat = new THREE.MeshBasicMaterial({
              color: 0x00e5ff,
              transparent: true,
              opacity: 0.1
            });
            const disc = new THREE.Mesh(discGeo, discMat);
            disc.rotation.x = -Math.PI / 2;
            disc.position.y = -0.01;
            holoGroup.add(disc);

            root.add(holoGroup);
            root.userData = { rocketBody, holoGroup };
            return root;
          };

          const rocketGroups = ROCKETS.map((r) => {
            const grp = buildRocketMesh(r.id);
            scene.add(grp);
            return grp;
          });

          const raycaster = new THREE.Raycaster();
          const pointer = new THREE.Vector2();

          const handlePointerDown = (e) => {
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            for (let i = 0; i < rocketGroups.length; i++) {
              const hits = raycaster.intersectObjects(rocketGroups[i].children, true);
              if (hits.length > 0 && i !== selectedIdxRef.current) {
                onSelectRocket(i);
                break;
              }
            }
          };
          renderer.domElement.addEventListener('pointerdown', handlePointerDown);

          const handleResize = () => {
            if (!container) return;
            const w = container.clientWidth || 800;
            const h = container.clientHeight || 420;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
          };
          window.addEventListener('resize', handleResize);

          let animId;
          const clock = new THREE.Clock();

          const animate = () => {
            animId = requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();
            const activeIdx = selectedIdxRef.current;

            rocketGroups.forEach((grp, idx) => {
              let rel = idx - activeIdx;
              if (rel < -1) rel += 3;
              if (rel > 1) rel -= 3;

              const isCenter = rel === 0;
              const targetX = rel * 3.55;
              const targetZ = isCenter ? 0.7 : -1.9;
              const targetY = isCenter ? -1.65 + Math.sin(elapsed * 1.8) * 0.06 : -1.2;
              const targetScale = isCenter ? 1.0 : 0.64;

              grp.position.x += (targetX - grp.position.x) * 0.1;
              grp.position.y += (targetY - grp.position.y) * 0.1;
              grp.position.z += (targetZ - grp.position.z) * 0.1;

              const nextScale = grp.scale.x + (targetScale - grp.scale.x) * 0.1;
              grp.scale.set(nextScale, nextScale, nextScale);

              grp.userData.rocketBody.rotation.y = elapsed * (isCenter ? 0.55 : 0.25) + idx;
              grp.userData.holoGroup.visible = isCenter;
              grp.userData.holoGroup.rotation.y = -elapsed * 0.4;
            });

            renderer.render(scene, camera);
          };
          animate();

          return () => {
            cancelAnimationFrame(animId);
            window.removeEventListener('resize', handleResize);
            renderer.domElement.removeEventListener('pointerdown', handlePointerDown);
            renderer.dispose();
          };
        }, [onSelectRocket]);

        return <div ref={containerRef} className="w-full h-[310px] sm:h-[370px] cursor-pointer select-none" />;
      };

      // ============================================================================
      // ACT 3: REAL-TIME DYNAMIC 3D SPACECRAFT BUILDER TELEMETRY MODEL
      // ============================================================================
      const SpacecraftBuilder3D = ({ platform, structure, solar, battery, antenna, instruments }) => {
        const containerRef = useRef(null);
        const configRef = useRef({ platform, structure, solar, battery, antenna, instruments });
        configRef.current = { platform, structure, solar, battery, antenna, instruments };

        useEffect(() => {
          const container = containerRef.current;
          if (!container) return;

          const width = container.clientWidth || 420;
          const height = container.clientHeight || 340;

          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
          camera.position.set(3.2, 2.4, 3.6);
          camera.lookAt(0, 0.35, 0);

          const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          renderer.setSize(width, height);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          renderer.setClearColor(0x000000, 0);
          renderer.domElement.style.width = '100%';
          renderer.domElement.style.height = '100%';
          renderer.domElement.style.display = 'block';
          container.innerHTML = '';
          container.appendChild(renderer.domElement);

          scene.add(new THREE.HemisphereLight(0xffffff, 0x94a3b8, 1.3));
          const keyLight = new THREE.DirectionalLight(0xffffff, 2.1);
          keyLight.position.set(5, 7, 5);
          scene.add(keyLight);
          const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.9);
          fillLight.position.set(-4, 2, -4);
          scene.add(fillLight);

          const gridHelper = new THREE.GridHelper(3.4, 12, 0x00e5ff, 0x1e293b);
          gridHelper.position.y = -0.55;
          scene.add(gridHelper);

          const root = new THREE.Group();
          scene.add(root);

          let prevSignature = '';
          const rebuildModel = () => {
            const cfg = configRef.current;
            const sig = JSON.stringify({
              p: cfg.platform?.id,
              st: cfg.structure?.id,
              so: cfg.solar?.id,
              ba: cfg.battery?.id,
              an: cfg.antenna?.id,
              in: [...cfg.instruments].sort()
            });
            if (sig === prevSignature) return;
            prevSignature = sig;

            while (root.children.length > 0) {
              root.remove(root.children[0]);
            }

            const built = buildConfiguredSpacecraftMesh(cfg);
            root.add(built);
          };

          rebuildModel();

          let isDragging = false;
          let prevX = 0;
          let prevY = 0;
          let rotY = 0.55;
          let rotX = 0.12;

          const onPointerDown = (e) => {
            isDragging = true;
            prevX = e.clientX;
            prevY = e.clientY;
          };
          const onPointerMove = (e) => {
            if (!isDragging) return;
            rotY += (e.clientX - prevX) * 0.012;
            rotX = Math.max(-0.5, Math.min(0.7, rotX + (e.clientY - prevY) * 0.01));
            prevX = e.clientX;
            prevY = e.clientY;
          };
          const onPointerUp = () => {
            isDragging = false;
          };

          const dom = renderer.domElement;
          dom.addEventListener('pointerdown', onPointerDown);
          window.addEventListener('pointermove', onPointerMove);
          window.addEventListener('pointerup', onPointerUp);

          const handleResize = () => {
            if (!container) return;
            const w = container.clientWidth;
            const h = container.clientHeight;
            if (w > 0 && h > 0) {
              camera.aspect = w / h;
              camera.updateProjectionMatrix();
              renderer.setSize(w, h, false);
            }
          };
          handleResize();
          const rafResize = requestAnimationFrame(handleResize);
          const resizeObserver = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(handleResize) : null;
          if (resizeObserver) resizeObserver.observe(container);
          window.addEventListener('resize', handleResize);

          let animId;
          const animate = () => {
            animId = requestAnimationFrame(animate);
            rebuildModel();
            if (!isDragging) {
              rotY += 0.005;
            }
            root.rotation.y = rotY;
            root.rotation.x = rotX;
            renderer.render(scene, camera);
          };
          animate();

          return () => {
            cancelAnimationFrame(animId);
            cancelAnimationFrame(rafResize);
            if (resizeObserver) resizeObserver.disconnect();
            dom.removeEventListener('pointerdown', onPointerDown);
            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);
            window.removeEventListener('resize', handleResize);
            renderer.dispose();
          };
        }, []);

        return <div ref={containerRef} className="w-full h-[260px] sm:h-[310px] cursor-grab active:cursor-grabbing" />;
      };

      // ============================================================================
      // ACT 6B: TRANSLUNAR TRANSFER CUTSCENE WITH T-10 COUNTDOWN & SOUND ENGINE
      // ============================================================================
      const LunarTransferCutscene = ({
        rocket,
        platform,
        solar,
        antenna,
        instruments,
        orbit,
        isOverweight,
        onComplete
      }) => {
        const [countdown, setCountdown] = useState(10);
        const [phaseLabel, setPhaseLabel] = useState('PRE-IGNITION');
        const [progress, setProgress] = useState(0);
        const [activeBeat, setActiveBeat] = useState(null);
        const [typedText, setTypedText] = useState('');
        const [slowMoActive, setSlowMoActive] = useState(false);

        const triggeredBeatsRef = useRef({});
        const beatHoldTimerRef = useRef(0);

        const beats = useMemo(
          () => [
            {
              id: 'phaseA',
              triggerProgress: 20,
              phase: 'PHASE A: DEPARTURE',
              title: 'TLI BURN // EARTH DEPARTURE',
              lines: [
                `> VEHICLE: ${rocket.name}`,
                `> TLI DELTA-V: 3,140 m/s NOMINAL`,
                `> PAYLOAD: ${platform.name} ON TRAJECTORY`
              ]
            },
            {
              id: 'phaseB',
              triggerProgress: 54,
              phase: 'PHASE B: TRANSFER',
              title: 'CISLUNAR COAST // MID-COURSE TELEMETRY',
              lines: [
                `> DISTANCE FROM EARTH: 214,800 km`,
                isOverweight
                  ? `> WARN: EXCESS MASS - PROPELLANT MARGIN CRITICAL`
                  : `> PROPELLANT & CRYO THERMAL: NOMINAL`,
                `> DSN X-BAND LOCK: CONFIRMED`
              ]
            },
            {
              id: 'phaseC',
              triggerProgress: 84,
              phase: 'PHASE C: APPROACH',
              title: 'LOI CAPTURE // ORBIT INSERTION',
              lines: [
                `> TARGET: ${orbit.name}`,
                `> LUNAR GRAVITY WELL CAPTURE: SUCCESS`,
                `> PREPARING SOUTH POLE DESCENT`
              ]
            }
          ],
          [rocket, platform, orbit, isOverweight]
        );

        useEffect(() => {
          if (countdown <= 0) return;

          SoundEngine.playBeep();

          const t = setTimeout(() => {
            setCountdown((c) => {
              const next = c - 1;
              if (next === 0) {
                SoundEngine.playIgnition();
              }
              return next;
            });
          }, 1000);
          return () => clearTimeout(t);
        }, [countdown]);

        useEffect(() => {
          if (countdown > 0) return;

          let lastTime = performance.now();
          let animId;

          const tick = (now) => {
            const dt = (now - lastTime) / 1000;
            lastTime = now;

            if (beatHoldTimerRef.current > 0) {
              beatHoldTimerRef.current -= dt;
              setProgress((p) => Math.min(100, p + dt * 2.4));
              if (beatHoldTimerRef.current <= 0) {
                setActiveBeat(null);
                setSlowMoActive(false);
              }
            } else {
              setProgress((prev) => {
                const next = prev + dt * 13.5;
                for (const b of beats) {
                  if (!triggeredBeatsRef.current[b.id] && next >= b.triggerProgress) {
                    triggeredBeatsRef.current[b.id] = true;
                    setPhaseLabel(b.phase);
                    setActiveBeat(b);
                    setSlowMoActive(true);
                    beatHoldTimerRef.current = 3.1;
                    break;
                  }
                }
                if (next >= 100) {
                  setTimeout(onComplete, 450);
                  return 100;
                }
                return next;
              });
            }

            animId = requestAnimationFrame(tick);
          };

          animId = requestAnimationFrame(tick);
          return () => cancelAnimationFrame(animId);
        }, [countdown, beats, onComplete]);

        useEffect(() => {
          if (!activeBeat) {
            setTypedText('');
            return;
          }
          const fullStr = activeBeat.lines.join('\n');
          let idx = 0;
          setTypedText('');
          const interval = setInterval(() => {
            idx += 2;
            setTypedText(fullStr.slice(0, idx));
            if (idx >= fullStr.length) {
              clearInterval(interval);
            }
          }, 24);
          return () => clearInterval(interval);
        }, [activeBeat]);

        const t = progress / 100;
        const p0 = { x: 130, y: 295 };
        const p1 = { x: 410, y: 75 };
        const p2 = { x: 685, y: 155 };
        const craftX = (1 - t) * (1 - t) * p0.x + 2 * (1 - t) * t * p1.x + t * t * p2.x;
        const craftY = (1 - t) * (1 - t) * p0.y + 2 * (1 - t) * t * p1.y + t * t * p2.y;

        const dx = 2 * (1 - t) * (p1.x - p0.x) + 2 * t * (p2.x - p1.x);
        const dy = 2 * (1 - t) * (p1.y - p0.y) + 2 * t * (p2.y - p1.y);
        const headingDeg = (Math.atan2(dy, dx) * 180) / Math.PI;

        const metHours = Math.floor(t * 96);
        const metMins = Math.floor((t * 96 * 60) % 60);
        const isRover = platform?.id === 'viper';
        const hasDeployableSolar = solar?.id === 'deployable';

        const hasDrill = instruments?.includes('drill');

        return (
          <div className="relative w-full max-w-5xl mx-auto px-4 pt-3 pb-6">

                <span className={progress >= 15 ? 'text-cyan-300 font-bold' : 'text-slate-500'}>
                  PHASE A: DEPARTURE
                </span>
                <span className="text-slate-600">──</span>
                <span className={progress >= 50 ? 'text-cyan-300 font-bold' : 'text-slate-500'}>
                  PHASE B: TRANSFER
                </span>
                <span className="text-slate-600">──</span>
                <span className={progress >= 82 ? 'text-cyan-300 font-bold' : 'text-slate-500'}>
                  PHASE C: APPROACH
                </span>
              </div>

              <div className="flex items-center gap-3">
                {slowMoActive && (
                  <span className="px-2.5 py-1 rounded bg-cyan-500/20 border border-cyan-400 text-cyan-300 font-mono-tech text-[11px] animate-pulse">
                    0.3x SLOW-MO TELEMETRY BEAT

                <span className="font-mono-tech text-xs text-slate-300">

                </span>
                <button
                  onClick={onComplete}
                  className="px-3 py-1 rounded-lg border border-slate-600 hover:border-cyan-400 text-xs font-mono-tech text-slate-300 hover:text-cyan-300 transition-colors"
                >
                  SKIP TRANSIT &gt;&gt;
                </button>
              </div>
            </div>

            <div className="relative glass-card rounded-2xl overflow-hidden h-[400px] sm:h-[440px]">
              {progress >= 45 && (
                <div className="absolute top-4 left-4 z-20 glass-card rounded-lg p-3 w-52">
                  <div className="text-[10px] font-mono-tech text-slate-400 mb-1.5">MID-COURSE PROPULSION</div>
                  <div className="mb-2">
                    <div className="flex justify-between text-[10px] font-mono-tech mb-0.5">
                      <span className="text-slate-300">PROPELLANT</span>
                      <span className={isOverweight ? 'text-red-400 font-bold' : 'text-emerald-400'}>
                        {isOverweight ? '31% LOW' : '74% NOMINAL'}
                      </span>
                    </div>
                    <div className="h-1.5 bg-slate-800 rounded-full overflow-hidden">
                      <div
                        className={`h-full ${isOverweight ? 'bg-red-500' : 'bg-emerald-400'}`}
                        style={{ width: isOverweight ? '31%' : '74%' }}
                      />
                    </div>
                  </div>
                  <div>
                    <div className="flex justify-between text-[10px] font-mono-tech mb-0.5">
                      <span className="text-slate-300">CRYO THERMAL</span>
                      <span className="text-cyan-300">112 K STABLE</span>
                    </div>
                    <div className="h-1.5 bg-slate-800 rounded-full overflow-hidden">
                      <div className="h-full bg-cyan-400 w-[82%]" />
                    </div>
                  </div>
                </div>
              )}

              {countdown > 0 && (
                <div className="absolute inset-0 z-30 flex flex-col items-center justify-center bg-[#070B14]/65 backdrop-blur-sm">
                  <div className="text-xs font-mono-tech tracking-widest text-cyan-400 mb-2">
                    TERMINAL COUNTDOWN // {rocket.name}
                  </div>
                  <div className="font-display text-7xl sm:text-8xl font-extrabold text-white tracking-wider">
                    T-{String(countdown).padStart(2, '0')}
                  </div>
                </div>
              )}

              {countdown === 0 && progress < 8 && (
                <div className="absolute inset-0 z-20 flex items-center justify-center pointer-events-none">
                  <div className="font-display text-5xl sm:text-6xl font-extrabold text-cyan-300 tracking-widest animate-pulse">
                    IGNITION!
                  </div>
                </div>
              )}

              <svg
                viewBox="0 0 820 400"
                className="w-full h-full transition-transform duration-700"
                style={{
                  transform: slowMoActive ? 'scale(1.08)' : 'scale(1.0)',
                  transformOrigin: `${(craftX / 820) * 100}% ${(craftY / 400) * 100}%`
                }}
              >
                <defs>
                  <radialGradient id="earthGrad" cx="35%" cy="35%" r="65%">
                    <stop offset="0%" stopColor="#38BDF8" />
                    <stop offset="55%" stopColor="#0284C7" />
                    <stop offset="100%" stopColor="#0F172A" />
                  </radialGradient>
                  <radialGradient id="moonGrad" cx="35%" cy="35%" r="65%">
                    <stop offset="0%" stopColor="#E2E8F0" />
                    <stop offset="65%" stopColor="#94A3B8" />
                    <stop offset="100%" stopColor="#1E293B" />
                  </radialGradient>
                </defs>

                <circle cx="130" cy="295" r="52" fill="url(#earthGrad)" stroke="#38BDF8" strokeWidth="1.5" strokeOpacity="0.6" />
                <circle cx="130" cy="295" r="64" fill="none" stroke="#38BDF8" strokeDasharray="4 4" strokeOpacity="0.35" />
                <text x="130" y="372" textAnchor="middle" fill="#94A3B8" fontSize="11" fontFamily="JetBrains Mono, monospace">
                  EARTH // KSC LC-39A
                </text>

                <circle cx="685" cy="155" r="32" fill="url(#moonGrad)" stroke="#CBD5E1" strokeWidth="1.2" />
                <ellipse
                  cx="685"
                  cy="155"
                  rx="48"
                  ry="24"
                  transform="rotate(-24 685 155)"
                  fill="none"
                  stroke="#00E5FF"
                  strokeWidth="1.5"
                  strokeDasharray="4 3"
                />
                <text x="685" y="212" textAnchor="middle" fill="#94A3B8" fontSize="11" fontFamily="JetBrains Mono, monospace">
                  MOON // {orbit.id.toUpperCase()}
                </text>

                <path
                  d="M 130 295 Q 410 75 685 155"
                  fill="none"
                  stroke="rgba(56, 189, 248, 0.35)"
                  strokeWidth="2"
                  strokeDasharray="6 6"
                />

                {countdown === 0 && (
                  <g transform={`translate(${craftX}, ${craftY}) rotate(${headingDeg})`}>
                    <circle r="22" fill="rgba(0, 229, 255, 0.12)" stroke="rgba(0, 229, 255, 0.35)" strokeWidth="0.8" strokeDasharray="3 2" />
                    <polygon points="-13,-3 -27,0 -13,3" fill="#38BDF8" opacity="0.85" />
                    {solar?.id !== 'bodymount' && (
                      <>
                        <rect
                          x="-4"
                          y={hasDeployableSolar ? '-23' : '-17'}
                          width="8"
                          height={hasDeployableSolar ? '13' : '8'}
                          rx="1"
                          fill="#0284C7"
                          stroke="#38BDF8"
                          strokeWidth="1"
                        />
                        <rect
                          x="-4"
                          y={hasDeployableSolar ? '10' : '9'}
                          width="8"
                          height={hasDeployableSolar ? '13' : '8'}
                          rx="1"
                          fill="#0284C7"
                          stroke="#38BDF8"
                          strokeWidth="1"
                        />
                      </>
                    )}
                    <rect x="-10" y="-8" width="20" height="16" rx="2.5" fill="#F59E0B" stroke="#FEF08A" strokeWidth="1" />
                    {isRover ? (
                      <>
                        <circle cx="-6" cy="-10" r="2.6" fill="#0F172A" stroke="#94A3B8" strokeWidth="1" />
                        <circle cx="6" cy="-10" r="2.6" fill="#0F172A" stroke="#94A3B8" strokeWidth="1" />
                        <circle cx="-6" cy="10" r="2.6" fill="#0F172A" stroke="#94A3B8" strokeWidth="1" />
                        <circle cx="6" cy="10" r="2.6" fill="#0F172A" stroke="#94A3B8" strokeWidth="1" />
                      </>
                    ) : (

      // ============================================================================
      // ACT 4: 3D HOLOGRAPHIC LUNAR ORBIT SELECTOR
      // ============================================================================
      const LunarOrbit3DViewport = ({ selectedOrbitIdx, onSelectOrbit }) => {
        const containerRef = useRef(null);
        const selectedIdxRef = useRef(selectedOrbitIdx);
        selectedIdxRef.current = selectedOrbitIdx;

        useEffect(() => {
          const container = containerRef.current;
          if (!container) return;

          const width = container.clientWidth || 800;
          const height = container.clientHeight || 360;

          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 100);
          camera.position.set(0, 1.3, 8.6);
          camera.lookAt(0, 0, 0);

          const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          renderer.setSize(width, height);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          renderer.setClearColor(0x000000, 0);
          container.innerHTML = '';
          container.appendChild(renderer.domElement);

          scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 1.1));
          const key = new THREE.DirectionalLight(0xffffff, 2.0);
          key.position.set(5, 4, 6);
          scene.add(key);

          const { map, bumpMap } = createLunarTextures();
          const orbitGroups = ORBITS.map((orb, idx) => {
            const grp = new THREE.Group();

            const moonMesh = new THREE.Mesh(
              new THREE.SphereGeometry(1.12, 48, 48),
              new THREE.MeshStandardMaterial({
                map,
                bumpMap,
                bumpScale: 0.04,
                roughness: 0.85,
                metalness: 0.05
              })
            );
            grp.add(moonMesh);

            const curvePts = [];
            const rx = 1.65;
            const ry = 1.65 * orb.eccentricity;
            for (let i = 0; i <= 96; i++) {
              const a = (i / 96) * Math.PI * 2;
              curvePts.push(new THREE.Vector3(Math.cos(a) * rx, Math.sin(a) * ry, 0));
            }
            const orbitGeo = new THREE.BufferGeometry().setFromPoints(curvePts);
            const orbitMat = new THREE.LineBasicMaterial({ color: orb.color, transparent: true, opacity: 0.9 });
            const orbitLine = new THREE.Line(orbitGeo, orbitMat);
            orbitLine.rotation.y = orb.inclination;
            orbitLine.rotation.x = 0.25;
            grp.add(orbitLine);

            const sat = new THREE.Mesh(
              new THREE.SphereGeometry(0.085, 16, 16),
              new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            const satHalo = new THREE.Mesh(
              new THREE.SphereGeometry(0.16, 16, 16),
              new THREE.MeshBasicMaterial({ color: orb.color, transparent: true, opacity: 0.45 })
            );
            sat.add(satHalo);
            orbitLine.add(sat);

            grp.userData = { moonMesh, sat, rx, ry, idx };
            scene.add(grp);
            return grp;
          });

          const raycaster = new THREE.Raycaster();
          const pointer = new THREE.Vector2();
          const handlePointerDown = (e) => {
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            for (let i = 0; i < orbitGroups.length; i++) {
              const hits = raycaster.intersectObjects(orbitGroups[i].children, true);
              if (hits.length > 0 && i !== selectedIdxRef.current) {
                onSelectOrbit(i);
                break;
              }
            }
          };
          renderer.domElement.addEventListener('pointerdown', handlePointerDown);

          const handleResize = () => {
            if (!container) return;
            const w = container.clientWidth || 800;
            const h = container.clientHeight || 360;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
          };
          window.addEventListener('resize', handleResize);

          let animId;
          const clock = new THREE.Clock();
          const animate = () => {
            animId = requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();
            const activeIdx = selectedIdxRef.current;

            orbitGroups.forEach((grp, idx) => {
              let rel = idx - activeIdx;
              if (rel < -1) rel += 3;
              if (rel > 1) rel -= 3;

              const isCenter = rel === 0;
              const targetX = rel * 3.8;
              const targetZ = isCenter ? 0.6 : -2.2;
              const targetScale = isCenter ? 1.0 : 0.62;

              grp.position.x += (targetX - grp.position.x) * 0.1;
              grp.position.z += (targetZ - grp.position.z) * 0.1;
              const s = grp.scale.x + (targetScale - grp.scale.x) * 0.1;
              grp.scale.set(s, s, s);

              grp.userData.moonMesh.rotation.y = elapsed * 0.18 + idx;
              const angle = elapsed * (1.1 - idx * 0.15) + idx;
              grp.userData.sat.position.set(
                Math.cos(angle) * grp.userData.rx,
                Math.sin(angle) * grp.userData.ry,
                0
              );
            });

            renderer.render(scene, camera);
          };
          animate();

          return () => {
            cancelAnimationFrame(animId);
            window.removeEventListener('resize', handleResize);
            renderer.domElement.removeEventListener('pointerdown', handlePointerDown);
            renderer.dispose();
          };
        }, [onSelectOrbit]);

        return <div ref={containerRef} className="w-full h-[290px] sm:h-[340px] cursor-pointer select-none" />;
      };

      // ============================================================================
      // ACT 5: 5-AXIS PENTAGON SPIDER RADAR CHART
      // ============================================================================
      const PentagonRadarChart = ({ metrics }) => {
        const cx = 140;
        const cy = 140;
        const maxR = 92;

        const getPoint = (index, pct) => {
          const angle = -Math.PI / 2 + (index * 2 * Math.PI) / 5;
          const r = (Math.max(0, Math.min(100, pct)) / 100) * maxR;
          return {
            x: cx + Math.cos(angle) * r,
            y: cy + Math.sin(angle) * r
          };
        };

        const levels = [25, 50, 75, 100];
        const dataPoints = metrics.map((m, idx) => getPoint(idx, m.value));
        const polygonStr = dataPoints.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

        return (
          <svg viewBox="0 0 280 280" className="w-full max-w-[270px] mx-auto select-none">
            {levels.map((lvl) => {
              const pts = [0, 1, 2, 3, 4]
                .map((i) => {
                  const p = getPoint(i, lvl);
                  return `${p.x.toFixed(1)},${p.y.toFixed(1)}`;
                })
                .join(' ');
              return (
                <polygon
                  key={lvl}
                  points={pts}
                  fill="none"
                  stroke="rgba(56, 189, 248, 0.22)"
                  strokeWidth="1"
                />
              );
            })}

            {[0, 1, 2, 3, 4].map((i) => {
              const p = getPoint(i, 100);
              return (
                <line
                  key={i}
                  x1={cx}
                  y1={cy}
                  x2={p.x}
                  y2={p.y}
                  stroke="rgba(56, 189, 248, 0.25)"
                  strokeWidth="1"
                />
              );
            })}

            <polygon
              points={polygonStr}
              fill="rgba(0, 229, 255, 0.22)"
              stroke="#00E5FF"
              strokeWidth="2.2"
            />

            {metrics.map((m, i) => {
              const pt = dataPoints[i];
              const labelPt = getPoint(i, 122);
              return (
                <g key={m.label}>
                  <circle cx={pt.x} cy={pt.y} r="4.5" fill="#00E5FF" />
                  <text
                    x={labelPt.x}
                    y={labelPt.y}
                    textAnchor="middle"
                    dominantBaseline="middle"
                    fill="#CBD5E1"
                    fontSize="10"
                    fontFamily="JetBrains Mono, monospace"
                    fontWeight="700"
                  >
                    {m.label}
                  </text>
                </g>
              );
            })}
          </svg>
        );
      };

      // ============================================================================
      // ACT 6C: 3D HALF-MOON SOUTH POLE LANDING ZONE SELECTOR
      // ============================================================================
      const SouthPole3DLandingSelector = ({ selectedSiteId, onSelectSite }) => {
        const containerRef = useRef(null);
        const selectedSiteRef = useRef(selectedSiteId);
        selectedSiteRef.current = selectedSiteId;

        const targetRotRef = useRef({ rotX: -0.92, rotY: 0.35, zoom: 4.8 });

        const focusSite = useCallback((siteId) => {
          const site = LANDING_SITES.find((s) => s.id === siteId);
          if (!site) return;
          targetRotRef.current = {
            rotX: -0.95,
            rotY: -site.lon + 0.25,
            zoom: 4.35
          };
        }, []);

        useEffect(() => {
          focusSite(selectedSiteId);
        }, [selectedSiteId, focusSite]);

        useEffect(() => {
          const container = containerRef.current;
          if (!container) return;

          const width = container.clientWidth || 640;
          const height = container.clientHeight || 440;

          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 100);
          camera.position.set(0, 0.2, 4.8);

          const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          renderer.setSize(width, height);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          renderer.setClearColor(0x000000, 0);
          container.innerHTML = '';
          container.appendChild(renderer.domElement);

          scene.add(new THREE.AmbientLight(0x1e293b, 0.55));
          const grazingSun = new THREE.DirectionalLight(0xffffff, 2.5);
          grazingSun.position.set(6, 1.4, 3.2);
          scene.add(grazingSun);

          const { map, bumpMap } = createLunarTextures();
          const moonGroup = new THREE.Group();
          scene.add(moonGroup);

          const moonRadius = 1.65;
          const moonMesh = new THREE.Mesh(
            new THREE.SphereGeometry(moonRadius, 64, 64),
            new THREE.MeshStandardMaterial({
              map,
              bumpMap,
              bumpScale: 0.06,
              roughness: 0.88,
              metalness: 0.05
            })
          );
          moonGroup.add(moonMesh);

          const beaconGroups = LANDING_SITES.map((site) => {
            const bGroup = new THREE.Group();
            const phi = Math.PI / 2 - site.lat;
            const theta = site.lon;

            const x = moonRadius * Math.sin(phi) * Math.sin(theta);
            const y = moonRadius * Math.cos(phi);
            const z = moonRadius * Math.sin(phi) * Math.cos(theta);

            bGroup.position.set(x, y, z);
            const normal = new THREE.Vector3(x, y, z).normalize();
            bGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);

            const pillar = new THREE.Mesh(
              new THREE.CylinderGeometry(0.025, 0.035, 0.45, 16),
              new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.88 })
            );
            pillar.position.y = 0.22;
            bGroup.add(pillar);

            const ring = new THREE.Mesh(
              new THREE.RingGeometry(0.06, 0.11, 24),
              new THREE.MeshBasicMaterial({ color: 0x00e5ff, side: THREE.DoubleSide })
            );
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = 0.02;
            bGroup.add(ring);

            bGroup.userData = { siteId: site.id, pillar, ring };
            moonGroup.add(bGroup);
            return bGroup;
          });

          let isDragging = false;
          let moved = false;
          let prevX = 0;
          let prevY = 0;

          const raycaster = new THREE.Raycaster();
          const pointer = new THREE.Vector2();

          const onPointerDown = (e) => {
            isDragging = true;
            moved = false;
            prevX = e.clientX;
            prevY = e.clientY;
          };

          const onPointerMove = (e) => {
            if (!isDragging) return;
            const dx = e.clientX - prevX;
            const dy = e.clientY - prevY;
            if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
            targetRotRef.current.rotY += dx * 0.01;
            targetRotRef.current.rotX = Math.max(-1.45, Math.min(0.4, targetRotRef.current.rotX + dy * 0.01));
            prevX = e.clientX;
            prevY = e.clientY;
          };

          const onPointerUp = (e) => {
            isDragging = false;
            if (!moved) {
              const rect = renderer.domElement.getBoundingClientRect();
              pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
              pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
              raycaster.setFromCamera(pointer, camera);
              for (const bg of beaconGroups) {
                const hits = raycaster.intersectObjects(bg.children, true);
                if (hits.length > 0) {
                  onSelectSite(bg.userData.siteId);
                  break;
                }
              }
            }
          };

          const onWheel = (e) => {
            e.preventDefault();
            targetRotRef.current.zoom = Math.max(3.6, Math.min(6.6, targetRotRef.current.zoom + e.deltaY * 0.002));
          };

          const dom = renderer.domElement;
          dom.addEventListener('pointerdown', onPointerDown);
          window.addEventListener('pointermove', onPointerMove);
          window.addEventListener('pointerup', onPointerUp);
          dom.addEventListener('wheel', onWheel, { passive: false });

          const handleResize = () => {
            if (!container) return;
            const w = container.clientWidth || 640;
            const h = container.clientHeight || 440;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
          };
          window.addEventListener('resize', handleResize);

          let animId;
          const clock = new THREE.Clock();
          const animate = () => {
            animId = requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            moonGroup.rotation.x += (targetRotRef.current.rotX - moonGroup.rotation.x) * 0.08;
            moonGroup.rotation.y += (targetRotRef.current.rotY - moonGroup.rotation.y) * 0.08;
            camera.position.z += (targetRotRef.current.zoom - camera.position.z) * 0.08;

            beaconGroups.forEach((bg) => {
              const active = bg.userData.siteId === selectedSiteRef.current;
              const scale = active ? 1.45 + Math.sin(t * 5) * 0.15 : 0.9;
              bg.userData.pillar.scale.set(active ? 1.4 : 0.85, scale, active ? 1.4 : 0.85);
              bg.userData.pillar.material.color.setHex(active ? 0x10b981 : 0x00e5ff);
              bg.userData.ring.scale.setScalar(active ? 1.6 + Math.sin(t * 4) * 0.2 : 1.0);
            });

            renderer.render(scene, camera);
          };
          animate();

          return () => {
            cancelAnimationFrame(animId);
            dom.removeEventListener('pointerdown', onPointerDown);
            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);
            dom.removeEventListener('wheel', onWheel);
            window.removeEventListener('resize', handleResize);
            renderer.dispose();
          };
        }, [onSelectSite]);

        return (
          <div className="relative w-full h-[380px] sm:h-[460px] glass-card rounded-2xl overflow-hidden">
            <div ref={containerRef} className="w-full h-full cursor-grab active:cursor-grabbing" />
            <div className="absolute bottom-3 left-3 px-2.5 py-1 rounded bg-[#070B14]/85 border border-cyan-500/30 font-mono-tech text-[10px] text-cyan-300">
              3D LUNAR SOUTH POLE // POLAR GRAZING LIGHT
            </div>
            <div className="absolute bottom-3 right-3 flex items-center gap-1.5">
              <button
                onClick={() => {
                  targetRotRef.current.zoom = Math.max(3.6, targetRotRef.current.zoom - 0.45);
                }}
                className="w-8 h-8 rounded-lg bg-[#070B14]/85 border border-cyan-500/30 hover:border-cyan-400 flex items-center justify-center text-cyan-300"
                title="Zoom In"
              >
                <ZoomIn className="w-4 h-4" />
              </button>
              <button
                onClick={() => {
                  targetRotRef.current.zoom = Math.min(6.6, targetRotRef.current.zoom + 0.45);
                }}
                className="w-8 h-8 rounded-lg bg-[#070B14]/85 border border-cyan-500/30 hover:border-cyan-400 flex items-center justify-center text-cyan-300"
                title="Zoom Out"
              >
                <ZoomOut className="w-4 h-4" />
              </button>
              <button
                onClick={() => focusSite(selectedSiteId)}
                className="w-8 h-8 rounded-lg bg-[#070B14]/85 border border-cyan-500/30 hover:border-cyan-400 flex items-center justify-center text-cyan-300"
                title="Reset Camera"
              >
                <RotateCcw className="w-4 h-4" />
              </button>
            </div>
          </div>
        );
      };

      // ============================================================================
      // ACT 6D: 3D TERMINAL POWERED DESCENT SCENE WITH BUILT 3D SPACECRAFT

      const TerminalDescent3D = ({
