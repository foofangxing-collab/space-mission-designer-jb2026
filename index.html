const StarfieldLayer = () => {
  const stars = useMemo(() => {
    const arr = [];
    for (let i = 0; i < 95; i++) {
      const seed1 = ((i * 9301 + 49297) % 233280) / 233280;
      const seed2 = ((i * 4253 + 17389) % 233280) / 233280;
      const seed3 = ((i * 7129 + 31121) % 233280) / 233280;
      arr.push({
        id: i,
        left: `${(seed1 * 100).toFixed(2)}%`,
        top: `${(seed2 * 100).toFixed(2)}%`,
        size: seed3 > 0.82 ? 2.2 : seed3 > 0.45 ? 1.4 : 1,
        opacity: 0.25 + seed3 * 0.65
      });
    }
    return arr;
  }, []);

  return (
    <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">
      {stars.map((s) => (
        <div
          key={s.id}
          className="absolute rounded-full bg-white"
          style={{
            left: s.left,
            top: s.top,
            width: `${s.size}px`,
            height: `${s.size}px`,
            opacity: s.opacity
          }}
        />
      ))}
      <div
        className="absolute inset-0"
        style={{
          background:
            'radial-gradient(circle at 75% 25%, rgba(14, 165, 233, 0.08) 0%, transparent 52%), radial-gradient(circle at 20% 80%, rgba(0, 229, 255, 0.05) 0%, transparent 50%)'
        }}
      />
    </div>
  );
};

// ============================================================================
// PROCEDURAL MOON CANVAS TEXTURE GENERATOR (No External URLs)
// ============================================================================
function createLunarTextures() {
  const width = 512;
  const height = 256;
  const colorCanvas = document.createElement('canvas');
  colorCanvas.width = width;
  colorCanvas.height = height;
  const ctx = colorCanvas.getContext('2d');

  const bumpCanvas = document.createElement('canvas');
  bumpCanvas.width = width;
  bumpCanvas.height = height;
  const bCtx = bumpCanvas.getContext('2d');

  // Base regolith albedo
  ctx.fillStyle = '#9CA3AF';
  ctx.fillRect(0, 0, width, height);
  bCtx.fillStyle = '#808080';
  bCtx.fillRect(0, 0, width, height);

  // Dark basaltic maria patches (mostly northern/mid latitudes)
  const maria = [
    { x: 160, y: 75, rx: 55, ry: 36 },
    { x: 230, y: 88, rx: 45, ry: 32 },
    { x: 120, y: 105, rx: 40, ry: 28 },
    { x: 310, y: 80, rx: 38, ry: 25 }
  ];
  maria.forEach((m) => {
    const grad = ctx.createRadialGradient(m.x, m.y, 4, m.x, m.y, m.rx);
    grad.addColorStop(0, 'rgba(71, 85, 105, 0.65)');
    grad.addColorStop(1, 'rgba(71, 85, 105, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(m.x, m.y, m.rx, m.ry, 0.2, 0, Math.PI * 2);
    ctx.fill();
  });

  // Deterministic craters across sphere with dense highland craters near south pole
  for (let i = 0; i < 240; i++) {
    const s1 = ((i * 9301 + 49297) % 233280) / 233280;
    const s2 = ((i * 4253 + 17389) % 233280) / 233280;
    const s3 = ((i * 7129 + 31121) % 233280) / 233280;
    const cx = s1 * width;
    const cy = s2 * height;
    const r = 2 + s3 * 16;

    // Crater floor shadow
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(55, 65, 81, 0.42)';
    ctx.fill();

    // Bright ejecta rim
    ctx.beginPath();
    ctx.arc(cx, cy, r * 1.08, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(226, 232, 240, 0.35)';
    ctx.lineWidth = 1.1;
    ctx.stroke();

    // Bump map depression + raised rim
    const bGrad = bCtx.createRadialGradient(cx, cy, r * 0.1, cx, cy, r * 1.2);
    bGrad.addColorStop(0, '#222222');
    bGrad.addColorStop(0.75, '#4A4A4A');
    bGrad.addColorStop(0.92, '#DCDCDC');
    bGrad.addColorStop(1, '#808080');
    bCtx.fillStyle = bGrad;
    bCtx.beginPath();
    bCtx.arc(cx, cy, r * 1.2, 0, Math.PI * 2);
    bCtx.fill();
  }

  const map = new THREE.CanvasTexture(colorCanvas);
  const bumpMap = new THREE.CanvasTexture(bumpCanvas);
  return { map, bumpMap };
}

// ============================================================================
// SHARED 3D CONFIGURED SPACECRAFT FACTORY (Used in Builder, Descent & Surface)
// ============================================================================
function buildConfiguredSpacecraftMesh({ platform, structure, solar, battery, antenna, instruments = [] }) {
  const root = new THREE.Group();

  const goldFoilMat = new THREE.MeshStandardMaterial({
    color: 0xf59e0b,
    metalness: 0.85,
    roughness: 0.24
  });
  const whiteAeroMat = new THREE.MeshStandardMaterial({
    color: 0xf8fafc,
    metalness: 0.3,
    roughness: 0.28
  });
  const carbonMat = new THREE.MeshStandardMaterial({
    color: 0x1e293b,
    metalness: 0.6,
    roughness: 0.35
  });
  const solarCellMat = new THREE.MeshStandardMaterial({
    color: 0x0284c7,
    emissive: 0x0369a1,
    emissiveIntensity: 0.32,
    metalness: 0.72,
    roughness: 0.2
  });
  const cyanAccentMat = new THREE.MeshStandardMaterial({
    color: 0x00e5ff,
    emissive: 0x00e5ff,
    emissiveIntensity: 0.5
  });
  const orangeTankMat = new THREE.MeshStandardMaterial({
    color: 0xea580c,
    metalness: 0.25,
    roughness: 0.4
  });

  const isRover = platform?.id === 'viper';
  const structMat =
    structure?.id === 'composite'
      ? carbonMat
      : structure?.id === 'rigid'
      ? whiteAeroMat
      : goldFoilMat;

  const wheels = [];

  if (isRover) {
    // VIPER Polar Rover Chassis + 4 Articulated Wheels
    const chassis = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.44, 0.95), goldFoilMat);
    chassis.position.y = 0.12;
    root.add(chassis);

    const upperDeck = new THREE.Mesh(new THREE.BoxGeometry(1.22, 0.08, 1.02), structMat);
    upperDeck.position.y = 0.36;
    root.add(upperDeck);

    const wheelPositions = [
      [-0.64, -0.28, 0.52],
      [0.64, -0.28, 0.52],
      [-0.64, -0.28, -0.52],
      [0.64, -0.28, -0.52]
    ];
    wheelPositions.forEach(([wx, wy, wz]) => {
      const wheelGroup = new THREE.Group();
      wheelGroup.position.set(wx, wy, wz);

      const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.16, 24), carbonMat);
      wheel.rotation.z = Math.PI / 2;
      wheelGroup.add(wheel);

      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.18, 16), cyanAccentMat);
      hub.rotation.z = Math.PI / 2;
      wheelGroup.add(hub);

      root.add(wheelGroup);
      wheels.push(wheelGroup);

      const strut = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.42, 0.06), whiteAeroMat);
      strut.position.set(wx * 0.85, -0.08, wz * 0.92);
      strut.rotation.z = wx > 0 ? -0.25 : 0.25;
      root.add(strut);
    });
  } else {
    // Blue Ghost Lunar Lander + 4 Landing Legs & Footpads
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.68, 0.74, 0.52, 8), goldFoilMat);
    body.position.y = 0.12;
    root.add(body);

    const deck = new THREE.Mesh(new THREE.CylinderGeometry(0.76, 0.76, 0.08, 8), structMat);
    deck.position.y = 0.4;
    root.add(deck);

    const bell = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.28, 20), carbonMat);
    bell.position.y = -0.24;
    root.add(bell);

    for (let i = 0; i < 4; i++) {
      const a = (i * Math.PI) / 2 + Math.PI / 4;
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.78, 12), whiteAeroMat);
      leg.position.set(Math.cos(a) * 0.84, -0.18, Math.sin(a) * 0.84);
      leg.rotation.z = Math.cos(a) * -0.45;
      leg.rotation.x = Math.sin(a) * 0.45;
      root.add(leg);

      const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, 0.04, 16), goldFoilMat);
      pad.position.set(Math.cos(a) * 1.02, -0.52, Math.sin(a) * 1.02);
      root.add(pad);
    }
  }

  // Solar Array Variants
  if (solar?.id === 'deployable') {
    [-1.18, 1.18].forEach((sx) => {
      const arm = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.05, 0.05), whiteAeroMat);
      arm.position.set(sx * 0.65, 0.42, 0);
      root.add(arm);

      const panel = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1.15, 0.68), solarCellMat);
      panel.position.set(sx, 0.78, 0);
      root.add(panel);
    });
  } else if (solar?.id === 'fixed') {
    [-1.12, 1.12].forEach((sx) => {
      const panel = new THREE.Mesh(new THREE.BoxGeometry(0.88, 0.04, 0.62), solarCellMat);
      panel.position.set(sx, 0.42, 0);
      root.add(panel);
    });
  } else {
    const wrap = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.28, 0.04), solarCellMat);
    wrap.position.set(0, 0.14, 0.56);
    root.add(wrap);
  }

  // Battery Pack
  const batScale = battery?.id === 'high_cap' ? 1.35 : battery?.id === 'redundant' ? 1.15 : 0.85;
  const batteryBox = new THREE.Mesh(
    new THREE.BoxGeometry(0.32 * batScale, 0.22, 0.28 * batScale),
    whiteAeroMat
  );
  batteryBox.position.set(-0.32, 0.52, -0.22);
  root.add(batteryBox);

  const batLed = new THREE.Mesh(new THREE.BoxGeometry(0.24 * batScale, 0.04, 0.29 * batScale), cyanAccentMat);
  batLed.position.set(-0.32, 0.56, -0.22);
  root.add(batLed);

  // Antenna Variants
  if (antenna?.id === 'high_gain') {
    const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.48, 12), whiteAeroMat);
    mast.position.set(0.28, 0.65, -0.25);
    root.add(mast);

    const dish = new THREE.Mesh(
      new THREE.SphereGeometry(0.34, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.45),
      whiteAeroMat
    );
    dish.position.set(0.28, 0.92, -0.25);
    dish.rotation.x = Math.PI * 0.78;
    root.add(dish);
  } else if (antenna?.id === 'med_gain') {
    const helix = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.45, 16), cyanAccentMat);
    helix.position.set(0.28, 0.65, -0.25);
    root.add(helix);
  } else {
    const whip = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.025, 0.52, 12), whiteAeroMat);
    whip.position.set(0.28, 0.68, -0.25);
    root.add(whip);
  }

  // Scientific Instruments
  if (instruments.includes('camera')) {
    const camMast = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.45, 12), whiteAeroMat);
    camMast.position.set(-0.22, 0.64, 0.32);
    root.add(camMast);

    const camHead = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.12, 0.14), whiteAeroMat);
    camHead.position.set(-0.22, 0.88, 0.34);
    root.add(camHead);

    [-0.06, 0.06].forEach((lx) => {
      const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.04, 16), cyanAccentMat);
      lens.rotation.x = Math.PI / 2;
      lens.position.set(-0.22 + lx, 0.88, 0.41);
      root.add(lens);
    });
  }

  if (instruments.includes('drill')) {
    const drillHousing = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.42, 0.16), orangeTankMat);
    drillHousing.position.set(0.32, 0.38, 0.42);
    root.add(drillHousing);

    const auger = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.52, 16), whiteAeroMat);
    auger.rotation.x = Math.PI;
    auger.position.set(0.32, -0.05, 0.42);
    root.add(auger);
  }

  if (instruments.includes('spectrometer')) {
    const specBox = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.16, 0.22), cyanAccentMat);
    specBox.position.set(0.02, 0.48, 0.35);
    root.add(specBox);
  }

  root.userData = { wheels };
  return root;
}

          leg.rotation.z = Math.cos(angle) * -0.04;
          leg.rotation.x = Math.sin(angle) * 0.04;
          rocketBody.add(leg);
        }

        // Dark interstage collar

        interstage.position.y = 3.38;
        rocketBody.add(interstage);

        // Second stage + blue telemetry stripe

        rocketBody.add(s2);

        const stripe = new THREE.Mesh(new THREE.CylinderGeometry(0.244, 0.244, 0.14, 32), skyBandMat);
        stripe.position.y = 2.45;
        rocketBody.add(stripe);

        // Tapered payload fairing + tall cone nose
        const fairingShoulder = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.24, 0.28, 32), whiteBodyMat);
        fairingShoulder.position.y = 4.45;
        rocketBody.add(fairingShoulder);

        const fairingBody = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.33, 0.85, 32), whiteBodyMat);
        fairingBody.position.y = 5.01;
        rocketBody.add(fairingBody);

        const nose = new THREE.Mesh(new THREE.ConeGeometry(0.33, 0.72, 32), whiteBodyMat);
        nose.position.y = 5.79;
        rocketBody.add(nose);

        const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.18, 0.18, 24), steelNozzleMat);
        nozzle.position.y = 0.08;
        rocketBody.add(nozzle);
      } else if (type === 'vulcan') {
        // ULA Vulcan Centaur: Tall white core + yellow/gold interstage band + twin boosters (matching video 1)
        const core = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 3.35, 32), whiteBodyMat);
        core.position.y = 1.82;
        rocketBody.add(core);

        // Distinctive yellow/gold band on upper core
        const yellowBand = new THREE.Mesh(new THREE.CylinderGeometry(0.285, 0.285, 0.28, 32), goldBandMat);
        yellowBand.position.y = 2.85;
        rocketBody.add(yellowBand);

        const darkCollar = new THREE.Mesh(new THREE.CylinderGeometry(0.285, 0.285, 0.18, 32), darkCarbonMat);
        darkCollar.position.y = 3.55;

          const srb = new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.115, 2.25, 24), whiteBodyMat);
          srb.position.set(xOff, 1.28, 0);
          rocketBody.add(srb);

          const srbCone = new THREE.Mesh(new THREE.ConeGeometry(0.115, 0.36, 24), whiteBodyMat);
          srbCone.position.set(xOff, 2.58, 0);
          rocketBody.add(srbCone);

          const srbNoz = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.1, 0.18, 16), steelNozzleMat);
          srbNoz.position.set(xOff, 0.1, 0);

        fairing.position.y = 4.44;
        rocketBody.add(fairing);

        const nose = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.78, 32), whiteBodyMat);
        nose.position.y = 5.35;
        rocketBody.add(nose);

        [-0.12, 0.12].forEach((nx) => {
          const noz = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.13, 0.2, 20), steelNozzleMat);
          noz.position.set(nx, 0.08, 0);
          rocketBody.add(noz);
        });
      } else {
        // NASA SLS BLOCK 1: Tall crisp white core with orange/gold accent band + twin tall 5-segment SRBs (matching video 1)
        const core = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.33, 3.65, 32), whiteBodyMat);
        core.position.y = 1.98;
        rocketBody.add(core);

        const accentBand = new THREE.Mesh(new THREE.CylinderGeometry(0.336, 0.336, 0.32, 32), orangeBandMat);
        accentBand.position.y = 3.05;
        rocketBody.add(accentBand);

        const intertank = new THREE.Mesh(new THREE.CylinderGeometry(0.335, 0.335, 0.22, 32), darkCarbonMat);
        intertank.position.y = 3.88;
        rocketBody.add(intertank);

        // Twin Tall 5-Segment SRBs
        [-0.46, 0.46].forEach((xOff) => {
          const srb = new THREE.Mesh(new THREE.CylinderGeometry(0.145, 0.145, 2.85, 28), whiteBodyMat);
          srb.position.set(xOff, 1.56, 0);
          rocketBody.add(srb);

          [0.9, 1.6, 2.3].forEach((sy) => {
            const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.149, 0.149, 0.05, 24), darkCarbonMat);
            ring.position.set(xOff, sy, 0);
            rocketBody.add(ring);
          });

          const srbNose = new THREE.Mesh(new THREE.ConeGeometry(0.145, 0.45, 24), whiteBodyMat);
          srbNose.position.set(xOff, 3.21, 0);
          rocketBody.add(srbNose);

          const srbNoz = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.14, 0.22, 20), steelNozzleMat);
          srbNoz.position.set(xOff, 0.08, 0);
          rocketBody.add(srbNoz);
        });

        // Upper Stage + Fairing + LAS Tower
        const fairing = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.33, 1.15, 32), whiteBodyMat);
        fairing.position.y = 4.56;
        rocketBody.add(fairing);

        const cone = new THREE.Mesh(new THREE.ConeGeometry(0.36, 0.78, 32), whiteBodyMat);
        cone.position.y = 5.52;
        rocketBody.add(cone);

        const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.045, 0.48, 16), whiteBodyMat);
        tower.position.y = 6.12;
        rocketBody.add(tower);
      }

      // Holographic Cyan Concentric Ring Base beneath rocket
      const holoGroup = new THREE.Group();
      const outerRingGeo = new THREE.RingGeometry(0.88, 0.95, 64);
      const outerRingMat = new THREE.MeshBasicMaterial({
        color: 0x00e5ff,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.8
      });
      const outerRing = new THREE.Mesh(outerRingGeo, outerRingMat);
      outerRing.rotation.x = -Math.PI / 2;
      holoGroup.add(outerRing);

      const innerRingGeo = new THREE.RingGeometry(0.54, 0.58, 64);
      const innerRingMat = new THREE.MeshBasicMaterial({
        color: 0x38bdf8,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.6
      });
      const innerRing = new THREE.Mesh(innerRingGeo, innerRingMat);
      innerRing.rotation.x = -Math.PI / 2;
      holoGroup.add(innerRing);

      const discGeo = new THREE.CircleGeometry(0.87, 64);
      const discMat = new THREE.MeshBasicMaterial({
        color: 0x00e5ff,
        transparent: true,
        opacity: 0.1
      });
      const disc = new THREE.Mesh(discGeo, discMat);
      disc.rotation.x = -Math.PI / 2;
      disc.position.y = -0.01;
      holoGroup.add(disc);

      root.add(holoGroup);
      root.userData = { rocketBody, holoGroup };
      return root;
    };

    const rocketGroups = ROCKETS.map((r) => {
      const grp = buildRocketMesh(r.id);
      scene.add(grp);
      return grp;
    });

    // Raycaster so clicking flanking 3D rockets directly selects them
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    const handlePointerDown = (e) => {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      for (let i = 0; i < rocketGroups.length; i++) {
        const hits = raycaster.intersectObjects(rocketGroups[i].children, true);
        if (hits.length > 0 && i !== selectedIdxRef.current) {
          onSelectRocket(i);
          break;
        }
      }
    };
    renderer.domElement.addEventListener('pointerdown', handlePointerDown);

    const handleResize = () => {
      if (!container) return;
      const w = container.clientWidth || 800;
      const h = container.clientHeight || 420;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    };
    window.addEventListener('resize', handleResize);

    let animId;
    const clock = new THREE.Clock();

    const animate = () => {
      animId = requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      const activeIdx = selectedIdxRef.current;

      rocketGroups.forEach((grp, idx) => {
        // Coverflow relative offset (-1, 0, +1)
        let rel = idx - activeIdx;
        if (rel < -1) rel += 3;
        if (rel > 1) rel -= 3;

        const isCenter = rel === 0;
        const targetX = rel * 3.55;
        const targetZ = isCenter ? 0.7 : -1.9;
        const targetY = isCenter ? -1.65 + Math.sin(elapsed * 1.8) * 0.06 : -1.2;
        const targetScale = isCenter ? 1.0 : 0.64;

        grp.position.x += (targetX - grp.position.x) * 0.1;
        grp.position.y += (targetY - grp.position.y) * 0.1;
        grp.position.z += (targetZ - grp.position.z) * 0.1;

        const nextScale = grp.scale.x + (targetScale - grp.scale.x) * 0.1;
        grp.scale.set(nextScale, nextScale, nextScale);

        // Continuous slow 360 rotation
        grp.userData.rocketBody.rotation.y = elapsed * (isCenter ? 0.55 : 0.25) + idx;

        // Holographic ring visibility & opacity
        grp.userData.holoGroup.visible = isCenter;
        grp.userData.holoGroup.rotation.y = -elapsed * 0.4;
      });

      renderer.render(scene, camera);
    };
    animate();

    return () => {
      cancelAnimationFrame(animId);
      window.removeEventListener('resize', handleResize);
      renderer.domElement.removeEventListener('pointerdown', handlePointerDown);
      renderer.dispose();
    };
  }, [onSelectRocket]);

  return <div ref={containerRef} className="w-full h-[310px] sm:h-[370px] cursor-pointer select-none" />;
};

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.domElement.style.width = '100%';
    renderer.domElement.style.height = '100%';
    renderer.domElement.style.display = 'block';
    container.innerHTML = '';
    container.appendChild(renderer.domElement);

    // Bright aerospace studio lighting
    scene.add(new THREE.HemisphereLight(0xffffff, 0x94a3b8, 1.3));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.1);
    keyLight.position.set(5, 7, 5);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.9);
    fillLight.position.set(-4, 2, -4);
    scene.add(fillLight);

    // Holographic floor grid ring
    const gridHelper = new THREE.GridHelper(3.4, 12, 0x00e5ff, 0x1e293b);
    gridHelper.position.y = -0.55;
    scene.add(gridHelper);

    const root = new THREE.Group();
    scene.add(root);

    // Build / rebuild 3D spacecraft whenever config changes
    let prevSignature = '';
    const rebuildModel = () => {
      const cfg = configRef.current;
      const sig = JSON.stringify({
        p: cfg.platform?.id,
        st: cfg.structure?.id,
        so: cfg.solar?.id,
        ba: cfg.battery?.id,
        an: cfg.antenna?.id,
        in: [...cfg.instruments].sort()
      });
      if (sig === prevSignature) return;
      prevSignature = sig;

      while (root.children.length > 0) {
        root.remove(root.children[0]);
      }

      const built = buildConfiguredSpacecraftMesh(cfg);
      root.add(built);
    };

    rebuildModel();

    // Drag to rotate 360° interaction
    let isDragging = false;
    let prevX = 0;
    let prevY = 0;
    let rotY = 0.55;
    let rotX = 0.12;

    const onPointerDown = (e) => {
      isDragging = true;
      prevX = e.clientX;
      prevY = e.clientY;
    };
    const onPointerMove = (e) => {
      if (!isDragging) return;
      rotY += (e.clientX - prevX) * 0.012;
      rotX = Math.max(-0.5, Math.min(0.7, rotX + (e.clientY - prevY) * 0.01));
      prevX = e.clientX;
      prevY = e.clientY;
    };
    const onPointerUp = () => {
      isDragging = false;
    };

    const dom = renderer.domElement;
    dom.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);

    const handleResize = () => {
      if (!container) return;
      const w = container.clientWidth;
      const h = container.clientHeight;
      if (w > 0 && h > 0) {
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h, false);
      }
    };
    handleResize();
    const rafResize = requestAnimationFrame(handleResize);
    const resizeObserver = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(handleResize) : null;
    if (resizeObserver) resizeObserver.observe(container);
    window.addEventListener('resize', handleResize);

    let animId;
    const animate = () => {
      animId = requestAnimationFrame(animate);
      rebuildModel();
      if (!isDragging) {
        rotY += 0.005;
      }
      root.rotation.y = rotY;
      root.rotation.x = rotX;
      renderer.render(scene, camera);
    };
    animate();

    return () => {
      cancelAnimationFrame(animId);
      cancelAnimationFrame(rafResize);
      if (resizeObserver) resizeObserver.disconnect();
      dom.removeEventListener('pointerdown', onPointerDown);
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('resize', handleResize);
      renderer.dispose();
    };
  }, []);

  return <div ref={containerRef} className="w-full h-[260px] sm:h-[310px] cursor-grab active:cursor-grabbing" />;
};

// ============================================================================
// ACT 6B: TRANSLUNAR TRANSFER CUTSCENE WITH CUSTOM BUILT SPACECRAFT MODEL
// ============================================================================
const LunarTransferCutscene = ({
  rocket,
  platform,
  solar,
  antenna,
  instruments,
  orbit,
  isOverweight,
  onComplete
}) => {
  const [countdown, setCountdown] = useState(5);
  const [phaseLabel, setPhaseLabel] = useState('PRE-IGNITION');
  const [progress, setProgress] = useState(0); // 0 to 100 along trajectory
  const [activeBeat, setActiveBeat] = useState(null); // null or { id, title, lines, pos }
  const [typedText, setTypedText] = useState('');
  const [slowMoActive, setSlowMoActive] = useState(false);

  const triggeredBeatsRef = useRef({});
  const beatHoldTimerRef = useRef(0);

  // Trajectory milestones
  const beats = useMemo(
    () => [
      {
        id: 'phaseA',
        triggerProgress: 20,
        phase: 'PHASE A: DEPARTURE',
        title: 'TLI BURN // EARTH DEPARTURE',
        lines: [
          `> VEHICLE: ${rocket.name}`,
          `> TLI DELTA-V: 3,140 m/s NOMINAL`,
          `> PAYLOAD: ${platform.name} ON TRAJECTORY`
        ]
      },
      {
        id: 'phaseB',
        triggerProgress: 54,
        phase: 'PHASE B: TRANSFER',
        title: 'CISLUNAR COAST // MID-COURSE TELEMETRY',
        lines: [
          `> DISTANCE FROM EARTH: 214,800 km`,
          isOverweight
            ? `> WARN: EXCESS MASS - PROPELLANT MARGIN CRITICAL`
            : `> PROPELLANT & CRYO THERMAL: NOMINAL`,
          `> DSN X-BAND LOCK: CONFIRMED`
        ]
      },
      {
        id: 'phaseC',
        triggerProgress: 84,
        phase: 'PHASE C: APPROACH',
        title: 'LOI CAPTURE // ORBIT INSERTION',
        lines: [
          `> TARGET: ${orbit.name}`,
          `> LUNAR GRAVITY WELL CAPTURE: SUCCESS`,
          `> PREPARING SOUTH POLE DESCENT`
        ]
      }
    ],
    [rocket, platform, orbit, isOverweight]
  );

  // Countdown T-05 -> IGNITION
  useEffect(() => {
    if (countdown <= 0) return;
    const t = setTimeout(() => {
      setCountdown((c) => c - 1);
    }, 650);
    return () => clearTimeout(t);
  }, [countdown]);

  // Flight progression loop with 0.3x slow-mo telemetry pauses
  useEffect(() => {
    if (countdown > 0) return;

    let lastTime = performance.now();
    let animId;

    const tick = (now) => {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      if (beatHoldTimerRef.current > 0) {
        beatHoldTimerRef.current -= dt;
        // 0.3x slow motion drift while terminal types & holds
        setProgress((p) => Math.min(100, p + dt * 2.4));
        if (beatHoldTimerRef.current <= 0) {
          setActiveBeat(null);
          setSlowMoActive(false);
        }
      } else {
        setProgress((prev) => {
          const next = prev + dt * 13.5;
          for (const b of beats) {
            if (!triggeredBeatsRef.current[b.id] && next >= b.triggerProgress) {
              triggeredBeatsRef.current[b.id] = true;
              setPhaseLabel(b.phase);
              setActiveBeat(b);
              setSlowMoActive(true);
              beatHoldTimerRef.current = 3.1;
              break;
            }
          }
          if (next >= 100) {
            setTimeout(onComplete, 450);
            return 100;
          }
          return next;
        });
      }

      animId = requestAnimationFrame(tick);
    };

    animId = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(animId);
  }, [countdown, beats, onComplete]);

  // Typewriter effect when activeBeat changes
  useEffect(() => {
    if (!activeBeat) {
      setTypedText('');
      return;
    }
    const fullStr = activeBeat.lines.join('\n');
    let idx = 0;
    setTypedText('');
    const interval = setInterval(() => {
      idx += 2;
      setTypedText(fullStr.slice(0, idx));
      if (idx >= fullStr.length) {
        clearInterval(interval);
      }
    }, 24);
    return () => clearInterval(interval);
  }, [activeBeat]);

  // Quadratic Bezier point along Earth (130, 295) -> Control (410, 75) -> Moon (685, 155)
  const t = progress / 100;
  const p0 = { x: 130, y: 295 };
  const p1 = { x: 410, y: 75 };
  const p2 = { x: 685, y: 155 };
  const craftX = (1 - t) * (1 - t) * p0.x + 2 * (1 - t) * t * p1.x + t * t * p2.x;
  const craftY = (1 - t) * (1 - t) * p0.y + 2 * (1 - t) * t * p1.y + t * t * p2.y;

  // Tangent heading angle along trajectory curve so built spacecraft points forward
  const dx = 2 * (1 - t) * (p1.x - p0.x) + 2 * t * (p2.x - p1.x);
  const dy = 2 * (1 - t) * (p1.y - p0.y) + 2 * t * (p2.y - p1.y);
  const headingDeg = (Math.atan2(dy, dx) * 180) / Math.PI;

  const metHours = Math.floor(t * 96);
  const metMins = Math.floor((t * 96 * 60) % 60);
  const isRover = platform?.id === 'viper';
  const hasDeployableSolar = solar?.id === 'deployable';
  const hasHighGain = antenna?.id === 'high_gain';
  const hasDrill = instruments?.includes('drill');

  return (
    <div className="relative w-full max-w-5xl mx-auto px-4 pt-3 pb-6">
      {/* Top Cutscene Status Bar */}
      <div className="glass-card rounded-xl px-4 py-3 flex flex-wrap items-center justify-between gap-3 mb-4">
        <div className="flex items-center gap-2 sm:gap-3 text-[11px] sm:text-xs font-mono-tech">
          <span className={progress >= 15 ? 'text-cyan-300 font-bold' : 'text-slate-500'}>
            PHASE A: DEPARTURE
          </span>
          <span className="text-slate-600">──</span>
          <span className={progress >= 50 ? 'text-cyan-300 font-bold' : 'text-slate-500'}>
            PHASE B: TRANSFER
          </span>
          <span className="text-slate-600">──</span>
          <span className={progress >= 82 ? 'text-cyan-300 font-bold' : 'text-slate-500'}>
            PHASE C: APPROACH
          </span>
        </div>

        <div className="flex items-center gap-3">
          {slowMoActive && (
            <span className="px-2.5 py-1 rounded bg-cyan-500/20 border border-cyan-400 text-cyan-300 font-mono-tech text-[11px] animate-pulse">
              0.3x SLOW-MO TELEMETRY BEAT
            </span>
          )}
          <span className="font-mono-tech text-xs text-slate-300">
            MET <span className="text-cyan-300 font-bold">00:{String(metHours).padStart(2, '0')}:{String(metMins).padStart(2, '0')}</span>
          </span>
          <button
            onClick={onComplete}
            className="px-3 py-1 rounded-lg border border-slate-600 hover:border-cyan-400 text-xs font-mono-tech text-slate-300 hover:text-cyan-300 transition-colors"
          >
            SKIP TRANSIT &gt;&gt;
          </button>
        </div>
      </div>

      {/* Main SVG Translunar Trajectory Stage */}
      <div className="relative glass-card rounded-2xl overflow-hidden h-[400px] sm:h-[440px]">
        {/* Phase B Propellant / Thermal Mini Readout */}
        {progress >= 45 && (
          <div className="absolute top-4 left-4 z-20 glass-card rounded-lg p-3 w-52">
            <div className="text-[10px] font-mono-tech text-slate-400 mb-1.5">MID-COURSE PROPULSION</div>
            <div className="mb-2">
              <div className="flex justify-between text-[10px] font-mono-tech mb-0.5">
                <span className="text-slate-300">PROPELLANT</span>
                <span className={isOverweight ? 'text-red-400 font-bold' : 'text-emerald-400'}>
                  {isOverweight ? '31% LOW' : '74% NOMINAL'}
                </span>
              </div>
              <div className="h-1.5 bg-slate-800 rounded-full overflow-hidden">
                <div
                  className={`h-full ${isOverweight ? 'bg-red-500' : 'bg-emerald-400'}`}
                  style={{ width: isOverweight ? '31%' : '74%' }}
                />
              </div>
            </div>
            <div>
              <div className="flex justify-between text-[10px] font-mono-tech mb-0.5">
                <span className="text-slate-300">CRYO THERMAL</span>
                <span className="text-cyan-300">112 K STABLE</span>
              </div>
              <div className="h-1.5 bg-slate-800 rounded-full overflow-hidden">
                <div className="h-full bg-cyan-400 w-[82%]" />
              </div>
            </div>
          </div>
        )}

        {/* Countdown Overlay */}
        {countdown > 0 && (
          <div className="absolute inset-0 z-30 flex flex-col items-center justify-center bg-[#070B14]/65 backdrop-blur-sm">
            <div className="text-xs font-mono-tech tracking-widest text-cyan-400 mb-2">
              TERMINAL COUNTDOWN // {rocket.name}
            </div>
            <div className="font-display text-7xl sm:text-8xl font-extrabold text-white tracking-wider">
              T-0{countdown}
            </div>
          </div>
        )}

        {countdown === 0 && progress < 8 && (
          <div className="absolute inset-0 z-20 flex items-center justify-center pointer-events-none">
            <div className="font-display text-5xl sm:text-6xl font-extrabold text-cyan-300 tracking-widest animate-pulse">
              IGNITION!
            </div>
          </div>
        )}

        <svg
          viewBox="0 0 820 400"
          className="w-full h-full transition-transform duration-700"
          style={{
            transform: slowMoActive ? 'scale(1.08)' : 'scale(1.0)',
            transformOrigin: `${(craftX / 820) * 100}% ${(craftY / 400) * 100}%`
          }}
        >
          <defs>
            <radialGradient id="earthGrad" cx="35%" cy="35%" r="65%">
              <stop offset="0%" stopColor="#38BDF8" />
              <stop offset="55%" stopColor="#0284C7" />
              <stop offset="100%" stopColor="#0F172A" />
            </radialGradient>
            <radialGradient id="moonGrad" cx="35%" cy="35%" r="65%">
              <stop offset="0%" stopColor="#E2E8F0" />
              <stop offset="65%" stopColor="#94A3B8" />
              <stop offset="100%" stopColor="#1E293B" />
            </radialGradient>
          </defs>

          {/* Earth */}
          <circle cx="130" cy="295" r="52" fill="url(#earthGrad)" stroke="#38BDF8" strokeWidth="1.5" strokeOpacity="0.6" />
          <circle cx="130" cy="295" r="64" fill="none" stroke="#38BDF8" strokeDasharray="4 4" strokeOpacity="0.35" />
          <text x="130" y="372" textAnchor="middle" fill="#94A3B8" fontSize="11" fontFamily="JetBrains Mono, monospace">
            EARTH // KSC LC-39A
          </text>

          {/* Moon */}
          <circle cx="685" cy="155" r="32" fill="url(#moonGrad)" stroke="#CBD5E1" strokeWidth="1.2" />
          <ellipse
            cx="685"
            cy="155"
            rx="48"
            ry="24"
            transform="rotate(-24 685 155)"
            fill="none"
            stroke="#00E5FF"
            strokeWidth="1.5"
            strokeDasharray="4 3"
          />
          <text x="685" y="212" textAnchor="middle" fill="#94A3B8" fontSize="11" fontFamily="JetBrains Mono, monospace">
            MOON // {orbit.id.toUpperCase()}
          </text>

          {/* Dashed Translunar Trajectory Arc */}
          <path
            d="M 130 295 Q 410 75 685 155"
            fill="none"
            stroke="rgba(56, 189, 248, 0.35)"
            strokeWidth="2"
            strokeDasharray="6 6"
          />

          {/* Custom Built 3D-Styled Spacecraft Marker (Video 2 Style) */}
          {countdown === 0 && (
            <g transform={`translate(${craftX}, ${craftY}) rotate(${headingDeg})`}>
              {/* Subtle cyan telemetry halo */}
              <circle r="22" fill="rgba(0, 229, 255, 0.12)" stroke="rgba(0, 229, 255, 0.35)" strokeWidth="0.8" strokeDasharray="3 2" />
              {/* Thruster ion plume trail behind craft */}
              <polygon points="-13,-3 -27,0 -13,3" fill="#38BDF8" opacity="0.85" />
              {/* Solar Array Wings (vertical/extended for deployable, compact for fixed/body) */}
              {solar?.id !== 'bodymount' && (
                <>
                  <rect
                    x="-4"
                    y={hasDeployableSolar ? '-23' : '-17'}
                    width="8"
                    height={hasDeployableSolar ? '13' : '8'}
                    rx="1"
                    fill="#0284C7"
                    stroke="#38BDF8"
                    strokeWidth="1"
                  />
                  <rect
                    x="-4"
                    y={hasDeployableSolar ? '10' : '9'}
                    width="8"
                    height={hasDeployableSolar ? '13' : '8'}
                    rx="1"
                    fill="#0284C7"
                    stroke="#38BDF8"
                    strokeWidth="1"
                  />
                </>
              )}
              {/* Gold Kapton Foil Main Bus */}
              <rect x="-10" y="-8" width="20" height="16" rx="2.5" fill="#F59E0B" stroke="#FEF08A" strokeWidth="1" />
              {/* Rover Wheels or Lander Footpads */}
              {isRover ? (
                <>
                  <circle cx="-6" cy="-10" r="2.6" fill="#0F172A" stroke="#94A3B8" strokeWidth="1" />
                  <circle cx="6" cy="-10" r="2.6" fill="#0F172A" stroke="#94A3B8" strokeWidth="1" />
                  <circle cx="-6" cy="10" r="2.6" fill="#0F172A" stroke="#94A3B8" strokeWidth="1" />
                  <circle cx="6" cy="10" r="2.6" fill="#0F172A" stroke="#94A3B8" strokeWidth="1" />
                </>
              ) : (
                <>
                  <line x1="-8" y1="-8" x2="-13" y2="-13" stroke="#E2E8F0" strokeWidth="1.4" />
                  <line x1="-8" y1="8" x2="-13" y2="13" stroke="#E2E8F0" strokeWidth="1.4" />
                </>
              )}
              {/* High-Gain Dish / Forward Sensor Mast */}
              {hasHighGain ? (
                <path d="M 10,-6 Q 16,0 10,6" fill="none" stroke="#F8FAFC" strokeWidth="1.8" />
              ) : (
                <line x1="10" y1="0" x2="16" y2="0" stroke="#F8FAFC" strokeWidth="1.5" />
              )}
              {hasDrill && <circle cx="9" cy="4" r="2" fill="#EA580C" />}
              <circle cx="0" cy="0" r="2.4" fill="#00E5FF" />
            </g>
          )}

          {/* Callout Polyline Leader when Slow-Mo Beat Active */}
          {activeBeat && (
            <g>
              <circle cx={craftX} cy={craftY} r="7" fill="none" stroke="#00E5FF" strokeWidth="2" />
              <polyline
                points={`${craftX},${craftY} ${craftX + 36},${craftY + 42} ${craftX + 75},${craftY + 42}`}
                fill="none"
                stroke="#00E5FF"
                strokeWidth="1.8"
              />
            </g>
          )}
        </svg>

        {/* Translucent Typewriter Telemetry Callout Box */}
        {activeBeat && (
          <div
            className="absolute z-20 bg-[#091224]/92 backdrop-blur-md border border-cyan-400/50 border-l-4 border-l-[#00E5FF] rounded-r-lg p-3.5 w-72 sm:w-80 shadow-[0_0_25px_rgba(0,229,255,0.25)]"
            style={{
              left: `${Math.min(56, Math.max(12, ((craftX + 72) / 820) * 100))}%`,
              top: `${Math.min(62, Math.max(22, ((craftY + 25) / 400) * 100))}%`
            }}
          >
            <div className="text-[11px] font-mono-tech font-bold text-cyan-300 mb-1.5">{activeBeat.title}</div>
            <pre className="text-[11px] font-mono-tech text-slate-200 whitespace-pre-wrap leading-relaxed">
              {typedText}
            </pre>
          </div>
        )}
      </div>
    </div>
  );
};

// ============================================================================
// ACT 4: 3D HOLOGRAPHIC LUNAR ORBIT SELECTOR
// ============================================================================
const LunarOrbit3DViewport = ({ selectedOrbitIdx, onSelectOrbit }) => {
  const containerRef = useRef(null);
  const selectedIdxRef = useRef(selectedOrbitIdx);
  selectedIdxRef.current = selectedOrbitIdx;

  useEffect(() => {
    const container = containerRef.current;
    if (!container) return;

    const width = container.clientWidth || 800;
    const height = container.clientHeight || 360;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 100);
    camera.position.set(0, 1.3, 8.6);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    container.innerHTML = '';
    container.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 1.1));
    const key = new THREE.DirectionalLight(0xffffff, 2.0);
    key.position.set(5, 4, 6);
    scene.add(key);

    const { map, bumpMap } = createLunarTextures();
    const orbitGroups = ORBITS.map((orb, idx) => {
      const grp = new THREE.Group();

      const moonMesh = new THREE.Mesh(
        new THREE.SphereGeometry(1.12, 48, 48),
        new THREE.MeshStandardMaterial({
          map,
          bumpMap,
          bumpScale: 0.04,
          roughness: 0.85,
          metalness: 0.05
        })
      );
      grp.add(moonMesh);

      // Elliptical Glowing Orbit Ring
      const curvePts = [];
      const rx = 1.65;
      const ry = 1.65 * orb.eccentricity;
      for (let i = 0; i <= 96; i++) {
        const a = (i / 96) * Math.PI * 2;
        curvePts.push(new THREE.Vector3(Math.cos(a) * rx, Math.sin(a) * ry, 0));
      }
      const orbitGeo = new THREE.BufferGeometry().setFromPoints(curvePts);
      const orbitMat = new THREE.LineBasicMaterial({ color: orb.color, transparent: true, opacity: 0.9 });
      const orbitLine = new THREE.Line(orbitGeo, orbitMat);
      orbitLine.rotation.y = orb.inclination;
      orbitLine.rotation.x = 0.25;
      grp.add(orbitLine);

      // Orbiting Satellite Beacon Dot
      const sat = new THREE.Mesh(
        new THREE.SphereGeometry(0.085, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      const satHalo = new THREE.Mesh(
        new THREE.SphereGeometry(0.16, 16, 16),
        new THREE.MeshBasicMaterial({ color: orb.color, transparent: true, opacity: 0.45 })
      );
      sat.add(satHalo);
      orbitLine.add(sat);

      grp.userData = { moonMesh, sat, rx, ry, idx };
      scene.add(grp);
      return grp;
    });

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const handlePointerDown = (e) => {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      for (let i = 0; i < orbitGroups.length; i++) {
        const hits = raycaster.intersectObjects(orbitGroups[i].children, true);
        if (hits.length > 0 && i !== selectedIdxRef.current) {
          onSelectOrbit(i);
          break;
        }
      }
    };
    renderer.domElement.addEventListener('pointerdown', handlePointerDown);

    const handleResize = () => {
      if (!container) return;
      const w = container.clientWidth || 800;
      const h = container.clientHeight || 360;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    };
    window.addEventListener('resize', handleResize);

    let animId;
    const clock = new THREE.Clock();
    const animate = () => {
      animId = requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      const activeIdx = selectedIdxRef.current;

      orbitGroups.forEach((grp, idx) => {
        let rel = idx - activeIdx;
        if (rel < -1) rel += 3;
        if (rel > 1) rel -= 3;

        const isCenter = rel === 0;
        const targetX = rel * 3.8;
        const targetZ = isCenter ? 0.6 : -2.2;
        const targetScale = isCenter ? 1.0 : 0.62;

        grp.position.x += (targetX - grp.position.x) * 0.1;
        grp.position.z += (targetZ - grp.position.z) * 0.1;
        const s = grp.scale.x + (targetScale - grp.scale.x) * 0.1;
        grp.scale.set(s, s, s);

        grp.userData.moonMesh.rotation.y = elapsed * 0.18 + idx;
        const angle = elapsed * (1.1 - idx * 0.15) + idx;
        grp.userData.sat.position.set(
          Math.cos(angle) * grp.userData.rx,
          Math.sin(angle) * grp.userData.ry,
          0
        );
      });

      renderer.render(scene, camera);
    };
    animate();

    return () => {
      cancelAnimationFrame(animId);
      window.removeEventListener('resize', handleResize);
      renderer.domElement.removeEventListener('pointerdown', handlePointerDown);
      renderer.dispose();
    };
  }, [onSelectOrbit]);

  return <div ref={containerRef} className="w-full h-[290px] sm:h-[340px] cursor-pointer select-none" />;
};

// ============================================================================
// ACT 5: 5-AXIS PENTAGON SPIDER RADAR CHART
// ============================================================================
const PentagonRadarChart = ({ metrics }) => {
  const cx = 140;
  const cy = 140;
  const maxR = 92;

  const getPoint = (index, pct) => {
    const angle = -Math.PI / 2 + (index * 2 * Math.PI) / 5;
    const r = (Math.max(0, Math.min(100, pct)) / 100) * maxR;
    return {
      x: cx + Math.cos(angle) * r,
      y: cy + Math.sin(angle) * r
    };
  };

  const levels = [25, 50, 75, 100];
  const dataPoints = metrics.map((m, idx) => getPoint(idx, m.value));
  const polygonStr = dataPoints.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

  return (
    <svg viewBox="0 0 280 280" className="w-full max-w-[270px] mx-auto select-none">
      {/* Concentric Pentagon Webs */}
      {levels.map((lvl) => {
        const pts = [0, 1, 2, 3, 4]
          .map((i) => {
            const p = getPoint(i, lvl);
            return `${p.x.toFixed(1)},${p.y.toFixed(1)}`;
          })
          .join(' ');
        return (
          <polygon
            key={lvl}
            points={pts}
            fill="none"
            stroke="rgba(56, 189, 248, 0.22)"
            strokeWidth="1"
          />
        );
      })}

      {/* Radial Axis Spokes */}
      {[0, 1, 2, 3, 4].map((i) => {
        const p = getPoint(i, 100);
        return (
          <line
            key={i}
            x1={cx}
            y1={cy}
            x2={p.x}
            y2={p.y}
            stroke="rgba(56, 189, 248, 0.25)"
            strokeWidth="1"
          />
        );
      })}

      {/* Active Data Polygon */}
      <polygon
        points={polygonStr}
        fill="rgba(0, 229, 255, 0.22)"
        stroke="#00E5FF"
        strokeWidth="2.2"
      />

      {/* Vertex Nodes & Labels */}
      {metrics.map((m, i) => {
        const pt = dataPoints[i];
        const labelPt = getPoint(i, 122);
        return (
          <g key={m.label}>
            <circle cx={pt.x} cy={pt.y} r="4.5" fill="#00E5FF" />
            <text
              x={labelPt.x}
              y={labelPt.y}
              textAnchor="middle"
              dominantBaseline="middle"
              fill="#CBD5E1"
              fontSize="10"
              fontFamily="JetBrains Mono, monospace"
              fontWeight="700"
            >
              {m.label}
            </text>
          </g>
        );
      })}
    </svg>
  );
};

// ============================================================================
// ACT 6C: 3D HALF-MOON SOUTH POLE LANDING ZONE SELECTOR
// ============================================================================
const SouthPole3DLandingSelector = ({ selectedSiteId, onSelectSite }) => {
  const containerRef = useRef(null);
  const selectedSiteRef = useRef(selectedSiteId);
  selectedSiteRef.current = selectedSiteId;

  const targetRotRef = useRef({ rotX: -0.92, rotY: 0.35, zoom: 4.8 });

  const focusSite = useCallback((siteId) => {
    const site = LANDING_SITES.find((s) => s.id === siteId);
    if (!site) return;
    targetRotRef.current = {
      rotX: -0.95,
      rotY: -site.lon + 0.25,
      zoom: 4.35
    };
  }, []);

  useEffect(() => {
    focusSite(selectedSiteId);
  }, [selectedSiteId, focusSite]);

  useEffect(() => {
    const container = containerRef.current;
    if (!container) return;

    const width = container.clientWidth || 640;
    const height = container.clientHeight || 440;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 100);
    camera.position.set(0, 0.2, 4.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    container.innerHTML = '';
    container.appendChild(renderer.domElement);

    // Polar Grazing Terminator Light
    scene.add(new THREE.AmbientLight(0x1e293b, 0.55));
    const grazingSun = new THREE.DirectionalLight(0xffffff, 2.5);
    grazingSun.position.set(6, 1.4, 3.2);
    scene.add(grazingSun);

    const { map, bumpMap } = createLunarTextures();
    const moonGroup = new THREE.Group();
    scene.add(moonGroup);

    const moonRadius = 1.65;
    const moonMesh = new THREE.Mesh(
      new THREE.SphereGeometry(moonRadius, 64, 64),
      new THREE.MeshStandardMaterial({
        map,
        bumpMap,
        bumpScale: 0.06,
        roughness: 0.88,
        metalness: 0.05
      })
    );
    moonGroup.add(moonMesh);

    // 4 Cyan Glowing Beacon Pillars on South Pole
    const beaconGroups = LANDING_SITES.map((site) => {
      const bGroup = new THREE.Group();
      const phi = Math.PI / 2 - site.lat; // near south pole
      const theta = site.lon;

      const x = moonRadius * Math.sin(phi) * Math.sin(theta);
      const y = moonRadius * Math.cos(phi);
      const z = moonRadius * Math.sin(phi) * Math.cos(theta);

      bGroup.position.set(x, y, z);
      const normal = new THREE.Vector3(x, y, z).normalize();
      bGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);

      const pillar = new THREE.Mesh(
        new THREE.CylinderGeometry(0.025, 0.035, 0.45, 16),
        new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.88 })
      );
      pillar.position.y = 0.22;
      bGroup.add(pillar);

      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.06, 0.11, 24),
        new THREE.MeshBasicMaterial({ color: 0x00e5ff, side: THREE.DoubleSide })
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.02;
      bGroup.add(ring);

      bGroup.userData = { siteId: site.id, pillar, ring };
      moonGroup.add(bGroup);
      return bGroup;
    });

    // Drag Rotate + Wheel Zoom + Click Beacon
    let isDragging = false;
    let moved = false;
    let prevX = 0;
    let prevY = 0;

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    const onPointerDown = (e) => {
      isDragging = true;
      moved = false;
      prevX = e.clientX;
      prevY = e.clientY;
    };

    const onPointerMove = (e) => {
      if (!isDragging) return;
      const dx = e.clientX - prevX;
      const dy = e.clientY - prevY;
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      targetRotRef.current.rotY += dx * 0.01;
      targetRotRef.current.rotX = Math.max(-1.45, Math.min(0.4, targetRotRef.current.rotX + dy * 0.01));
      prevX = e.clientX;
      prevY = e.clientY;
    };

    const onPointerUp = (e) => {
      isDragging = false;
      if (!moved) {
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        for (const bg of beaconGroups) {
          const hits = raycaster.intersectObjects(bg.children, true);
          if (hits.length > 0) {
            onSelectSite(bg.userData.siteId);
            break;
          }
        }
      }
    };

    const onWheel = (e) => {
      e.preventDefault();
      targetRotRef.current.zoom = Math.max(3.6, Math.min(6.6, targetRotRef.current.zoom + e.deltaY * 0.002));
    };

    const dom = renderer.domElement;
    dom.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    dom.addEventListener('wheel', onWheel, { passive: false });

    const handleResize = () => {
      if (!container) return;
      const w = container.clientWidth || 640;
      const h = container.clientHeight || 440;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    };
    window.addEventListener('resize', handleResize);

    let animId;
    const clock = new THREE.Clock();
    const animate = () => {
      animId = requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      moonGroup.rotation.x += (targetRotRef.current.rotX - moonGroup.rotation.x) * 0.08;
      moonGroup.rotation.y += (targetRotRef.current.rotY - moonGroup.rotation.y) * 0.08;
      camera.position.z += (targetRotRef.current.zoom - camera.position.z) * 0.08;

      beaconGroups.forEach((bg) => {
        const active = bg.userData.siteId === selectedSiteRef.current;
        const scale = active ? 1.45 + Math.sin(t * 5) * 0.15 : 0.9;
        bg.userData.pillar.scale.set(active ? 1.4 : 0.85, scale, active ? 1.4 : 0.85);
        bg.userData.pillar.material.color.setHex(active ? 0x10b981 : 0x00e5ff);
        bg.userData.ring.scale.setScalar(active ? 1.6 + Math.sin(t * 4) * 0.2 : 1.0);
      });

      renderer.render(scene, camera);
    };
    animate();

    return () => {
      cancelAnimationFrame(animId);
      dom.removeEventListener('pointerdown', onPointerDown);
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      dom.removeEventListener('wheel', onWheel);
      window.removeEventListener('resize', handleResize);
      renderer.dispose();
    };
  }, [onSelectSite]);

  return (
    <div className="relative w-full h-[380px] sm:h-[460px] glass-card rounded-2xl overflow-hidden">
      <div ref={containerRef} className="w-full h-full cursor-grab active:cursor-grabbing" />
      <div className="absolute bottom-3 left-3 px-2.5 py-1 rounded bg-[#070B14]/85 border border-cyan-500/30 font-mono-tech text-[10px] text-cyan-300">
        3D LUNAR SOUTH POLE // POLAR GRAZING LIGHT
      </div>
      <div className="absolute bottom-3 right-3 flex items-center gap-1.5">
        <button
          onClick={() => {
            targetRotRef.current.zoom = Math.max(3.6, targetRotRef.current.zoom - 0.45);
          }}
          className="w-8 h-8 rounded-lg bg-[#070B14]/85 border border-cyan-500/30 hover:border-cyan-400 flex items-center justify-center text-cyan-300"
          title="Zoom In"
        >
          <ZoomIn className="w-4 h-4" />
        </button>
        <button
          onClick={() => {
            targetRotRef.current.zoom = Math.min(6.6, targetRotRef.current.zoom + 0.45);
          }}
          className="w-8 h-8 rounded-lg bg-[#070B14]/85 border border-cyan-500/30 hover:border-cyan-400 flex items-center justify-center text-cyan-300"
          title="Zoom Out"
        >
          <ZoomOut className="w-4 h-4" />
        </button>
        <button
          onClick={() => focusSite(selectedSiteId)}
          className="w-8 h-8 rounded-lg bg-[#070B14]/85 border border-cyan-500/30 hover:border-cyan-400 flex items-center justify-center text-cyan-300"
          title="Reset Camera"
        >
          <RotateCcw className="w-4 h-4" />
        </button>
      </div>
    </div>
  );
};

// ============================================================================
// ACT 6D: 3D TERMINAL POWERED DESCENT SCENE WITH BUILT 3D SPACECRAFT
// ============================================================================
const TerminalDescent3D = ({
  platform,
  structure,
  solar,
  battery,
  antenna,
  instruments,
  landingSite,
  isHardLanding,
  onTouchdownComplete
}) => {
  const containerRef = useRef(null);
  const [altitude, setAltitude] = useState(420);
  const [velocity, setVelocity] = useState(28.4);
  const [statusMsg, setStatusMsg] = useState('POWERED DESCENT INITIATED...');

  useEffect(() => {
    const container = containerRef.current;
    if (!container) return;
    const width = container.clientWidth || 900;
    const height = container.clientHeight || 520;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 100);
    camera.position.set(4.6, 2.7, 5.4);
    camera.lookAt(0, 1.0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.domElement.style.width = '100%';
    renderer.domElement.style.height = '100%';
    renderer.domElement.style.display = 'block';
    container.innerHTML = '';
    container.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 1.15));
    const sun = new THREE.DirectionalLight(0xffffff, 2.35);
    sun.position.set(8, 3.0, 4);
    scene.add(sun);

    // Cratered Lunar Regolith Terrain (3D faceted relief)
    const groundGeo = new THREE.PlaneGeometry(26, 26, 68, 68);
    groundGeo.rotateX(-Math.PI / 2);
    const posAttr = groundGeo.attributes.position;
    for (let i = 0; i < posAttr.count; i++) {
      const x = posAttr.getX(i);
      const z = posAttr.getZ(i);
      const dist = Math.sqrt((x - 2.4) * (x - 2.4) + (z + 1.8) * (z + 1.8));
      let y = Math.sin(x * 0.7) * Math.cos(z * 0.7) * 0.12;
      if (dist < 2.6) {
        y -= Math.cos((dist / 2.6) * (Math.PI / 2)) * 0.65;
      }
      posAttr.setY(i, y);
    }
    groundGeo.computeVertexNormals();
    const ground = new THREE.Mesh(
      groundGeo,
      new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.9, metalness: 0.08, flatShading: true })
    );
    scene.add(ground);

    // Scattered 3D Lunar Regolith Boulders
    const boulderMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.92, flatShading: true });
    [
      [-2.1, 0.06, 1.6, 0.22],
      [2.4, 0.05, 1.4, 0.18],
      [-1.5, 0.06, -2.2, 0.26],
      [3.1, 0.04, -0.8, 0.16]
    ].forEach(([bx, by, bz, br]) => {
      const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(br, 0), boulderMat);
      rock.position.set(bx, by, bz);
      scene.add(rock);
    });

    // Landing Target Hologram Ring on surface
    const padRing = new THREE.Mesh(
      new THREE.RingGeometry(0.95, 1.08, 48),
      new THREE.MeshBasicMaterial({ color: 0x00e5ff, side: THREE.DoubleSide })
    );
    padRing.rotation.x = -Math.PI / 2;
    padRing.position.y = 0.04;
    scene.add(padRing);

    // User's Exact Built 3D Spacecraft Assembly
    const lander = buildConfiguredSpacecraftMesh({
      platform,
      structure,
      solar,
      battery,
      antenna,
      instruments
    });

    // Glowing Thruster Plume Cone beneath spacecraft
    const plume = new THREE.Mesh(
      new THREE.ConeGeometry(0.28, 1.4, 24),
      new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.76 })
    );
    plume.rotation.x = Math.PI;
    plume.position.y = -1.05;
    lander.add(plume);

    lander.position.y = 4.3;
    scene.add(lander);

    // Regolith Dust Kickup Particles
    const dustCount = 95;
    const dustMeshes = [];
    const dustMat = new THREE.MeshBasicMaterial({ color: 0xcbd5e1, transparent: true, opacity: 0.58 });
    for (let i = 0; i < dustCount; i++) {
      const p = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), dustMat);
      p.visible = false;
      scene.add(p);
      dustMeshes.push({
        mesh: p,
        angle: (i / dustCount) * Math.PI * 2 + Math.random() * 0.3,
        speed: 1.5 + Math.random() * 2.5,
        phase: Math.random()
      });
    }

    const handleResize = () => {
      if (!container) return;
      const w = container.clientWidth;
      const h = container.clientHeight;
      if (w > 0 && h > 0) {
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h, false);
      }
    };
    const resizeObserver = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(handleResize) : null;
    if (resizeObserver) resizeObserver.observe(container);
    window.addEventListener('resize', handleResize);

    let animId;
    const startTime = performance.now();
    const totalDuration = 6.2; // seconds
    const touchdownY = platform?.id === 'viper' ? 0.54 : 0.56;

    const animate = (now) => {
      animId = requestAnimationFrame(animate);
      const elapsed = (now - startTime) / 1000;
      const ratio = Math.min(1, elapsed / totalDuration);
      const eased = 1 - Math.pow(1 - ratio, 2.2);

      const currentY = 4.3 * (1 - eased) + touchdownY;
      lander.position.y = currentY;
      lander.rotation.y = (1 - eased) * 0.65;

      // Update telemetry numbers
      const altMeters = Math.max(0, Math.round(420 * (1 - eased)));
      const velMs = Math.max(0, Number(((1 - eased) * 28.4 + (ratio < 0.98 ? 0.6 : 0)).toFixed(1)));
      setAltitude(altMeters);
      setVelocity(velMs);

      if (ratio < 0.42) {
        setStatusMsg('POWERED DESCENT INITIATED...');
      } else if (ratio < 0.88) {
        setStatusMsg('PLUME SURFACE INTERACTION - DUST KICKUP');
      } else {
        setStatusMsg(
          isHardLanding
            ? 'ROUGH TOUCHDOWN - SUSPENSION STRESSED'
            : `SOFT TOUCHDOWN CONFIRMED - ${landingSite.name.toUpperCase()}`
        );
      }

      // Thruster flicker & cutoff at touchdown
      if (ratio < 0.95) {
        plume.visible = true;
        plume.scale.set(1 + Math.sin(elapsed * 45) * 0.12, 0.85 + Math.cos(elapsed * 55) * 0.2, 1);
      } else {
        plume.visible = false;
      }

      // Kickup regolith dust when lander < 1.9m above surface
      if (currentY < 1.95 && ratio < 0.98) {
        dustMeshes.forEach((d) => {
          d.mesh.visible = true;
          const tDust = (elapsed * 1.4 + d.phase) % 1;
          const r = 0.32 + tDust * d.speed * 1.3;
          d.mesh.position.set(Math.cos(d.angle) * r, 0.06 + Math.sin(tDust * Math.PI) * 0.35, Math.sin(d.angle) * r);
          d.mesh.scale.setScalar(0.5 + tDust * 1.2);
        });
      } else {
        dustMeshes.forEach((d) => {
          d.mesh.visible = false;
        });
      }

      // Smooth 3D cinematic camera orbit around the descending & landed spacecraft
      const camAngle = 0.68 + elapsed * 0.24;
      const camRadius = 6.6 - eased * 1.15;
      camera.position.set(
        Math.sin(camAngle) * camRadius,
        1.75 + (1 - eased) * 1.45,
        Math.cos(camAngle) * camRadius
      );
      camera.lookAt(0, Math.max(0.55, currentY * 0.6), 0);
      renderer.render(scene, camera);

      if (elapsed >= totalDuration + 1.1) {
        cancelAnimationFrame(animId);
        onTouchdownComplete();
      }
    };

    animId = requestAnimationFrame(animate);

    return () => {
      cancelAnimationFrame(animId);
      if (resizeObserver) resizeObserver.disconnect();
      window.removeEventListener('resize', handleResize);
      renderer.dispose();
    };
  }, [platform, structure, solar, battery, antenna, instruments, landingSite, isHardLanding, onTouchdownComplete]);

  return (
    <div className="relative w-full max-w-6xl mx-auto px-4 pt-3 pb-6">
      <div className="relative glass-card rounded-2xl overflow-hidden h-[460px] sm:h-[520px]">
        <div ref={containerRef} className="w-full h-full" />

        {/* Bottom Centered Translucent Descent Telemetry Bar */}
        <div className="absolute bottom-5 left-1/2 -translate-x-1/2 w-[92%] max-w-2xl bg-[#070B14]/88 backdrop-blur-md border border-cyan-400/50 rounded-xl px-5 py-3.5 flex flex-wrap items-center justify-between gap-3 shadow-[0_0_24px_rgba(0,229,255,0.22)]">
          <div className="flex items-center gap-2.5">
            <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping" />
            <span className="font-mono-tech text-xs sm:text-sm font-bold text-cyan-300">
              {statusMsg}
            </span>
          </div>
          <div className="flex items-center gap-4 font-mono-tech text-xs">
            <div>
              <span className="text-slate-400">ALT: </span>
              <span className="text-white font-bold">{altitude} m</span>
            </div>
            <div>
              <span className="text-slate-400">VEL: </span>
              <span className="text-emerald-400 font-bold">{velocity} m/s</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

// ============================================================================
// ACT 7: FULLSCREEN 3D LUNAR SURFACE EXPLORATION WITH BUILT 3D SPACECRAFT
// ============================================================================
const SurfaceOps3D = ({
  platform,
  structure,
  solar,
  battery,
  antenna,
  equippedInstruments,
  landingSite,
  onGenerateReport
}) => {
  // steps: 'SELECT' -> 'MOVING' -> 'READY_COLLECT' -> 'COLLECTING' -> 'COMPLETE'
  const [opsStep, setOpsStep] = useState('SELECT');
  const [selectedInstId, setSelectedInstId] = useState(equippedInstruments[0] || 'camera');
  const [collectPct, setCollectPct] = useState(0);

  const opsStepRef = useRef(opsStep);
  opsStepRef.current = opsStep;
  const selectedInstRef = useRef(selectedInstId);
  selectedInstRef.current = selectedInstId;

  const containerRef = useRef(null);

  const availableInstruments = useMemo(
    () => SUBSYSTEMS.instruments.filter((inst) => equippedInstruments.includes(inst.id)),
    [equippedInstruments]
  );

  // Progress timer for moving & collecting phases
  useEffect(() => {
    if (opsStep === 'MOVING') {
      const t = setTimeout(() => {
        setOpsStep('READY_COLLECT');
      }, 2400);
      return () => clearTimeout(t);
    }
    if (opsStep === 'COLLECTING') {
      setCollectPct(0);
      const start = performance.now();
      const dur = 4600;
      const interval = setInterval(() => {
        const p = Math.min(100, Math.round(((performance.now() - start) / dur) * 100));
        setCollectPct(p);
        if (p >= 100) {
          clearInterval(interval);
          setOpsStep('COMPLETE');
        }
      }, 80);
      return () => clearInterval(interval);
    }
  }, [opsStep]);

  useEffect(() => {
    const container = containerRef.current;
    if (!container) return;
    const width = container.clientWidth || 1000;
    const height = container.clientHeight || 560;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 120);
    camera.position.set(3.8, 1.95, 4.4);
    camera.lookAt(0.2, 0.55, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.domElement.style.width = '100%';
    renderer.domElement.style.height = '100%';
    renderer.domElement.style.display = 'block';
    container.innerHTML = '';
    container.appendChild(renderer.domElement);

    // Polar low-angle grazing sunlight + subtle Earthshine
    scene.add(new THREE.HemisphereLight(0xe2e8f0, 0x1e293b, 0.9));
    const polarSun = new THREE.DirectionalLight(0xffffff, 2.4);
    polarSun.position.set(10, 2.5, 3);
    scene.add(polarSun);

    // Distant glowing Earth in the black lunar sky above horizon
    const earthSphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.42, 24, 24),
      new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
    );
    earthSphere.position.set(-7.5, 4.4, -18);
    scene.add(earthSphere);

    // Lunar South Pole Faceted 3D Cratered Surface (Video 3 Style)
    const surfaceGeo = new THREE.PlaneGeometry(34, 34, 72, 72);
    surfaceGeo.rotateX(-Math.PI / 2);
    const pos = surfaceGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      const dCrater = Math.sqrt((x - 1.6) * (x - 1.6) + (z - 0.2) * (z - 0.2));
      let y = Math.sin(x * 0.6) * Math.cos(z * 0.5) * 0.08;
      if (dCrater < 1.8) {
        y -= Math.cos((dCrater / 1.8) * (Math.PI / 2)) * 0.36;
      }
      pos.setY(i, y);
    }
    surfaceGeo.computeVertexNormals();
    const surface = new THREE.Mesh(
      surfaceGeo,
      new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.92, metalness: 0.08, flatShading: true })
    );
    scene.add(surface);

    // 3D Low-Poly Lunar Boulders around crater rim (Video 3 Style)
    const rockMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.92, flatShading: true });
    [
      [-1.95, 0.08, 1.35, 0.22],
      [-0.4, 0.06, 1.65, 0.16],
      [2.1, -0.05, 1.25, 0.2],
      [-2.4, 0.08, -1.1, 0.28]
    ].forEach(([rx, ry, rz, rr]) => {
      const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(rr, 0), rockMat);
      rock.position.set(rx, ry, rz);
      scene.add(rock);
    });

    // Target Ice Core Sample Zone Beacon inside Shadowed Crater Edge
    const targetZone = new THREE.Group();
    targetZone.position.set(1.35, -0.18, 0.25);
    const targetRing = new THREE.Mesh(
      new THREE.RingGeometry(0.32, 0.42, 32),
      new THREE.MeshBasicMaterial({ color: 0x00e5ff, side: THREE.DoubleSide })
    );
    targetRing.rotation.x = -Math.PI / 2;
    targetZone.add(targetRing);
    scene.add(targetZone);

    // User's Exact Built 3D Spacecraft / Rover on Surface
    const craft = buildConfiguredSpacecraftMesh({
      platform,
      structure,
      solar,
      battery,
      antenna,
      instruments: equippedInstruments
    });
    craft.position.set(-1.35, 0.54, 0.15);
    scene.add(craft);

    const wheels = craft.userData.wheels || [];

    // Articulated Robotic Sampling Arm + Drill / Spectrometer Head
    const armPivot = new THREE.Group();
    armPivot.position.set(0.55, 0.24, 0.08);
    craft.add(armPivot);

    const boom = new THREE.Mesh(
      new THREE.BoxGeometry(0.95, 0.07, 0.07),
      new THREE.MeshStandardMaterial({ color: 0xf8fafc, metalness: 0.4, roughness: 0.3 })
    );
    boom.position.x = 0.45;
    armPivot.add(boom);

    const drillBit = new THREE.Mesh(
      new THREE.ConeGeometry(0.055, 0.48, 16),
      new THREE.MeshStandardMaterial({ color: 0x00e5ff, emissive: 0x00e5ff, emissiveIntensity: 0.45 })
    );
    drillBit.rotation.x = Math.PI;
    drillBit.position.set(0.92, -0.22, 0);
    armPivot.add(drillBit);

    // Holographic Spectral Scan Wave Cone
    const scanCone = new THREE.Mesh(
      new THREE.ConeGeometry(0.45, 0.85, 24, 1, true),
      new THREE.MeshBasicMaterial({
        color: 0x00e5ff,
        transparent: true,
        opacity: 0.32,
        side: THREE.DoubleSide
      })
    );
    scanCone.position.set(0.92, -0.35, 0);
    scanCone.visible = false;
    armPivot.add(scanCone);

    // Sample Canister Glow Indicator on Deck
    const canister = new THREE.Mesh(
      new THREE.CylinderGeometry(0.11, 0.11, 0.22, 18),
      new THREE.MeshStandardMaterial({
        color: 0x1e293b,
        emissive: 0x00e5ff,
        emissiveIntensity: 0
      })
    );
    canister.position.set(0.15, 0.44, -0.15);
    craft.add(canister);

    // Regolith particle spray during drilling
    const sprayParticles = [];
    for (let i = 0; i < 28; i++) {
      const sp = new THREE.Mesh(
        new THREE.SphereGeometry(0.025, 6, 6),
        new THREE.MeshBasicMaterial({ color: 0x94a3b8 })
      );
      sp.visible = false;
      scene.add(sp);
      sprayParticles.push({ mesh: sp, a: (i / 28) * Math.PI * 2, offset: Math.random() });
    }

    const handleResize = () => {
      if (!container) return;
      const w = container.clientWidth;
      const h = container.clientHeight;
      if (w > 0 && h > 0) {
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h, false);
      }
    };
    const resizeObserver = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(handleResize) : null;
    if (resizeObserver) resizeObserver.observe(container);
    window.addEventListener('resize', handleResize);

    // Interactive 3D camera orbit + gentle continuous post-landing panorama sweep
    let isOrbitDragging = false;
    let prevPointerX = 0;
    let userOrbitOffset = 0;

    const onSurfacePointerDown = (e) => {
      isOrbitDragging = true;
      prevPointerX = e.clientX;
    };
    const onSurfacePointerMove = (e) => {
      if (!isOrbitDragging) return;
      userOrbitOffset += (e.clientX - prevPointerX) * 0.008;
      prevPointerX = e.clientX;
    };
    const onSurfacePointerUp = () => {
      isOrbitDragging = false;
    };

    const surfaceDom = renderer.domElement;
    surfaceDom.addEventListener('pointerdown', onSurfacePointerDown);
    window.addEventListener('pointermove', onSurfacePointerMove);
    window.addEventListener('pointerup', onSurfacePointerUp);

    let animId;
    const clock = new THREE.Clock();

    const animate = () => {
      animId = requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const step = opsStepRef.current;

      targetRing.scale.setScalar(1 + Math.sin(t * 3) * 0.08);

      // Gentle 3D orbital camera sweep around the landed spacecraft (also draggable 360°)
      const autoOrbit = !isOrbitDragging && step === 'SELECT' ? Math.sin(t * 0.35) * 0.45 : 0;
      const orbitTheta = 0.65 + autoOrbit + userOrbitOffset;
      const focusX = craft.position.x * 0.45;
      camera.position.set(
        focusX + Math.sin(orbitTheta) * 5.2,
        1.95,
        Math.cos(orbitTheta) * 5.2
      );
      camera.lookAt(focusX, 0.55, 0.1);

      if (step === 'MOVING') {
        craft.position.x += (0.05 - craft.position.x) * 0.045;
        wheels.forEach((w) => {
          w.rotation.z -= 0.12;
        });
      } else if (step === 'READY_COLLECT') {
        craft.position.x += (0.08 - craft.position.x) * 0.08;
      }

      if (step === 'COLLECTING') {
        // Extend robotic arm down to regolith & rotate drill/scan
        armPivot.rotation.z += (-0.42 - armPivot.rotation.z) * 0.08;
        drillBit.rotation.y = t * 18;
        scanCone.visible = true;
        scanCone.material.opacity = 0.2 + Math.sin(t * 10) * 0.15;

        sprayParticles.forEach((p) => {
          p.mesh.visible = true;
          const cycle = (t * 2.2 + p.offset) % 1;
          const r = cycle * 0.42;
          p.mesh.position.set(
            1.38 + Math.cos(p.a) * r,
            -0.15 + Math.sin(cycle * Math.PI) * 0.28,
            0.25 + Math.sin(p.a) * r
          );
        });
      } else {
        // Stow robotic arm
        armPivot.rotation.z += (0.18 - armPivot.rotation.z) * 0.08;
        scanCone.visible = false;
        sprayParticles.forEach((p) => {
          p.mesh.visible = false;
        });
      }

      if (step === 'COMPLETE') {
        canister.material.emissiveIntensity = 0.95;
      }

      renderer.render(scene, camera);
    };
    animate();

    return () => {
      cancelAnimationFrame(animId);
      if (resizeObserver) resizeObserver.disconnect();
      surfaceDom.removeEventListener('pointerdown', onSurfacePointerDown);
      window.removeEventListener('pointermove', onSurfacePointerMove);
      window.removeEventListener('pointerup', onSurfacePointerUp);
      window.removeEventListener('resize', handleResize);
      renderer.dispose();
    };
  }, [platform, structure, solar, battery, antenna, equippedInstruments]);

  const activeInstObj = SUBSYSTEMS.instruments.find((i) => i.id === selectedInstId) || SUBSYSTEMS.instruments[0];
  const hasSpectrometerOrDrill =
    equippedInstruments.includes('spectrometer') || equippedInstruments.includes('drill');

  return (
    <div className="relative w-full max-w-6xl mx-auto px-4 pt-2 pb-6">
      <div className="relative glass-card rounded-2xl overflow-hidden h-[500px] sm:h-[550px]">
        {/* Fullscreen 3D Lunar South Pole Surface */}
        <div ref={containerRef} className="w-full h-full cursor-grab active:cursor-grabbing" />

        {/* Subtle Site Tag Top-Left */}
        <div className="absolute top-4 left-4 px-3 py-1.5 rounded-lg bg-[#070B14]/80 border border-cyan-500/30 font-mono-tech text-xs text-cyan-300">
          SURFACE OPS // {landingSite.name.toUpperCase()} ({landingSite.coords})
        </div>

        {/* STEP 1 ONLY: Sleek Translucent Floating Right Panel */}
        {opsStep === 'SELECT' && (
          <div className="absolute top-4 right-4 bottom-4 w-[90%] max-w-sm glass-card-selected rounded-xl p-5 flex flex-col justify-between z-20 transition-all duration-300">
            <div>
              <div className="text-[11px] font-mono-tech text-cyan-400 tracking-wider mb-1">
                SURFACE OPS // STEP 01
              </div>
              <h3 className="font-display text-2xl font-bold text-white mb-2">
                SELECT SCIENTIFIC INSTRUMENT
              </h3>
              <p className="text-xs text-slate-300 mb-4">
                Choose your primary payload instrument to deploy onto the shadowed crater boundary.
              </p>

              <div className="space-y-2.5">
